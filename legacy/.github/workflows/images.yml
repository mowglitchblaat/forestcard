name: Copie des images
# Recopie chaque nuit les nouvelles images des cartes de Supabase vers le site (dossier img/),
# pour qu'elles soient servies par GitHub et ne consomment plus le quota Supabase.
on:
  schedule:
    - cron: '23 2 * * *'   # chaque nuit vers 4h (heure de Paris)
  workflow_dispatch: {}    # bouton « Run workflow » dans l'onglet Actions
permissions:
  contents: write
  pages: write
concurrency: copie-images
jobs:
  copier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copier les nouvelles images
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node outils/copier-images.mjs
      - name: Publier
        run: |
          git add img
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git config user.name "copie-images"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Images : copie depuis Supabase"
          git pull -q --rebase && git push -q
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null 2>&1 || true
        env:
          GH_TOKEN: ${{ github.token }}
