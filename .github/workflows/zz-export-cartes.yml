# Temporary (Claude, balance test): exports the published cards with the public key, commits them
# to this branch, then the branch is deleted. Never merged.
name: Export cartes (temporaire)
on:
  push:
    branches: ['tmp/export-cartes']
permissions:
  contents: write
jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Export
        env:
          K: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          H=(-H "apikey: $K"); case "$K" in sb_*) ;; *) H+=(-H "Authorization: Bearer $K");; esac
          curl -sS "${H[@]}" "https://bjsvqikjnvaomyoifiml.supabase.co/rest/v1/cartes?select=id,nom,type,atq,pv,actif,passif,ultime,effet,description,raretes(nom,couleur,poids),collections(nom),variantes_carte(nom,image_path)&actif=eq.true&order=nom" -o export-cartes.json -w '%{http_code}\n' | tee code.txt
          grep -q '^200' code.txt || { head -c 300 export-cartes.json; exit 1; }
          python3 -c "import json;print(len(json.load(open('export-cartes.json'))),'cartes')"
          git config user.name "export-cartes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add export-cartes.json && git commit -q -m "Export des cartes" && git push -q
