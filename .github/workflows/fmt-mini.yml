# The mini-coffres-images branch was written in a session without the npm registry: this formats the code
# (vp fmt) and commits it to the branch. Removed before merging.
name: Format (mini-coffres-images)
on:
  push:
    branches: [mini-coffres-images]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp fmt
      - run: |
          if git diff --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format (mini-coffres-images branch)"
          git push
