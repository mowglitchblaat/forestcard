# Format, lint, types and every test (engine, pages, the author's rule tests) on every push and pull
# request. A red cross = the last change broke a game
# rule or a page.
name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ready 2>&1 | tee ready.txt; exit ${PIPESTATUS[0]}
        shell: bash
      # The errors as annotations, readable through the API when job logs are not (tools/node-only).
      - if: failure()
        run: grep -E "error|Error|FAIL|×|✗|failed|Formatting|\.(ts|tsx|js|md|json|yml|yaml)( |$)" ready.txt | head -50 | sed 's/\x1b\[[0-9;]*m//g' | while IFS= read -r l; do echo "::warning title=ready::$l"; done
