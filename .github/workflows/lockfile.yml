# The overlay-3d branch was written in a session without the npm registry: this resolves the new
# dependencies (pixi.js, pixi-filters) into pnpm-lock.yaml and formats the code (vp fmt), then commits
# both to the branch. Removed before merging.
name: Lockfile and format
on:
  push:
    branches: [overlay-3d]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec vp fmt
      - run: |
          if git diff --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Lockfile and format (overlay-3d branch)"
          git push
  # the site builds and assembles with the new page (pages.yml does it on main only)
  build:
    needs: fix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: overlay-3d
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run pages
      - run: ls -la _site/combat-3d.html _site/overlay-3d
