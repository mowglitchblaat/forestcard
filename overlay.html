<script>
const WS_URL='ws://127.0.0.1:8080/';
const STORAGE='https://bjsvqikjnvaomyoifiml.supabase.co/storage/v1/object/public/cartes/';
const box=document.getElementById('box'),titre=document.getElementById('titre'),zone=document.getElementById('cartes');
const SB='https://bjsvqikjnvaomyoifiml.supabase.co',KEY='sb_publishable_-3cPqDCyE-zhb3z5r6dPhg_DJFKGAI6';
const packwrap=document.getElementById('packwrap'),pack=document.getElementById('pack'),rays=document.getElementById('rays'),flash=document.getElementById('flash');
const imgCache={};let imgErr='';
// Image du booster : celle envoyée par Streamer.bot (image_path) sinon lue dans la base d'après le nom du booster
async function boosterImg(d){
  let p=d.image_path||d.booster_image||d.image_booster||null;
  if(!p&&d.booster){
    if(d.booster in imgCache)p=imgCache[d.booster];
    else{try{const c=new AbortController();setTimeout(()=>c.abort(),2500);
      const r=await fetch(SB+'/rest/v1/types_boosters?select=image_path&nom=ilike.'+encodeURIComponent(d.booster)+'&limit=1',{headers:{apikey:KEY},signal:c.signal});
      const j=await r.json();p=(Array.isArray(j)&&j[0]&&j[0].image_path)||null;
      imgErr=!r.ok?'erreur '+r.status+' : '+((j&&j.message)||''):!j.length?'aucun booster lisible nommé « '+d.booster+' » (nom différent, ou table non lisible sans connexion)':!p?'ce booster n\'a pas d\'image enregistrée':''}catch(x){p=null;imgErr='lecture impossible : '+x}
      imgCache[d.booster]=p}}
  if(!p)return null;
  const url=/^https?:/.test(p)?p:STORAGE+p;
  await new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src=url;setTimeout(r,3000)});
  return url;
}
// Animation d'ouverture : le paquet tombe, tremble, une lumière jaillit, le haut s'arrache puis les cartes apparaissent
async function ouverture(d){
  const url=await boosterImg(d);
  if(DEBUG){dbgMsg+='\nImage du booster : '+(url||'aucune (paquet générique) — '+imgErr);majDbg()}
  const mkl=cl=>{let e;if(url){e=new Image();e.src=url}else{e=document.createElement('div');e.className='fb';e.textContent=d.booster||'Booster'}e.classList.add('lay',cl);return e};
  pack.querySelectorAll('.lay').forEach(e=>e.remove());rays.getAnimations().forEach(a=>a.cancel());pack.getAnimations().forEach(a=>a.cancel());
  const bot=mkl('bot'),top=mkl('top');pack.append(bot,top);
  zone.style.opacity=0;packwrap.style.opacity=1;box.classList.add('on');
  pack.animate([{transform:'translateY(-70vh) scale(.6) rotate(-10deg)',opacity:0},{transform:'translateY(3vh) scale(1.05) rotate(3deg)',opacity:1,offset:.7},{transform:'none',opacity:1}],{duration:900,easing:'cubic-bezier(.2,.8,.3,1)',fill:'both'});
  await wait(1100);
  pack.animate([{transform:'none'},{transform:'translate(-.6vw,0) rotate(-2deg)'},{transform:'translate(.6vw,0) rotate(2deg)'},{transform:'translate(-1vw,0) rotate(-3deg) scale(1.03)'},{transform:'translate(1vw,0) rotate(3deg) scale(1.05)'},{transform:'translate(-1.4vw,0) rotate(-4deg) scale(1.08)'},{transform:'translate(1.4vw,0) rotate(4deg) scale(1.1)'}],{duration:1100,easing:'ease-in',fill:'both'});
  pack.animate([{filter:'drop-shadow(0 0 0 rgba(255,215,120,0))'},{filter:'drop-shadow(0 0 5vh rgba(255,215,120,1)) brightness(1.35)'}],{duration:1100,easing:'ease-in',fill:'both',composite:'add'});
  rays.animate([{opacity:0,transform:'scale(.3) rotate(0deg)'},{opacity:.5,transform:'scale(.8) rotate(25deg)'}],{duration:1100,fill:'both'});
  await wait(1100);
  flash.animate([{opacity:0},{opacity:1,offset:.25},{opacity:0}],{duration:900});
  rays.animate([{opacity:.9,transform:'scale(.8) rotate(25deg)'},{opacity:0,transform:'scale(1.7) rotate(80deg)'}],{duration:1400,fill:'both',easing:'ease-out'});
  top.animate([{transform:'none',opacity:1},{transform:'translate(3vw,-38vh) rotate(22deg)',opacity:0}],{duration:800,easing:'cubic-bezier(.3,0,.8,.4)',fill:'both'});
  bot.animate([{transform:'scale(1.1)',opacity:1},{transform:'scale(1.35) translateY(10vh)',opacity:0}],{duration:800,fill:'both'});
  await wait(450);
  zone.style.opacity=1;
  await wait(1100);
  packwrap.style.opacity=0;
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const queue=[];let busy=false;

// Mode debug : ajoute ?debug à l'adresse pour afficher l'état de la connexion
const DEBUG=location.search.includes('debug');
const dbg=document.getElementById('dbg');
let dbgEtat='connexion...',dbgMsg='(aucun message reçu)';
function majDbg(){if(!DEBUG)return;dbg.style.display='block';dbg.textContent='WebSocket : '+dbgEtat+'\nDernier message : '+dbgMsg}
majDbg();

// Accepte le message tel quel, en texte, dans un tableau, ou emballé dans un objet
function extraire(d){
  if(typeof d==='string'){try{d=JSON.parse(d)}catch(x){return null}}
  if(Array.isArray(d))d=d[0];
  if(d&&d.data&&!d.cartes)d=d.data;
  if(typeof d==='string'){try{d=JSON.parse(d)}catch(x){return null}}
  if(d&&d.ouvrir_booster)d=d.ouvrir_booster;
  if(typeof d==='string'){try{d=JSON.parse(d)}catch(x){return null}}
  return (d&&Array.isArray(d.cartes))?d:null;
}

function connect(){
  dbgEtat='connexion...';majDbg();
  const ws=new WebSocket(WS_URL);
  ws.onopen=()=>{
    dbgEtat='connecté (abonnement envoyé)';majDbg();
    ws.send(JSON.stringify({request:'Subscribe',id:'sub-custom',events:{General:['Custom']}}));
  };
  ws.onmessage=e=>{
    console.log('Message reçu :',e.data);
    dbgMsg=String(e.data).slice(0,300);majDbg();
    let d;try{d=JSON.parse(e.data)}catch(x){return}
    const r=extraire(d);
    if(r){queue.push(r);run()}
    else{dbgMsg='Format non reconnu (pas de "cartes") : '+dbgMsg;majDbg()}
  };
  ws.onclose=()=>{dbgEtat='déconnecté, nouvel essai...';majDbg();setTimeout(connect,3000)};
  ws.onerror=()=>ws.close();
}
async function run(){
  if(busy)return;busy=true;
  while(queue.length){
    const d=queue.shift();
    titre.textContent=`${d.pseudo} ouvre un ${d.booster} !`;
    zone.innerHTML='';
    const els=d.cartes.map(c=>{
      const el=document.createElement('div');el.className='c';
      el.style.setProperty('--col',c.couleur||'#fff');
      el.innerHTML='<div class="in"><div class="b"></div><div class="f"></div></div>';
      const f=el.querySelector('.f');
      if(c.image){const i=new Image();i.src=STORAGE+c.image;f.appendChild(i)}
      else f.innerHTML='<span></span>',f.firstChild.textContent=c.carte;
      zone.appendChild(el);return el;
    });
    await ouverture(d);
    for(const el of els){el.classList.add('flip');await wait(1200)}
    await wait(6000);
    box.classList.remove('on');
    await wait(800);packwrap.style.opacity=0;zone.style.opacity=1;
  }
  busy=false;
}
connect();
// Test : ajoute ?test à l'adresse de la page pour voir une ouverture factice
if(location.search.includes('test')){
  setTimeout(()=>{queue.push({pseudo:'Test',booster:new URLSearchParams(location.search).get('booster')||'Booster de test',cartes:
    [['Carte A','#9ca3af'],['Carte B','#3b82f6'],['Carte C','#f59e0b'],['Carte D','#9ca3af'],['Carte E','#3b82f6']]
    .map(x=>({carte:x[0],couleur:x[1]}))});run()},1000);
}
</script></body></html>
