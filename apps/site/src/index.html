// la scène : overlay des boosters ou page de combat, en plein écran par-dessus le site (mêmes animations qu'en live)
function scene(page,msg){return new Promise(ok=>{let sc=$('#jscene');if(!sc){sc=document.createElement('div');sc.id='jscene';document.body.appendChild(sc)}
  sc.innerHTML=`<button class="sec" id="jfermer">✕ Fermer</button><iframe src="${page}" title="Animation"></iframe>`;sc.classList.add('on');document.body.style.overflow='hidden';

   const t=await r.text();let j=null;try{j=JSON.parse(t)}catch(e){}return {ok:r.ok,json:j,txt:t}}catch(e){uiAlert('Le serveur du jeu ne répond pas. Réessaie dans un instant.');return null}}

/* ---------- Ceintures : le championnat (33-championnat.sql) ---------- */
/* L'histoire de chaque ceinture : un bloc par règne (du plus récent au plus ancien), qui raconte comment il a commencé,
   ses défenses et comment il a fini ; les périodes de vacance entre deux règnes (38-ceintures-histoire.sql) */
function histoireCeintures(E){
  const T=x=>new Date(x).getTime(),quand=x=>{const d=new Date(x);return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})};
  const duree=ms=>{const m=Math.max(1,Math.round(ms/6e4));if(m<60)return m+' min';const h=Math.floor(m/60);if(h<48)return h+' h '+String(m%60).padStart(2,'0');return Math.floor(h/24)+' jours'};
  const b=p=>`<b>${esc(p||'?')}</b>`,ligne=(ic,txt,t)=>`<div style="display:flex;gap:6px;margin:3px 0"><span>${ic}</span><span style="flex:1">${txt}</span><small style="opacity:.6;white-space:nowrap">${t?quand(t):''}</small></div>`;
  const autre=(c,id)=>c.challenger===id?c.pseudo_adversaire:c.pseudo_challenger;
  const bloc=d=>{const D=DIVS[d],R=E.regnes.filter(r=>r.division===d).sort((x,y)=>T(x.debut)-T(y.debut)),C=(E.combats||[]).filter(c=>c.division===d);
    const pres=(a,t)=>Math.abs(T(a)-T(t))<5000;
    // le règne en place juste avant un combat (aucun : ceinture vacante)
    const avant=c=>R.find(r=>T(r.debut)<T(c.fini_le)-5000&&(!r.fin||T(r.fin)>=T(c.fini_le)-5000));
    const out=[];
    R.forEach((r,k)=>{const L=[],deb=C.find(c=>pres(c.fini_le,r.debut)&&c.gagnant===r.joueur);
      L.push(deb?ligne('👑',`Prend la ceinture${deb.pour_champion?'':' vacante'} en battant ${b(autre(deb,r.joueur))}`,r.debut):ligne('👑','Devient champion',r.debut));
      C.filter(c=>avant(c)===r&&(c.gagnant===r.joueur||c.gagnant==null)).sort((x,y)=>T(x.fini_le)-T(y.fini_le))
       .forEach(c=>L.push(c.gagnant==null?ligne('🤝',`Match nul contre ${b(autre(c,r.joueur))} : garde la ceinture`,c.fini_le):ligne('🛡️',`Défend contre ${b(autre(c,r.joueur))}`,c.fini_le)));
      if(r.fin){const fin=C.find(c=>pres(c.fini_le,r.fin)&&c.gagnant&&c.gagnant!==r.joueur);
        L.push(r.raison==='refus'?ligne('🏳️','3e refus de défi : la ceinture lui est retirée',r.fin):r.raison==='inactivite'?ligne('⏳','7 jours sans combat pour le titre : la ceinture lui est retirée',r.fin)
          :ligne('⚔️',`Battu par ${b(fin?(fin.challenger===r.joueur?fin.pseudo_adversaire:fin.pseudo_challenger):'?')}`,r.fin))}
      const nd=r.defenses||0,tete=`<div style="display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline"><span style="font-size:17px">👑 ${b(r.pseudo)}</span><small style="opacity:.75">${r.fin?'a régné '+duree(T(r.fin)-T(r.debut)):'en cours depuis '+duree(Date.now()-T(r.debut))} · ${nd} défense${nd>1?'s':''}${r.primes?` · 💰 ${r.primes} gold de primes`:''}</small></div>`;
      out.push(`<div style="border-left:3px solid ${r.fin?'#555':'#fbbf24'};padding:4px 0 4px 10px;margin:8px 0">${tete}${L.join('')}</div>`);
      // vacance entre ce règne et le suivant (ceinture retirée sans combat)
      const n=R[k+1];if(r.fin&&r.raison!=='defaite'){const nuls=C.filter(c=>!avant(c)&&c.gagnant==null&&T(c.fini_le)>T(r.fin)&&(!n||T(c.fini_le)<T(n.debut)));
        out.push(`<div style="opacity:.7;margin:4px 0 4px 13px">🏳️ Vacante${n?' pendant '+duree(T(n.debut)-T(r.fin)):' depuis '+duree(Date.now()-T(r.fin))}${nuls.map(c=>`<br><small>🤝 ${b(c.pseudo_challenger)} et ${b(c.pseudo_adversaire)} font match nul (${quand(c.fini_le)})</small>`).join('')}</div>`)}});
    const nulsDebut=C.filter(c=>!avant(c)&&c.gagnant==null&&(!R[0]||T(c.fini_le)<T(R[0].debut)));
    if(!R.length||nulsDebut.length)out.unshift(`<div style="opacity:.7;margin:4px 0 4px 13px">🏳️ Vacante depuis le lancement${nulsDebut.map(c=>`<br><small>🤝 ${b(c.pseudo_challenger)} et ${b(c.pseudo_adversaire)} font match nul (${quand(c.fini_le)})</small>`).join('')}</div>`);
    return `<div class="stat"><h4 style="margin:0 0 4px;display:flex;align-items:center;gap:8px"><img src="${vf('cadres/ceinture-'+d+'.webp')}" alt="" style="width:90px">${D.e} ${esc(D.nom)}</h4>${out.reverse().join('')}</div>`};
  return `<div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start">${['rare','epique','libre'].map(bloc).join('')}</div>`;
}
/* Panthéon : les plus grands règnes de toutes les ceintures, gardés pour toujours (44-pantheon.sql) : par défenses, et par durée */
function pantheon(P){
  const med=i=>['🥇','🥈','🥉'][i]||`<span style="opacity:.6;font-weight:700">${i+1}.</span>`,jr=d=>new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
  const duree=s=>{const h=Math.floor(s/3600),j=Math.floor(h/24);return j?`${j} jour${j>1?'s':''}${h%24?' '+(h%24)+' h':''}`:h?h+' h':Math.max(1,Math.round(s/60))+' min'};
  const ligne=(x,i,quoi)=>{const nd=x.defenses||0,en=!x.fin;
    return `<div style="display:flex;gap:10px;align-items:center;padding:7px 9px;margin:5px 0;border-radius:10px;background:${i===0?'linear-gradient(90deg,rgba(251,191,36,.18),transparent)':'rgba(255,255,255,.03)'};border:1px solid ${i===0?'rgba(251,191,36,.55)':'rgba(255,255,255,.06)'}">
     <span style="font-size:${i<3?22:16}px;min-width:28px;text-align:center">${med(i)}</span><img src="${vf('cadres/ceinture-'+x.division+'.webp')}" alt="" style="width:72px;flex:none">
     <div style="flex:1;min-width:0"><div><span style="font-weight:800;font-size:${i===0?17:15}px">${esc(x.pseudo||'?')}</span> <small style="opacity:.7">${esc(x.nom||'')}</small></div>
      <small style="opacity:.75">${quoi==='def'?`<span style="font-weight:700;color:#e5e7eb">${nd} défense${nd>1?'s':''}</span> · ${duree(x.secondes)}`:`<span style="font-weight:700;color:#e5e7eb">${duree(x.secondes)}</span> · ${nd} défense${nd>1?'s':''}`} · ${jr(x.debut)} → ${en?'<span style="font-weight:700;color:#fbbf24">en cours 👑</span>':jr(x.fin)}</small></div></div>`};
  const col=(t,L,q)=>`<div class="pth"><h4 style="margin:0 0 6px">${t}</h4>${L.length?L.map((x,i)=>ligne(x,i,q)).join(''):'<small>Personne pour l\'instant.</small>'}</div>`;
  // doubles et triples champions (45-pantheon-doubles.sql) : plusieurs ceintures en même temps, classés au temps total
  const multi=(x,i,nb)=>{const f=x.fois||0;
    return `<div style="display:flex;gap:10px;align-items:center;padding:7px 9px;margin:5px 0;border-radius:10px;background:${i===0?'linear-gradient(90deg,rgba(251,191,36,.18),transparent)':'rgba(255,255,255,.03)'};border:1px solid ${i===0?'rgba(251,191,36,.55)':'rgba(255,255,255,.06)'}">
     <span style="font-size:${i<3?22:16}px;min-width:28px;text-align:center">${med(i)}</span><span style="display:flex;flex-direction:column;flex:none;width:72px">${(nb===3?['libre','epique','rare']:['libre','epique']).map((d,k)=>`<img src="${vf('cadres/ceinture-'+d+'.webp')}" alt="" style="width:72px;margin-top:${k?2:0}px;filter:drop-shadow(0 1px 2px #000)">`).join('')}</span>
     <div style="flex:1;min-width:0"><div><span style="font-weight:800;font-size:${i===0?17:15}px">${esc(x.pseudo||'?')}</span>${x.en_cours?' <small style="font-weight:700;color:#fbbf24">en cours 👑</small>':''}</div>
      <small style="opacity:.75"><span style="font-weight:700;color:#e5e7eb">${duree(x.secondes)}</span> au total · ${f} fois${f>1?` · plus longue : ${duree(x.record)}`:''}</small></div></div>`};
  const colM=(t,L,nb,vide)=>`<div class="pth"><h4 style="margin:0 0 6px">${t}</h4>${L.length?L.map((x,i)=>multi(x,i,nb)).join(''):`<small>${vide}</small>`}</div>`;
  return `<h3>🏛️ Panthéon</h3><p><small>Les plus grands règnes du championnat, toutes ceintures confondues, gardés pour toujours.</small></p>
   <div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start">${col('🛡️ Le plus de défenses',P.defenses||[],'def')}${col('⏳ Les plus longs règnes',P.duree||[],'dur')}</div>
   <div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start">${colM('👑👑 Doubles champions',P.doubles||[],2,'Personne n\'a encore détenu deux ceintures en même temps.')}${colM('👑👑👑 Triples champions',P.triples||[],3,'Personne n\'a encore détenu les trois ceintures en même temps.')}</div>
   <p><small>Double champion : au moins deux ceintures en même temps (le temps passé triple compte aussi). Chaque période sans interruption compte pour une fois.</small></p>`;

const PLACES={0:{l:'🎗️ Participant',m:'#2dd4bf'},1:{l:'🥇 Vainqueur',m:'#fbbf24'},2:{l:'🥈 Finaliste',m:'#cbd5e1'},3:{l:'🥉 3e place',m:'#d97706'}};

function recompenseHtml(r){const L=[];

const coupe=m=>`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M18 8h28v10c0 9-6 16-14 16S18 27 18 18z" fill="${m}"/><path d="M18 12H9c0 9 4 13 10 13M46 12h9c0 9-4 13-10 13" fill="none" stroke="${m}" stroke-width="4"/><rect x="28" y="33" width="8" height="10" fill="${m}"/><rect x="20" y="43" width="24" height="6" rx="1" fill="${m}"/><rect x="16" y="50" width="32" height="7" rx="2" fill="#3a2a10" stroke="${m}" stroke-width="2"/></svg>`;

const echarpe=m=>`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 10c10 6 26 6 36 0l2 8c-11 7-29 7-40 0z" fill="${m}"/><path d="M22 17l-6 37 7-4 4 6 5-36zM42 17l6 37-7-4-4 6-5-36z" fill="${m}" opacity=".85"/><path d="M18 46l7-1M40 45l7 1" stroke="#0f2f2b" stroke-width="2"/></svg>`;

// format suisse (50-tournoi-suisse.sql) : classement et ronde en cours, puis winner et loser bracket
function tableauSuisseSite(T){
  const M=T.matchs||[],sw=M.filter(m=>m.phase==='suisse'),br=M.filter(m=>m.phase!=='suisse'&&!(m.phase==='revanche'&&!m.a)),pos=(x,y)=>x.position-y.position;
  const ps=p=>p?esc(p):'<span style="opacity:.5">?</span>';
  const box=m=>{const fin=!!m.gagnant,cl=id=>fin&&id&&m.gagnant===id?' w':fin&&id?' l':'',moi=m.a===user.id||m.b===user.id;
    return `<div class="tbm${m.a_l_ecran?' on':''}${moi?' moi':''}"><div class="tbp${cl(m.a)}"><span>${ps(m.pseudo_a)}</span>${m.exempt?'':`<b>${m.score_a}</b>`}</div>${m.exempt?'<div class="tbp ex"><span>exempt (victoire)</span></div>':`<div class="tbp${cl(m.b)}"><span>${ps(m.pseudo_b)}</span><b>${m.score_b}</b></div>`}</div>`};
  const col=(L,t)=>`<div class="tbc"><div class="tbh">${esc(t)}${L[0]&&L[0].format>1?' · BO'+L[0].format:''}</div><div class="tbl">${L.map(box).join('')}</div></div>`;
  const parTour=L=>[...new Set(L.map(m=>m.tour))].sort((x,y)=>x-y).map(t=>{const X=L.filter(m=>m.tour===t).sort(pos);return col(X,X[0].nom_tour)}).join('');
  const C=T.classement||[],r=Math.max(1,...sw.map(m=>m.tour));
  const cl=`<table><tr><th>#</th><th>Joueur</th><th>V-D</th><th title="Force des adversaires : total de leurs victoires">Adv.</th></tr>${C.map(x=>`<tr${x.id===user.id?' style="color:#c4b5fd"':''}><td>${x.rang<=(T.coupe||4)?'✅ ':''}${x.rang}</td><td>${esc(x.pseudo||'?')}</td><td>${x.victoires}-${x.defaites}</td><td>${x.buchholz}</td></tr>`).join('')}</table>`;
  let h=`<h4>📊 Rondes suisses · ${Math.min(r,T.rondes||r)}/${T.rondes||'?'}</h4><p><small>✅ les ${T.coupe||4} premiers à la fin des rondes vont dans le tableau final.</small></p>${cl}`;
  if(!br.length)h+=`<div class="tbg">${col(sw.filter(m=>m.tour===r).sort(pos),'Ronde '+r)}</div>`;
  else{const W=br.filter(m=>m.phase!=='loser'),Lo=br.filter(m=>m.phase==='loser');
    h+=`<h4>🏆 Winner bracket</h4><div class="tbg">${parTour(W)}</div>${Lo.length?`<h4>💀 Loser bracket</h4><div class="tbg">${parTour(Lo)}</div>`:''}`}
  return h}
function tableauSite(T){
  if(T.format==='suisse')return tableauSuisseSite(T);
  const M=T.matchs||[],nt=T.tours||1,ps=(m,id,p)=>p?esc(p):(m.exempt&&!id?'—':'<span style="opacity:.5">?</span>');
  const box=m=>{const fin=!!m.gagnant,cl=id=>fin&&id&&m.gagnant===id?' w':fin&&id?' l':'',moi=m.a===user.id||m.b===user.id;
    return `${m.petite?`<div class="tbh" style="margin-top:10px;color:#fdba74">🥉 Petite finale${m.format>1?' · BO'+m.format:''}</div>`:''}<div class="tbm${m.a_l_ecran?' on':''}${moi?' moi':''}"><div class="tbp${cl(m.a)}"><span>${ps(m,m.a,m.pseudo_a)}</span>${m.exempt?'':`<b>${m.score_a}</b>`}</div>${m.exempt?'<div class="tbp ex"><span>qualifié d\'office</span></div>':`<div class="tbp${cl(m.b)}"><span>${ps(m,m.b,m.pseudo_b)}</span><b>${m.score_b}</b></div>`}</div>`};
  let h='';for(let r=1;r<=nt;r++){const L=M.filter(m=>m.tour===r).sort((x,y)=>x.position-y.position);
    h+=`<div class="tbc"><div class="tbh">${esc(L[0]?L[0].nom_tour:'')}${L[0]&&L[0].format>1?' · BO'+L[0].format:''}</div><div class="tbl">${L.map(box).join('')}</div></div>`}
  return `<div class="tbg">${h}</div>`}

    $('#jdgo').onclick=async()=>{$('#jdgo').disabled=true;
      const d=await sb.rpc('duel_atq_jouer');if(d.error){uiAlert(jErr[d.error.message]||d.error.message);duelAtq(box);return}
      const D=d.data,M=D.manches||[];let a=0,b=0;
      for(let i=0;i<M.length;i++){const m=M[i];
        box.querySelector('.chp').innerHTML=`${tete}<div class="jsc">Manche ${i+1} · Toi <b>${a}</b> – <b>${b}</b> Bot</div><div class="jvs">${jDos()}<span class="vs">VS</span>${jDos()}</div>`;await pause(600);
        if(m.gagnant==='moi')a++;if(m.gagnant==='bot')b++;
        box.querySelector('.chp').innerHTML=`${tete}<div class="jsc">Manche ${i+1} · Toi <b>${a}</b> – <b>${b}</b> Bot${m.gagnant==='egal'?' · égalité, on rejoue !':''}</div><div class="jvs">${jCarte(m.moi,'⚔ '+m.moi.atq,'flip '+(m.gagnant==='moi'?'win':m.gagnant==='bot'?'lose':''))}<span class="vs">VS</span>${jCarte(m.bot,'⚔ '+m.bot.atq,'flip '+(m.gagnant==='bot'?'win':m.gagnant==='moi'?'lose':''))}</div>`;
        await pause(1700)}
      if(D.gagne)await refreshJoueur();duelAtq(box,true)};
    return}
  const M=E.manches||[],der=M[M.length-1];
  box.innerHTML=`<div class="chp jdu fini">${tete}${der?`<div class="jvs">${jCarte(der.moi,'⚔ '+der.moi.atq,der.gagnant==='moi'?'win':'lose')}<span class="vs">VS</span>${jCarte(der.bot,'⚔ '+der.bot.atq,der.gagnant==='bot'?'win':'lose')}</div>`:''}${fin(E)}${recap(M)}</div>`;

  box.innerHTML=`<div class="chp jtk${fini?' fini':''}">${tete}${lots}<div class="tkg">${G.map((k,i)=>{const R=TK_R[k]||[k,'#888'];return `<div class="tkc${fini?' vu':''}${fini&&k===E.gagnant?' tkw':''}" data-k="${esc(k)}" style="--c:${R[1]}"><div class="tkv${k==='ggez'?' gz':''}${k==='booster'?' bx':''}"><span>${k==='booster'?'📦':'◆'}</span><b>${esc(R[0])}</b></div>${fini?'':'<canvas></canvas>'}</div>`}).join('')}</div>
   ${fini?res():'<div class="jbt"><small>Gratte au doigt ou à la souris</small><button class="sec" id="tkall">✨ Tout gratter</button></div>'}</div>`;
  if(fini)return;
  const cells=[...box.querySelectorAll('.tkc')];let fin=false;
  const toutVu=async()=>{if(fin||!cells.every(c=>c.classList.contains('vu')))return;fin=true;
    cells.forEach(c=>{if(c.dataset.k===E.gagnant)c.classList.add('tkw')});
    const d=await sb.rpc('ticket_encaisser');if(d.error){uiAlert(jErr[d.error.message]||d.error.message);return}
    if(d.data.gain>0)await refreshJoueur();
    await pause(900);dessinerTicket(box,d.data)};   // 3 × 📦 : le booster est ajouté côté Supabase au moment d'encaisser
  const reveler=c=>{if(c.classList.contains('vu'))return;c.classList.add('vu');toutVu()};
  dosActif().then(dos=>cells.forEach(c=>{
    let bas=false,dernier=null;const cv=c.querySelector('canvas'),W=cv.width=c.clientWidth*2,H=cv.height=c.clientHeight*2,x=cv.getContext('2d'),N=8,M=11,touche=new Set();
    const peindre=im=>{x.globalCompositeOperation='source-over';const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#1f3a26');g.addColorStop(1,'#0f1f15');x.fillStyle=g;x.fillRect(0,0,W,H);
      if(im)x.drawImage(im,0,0,W,H);else{x.fillStyle='rgba(255,255,255,.06)';for(let k=-H;k<W;k+=18){x.fillRect(k,0,8,H*2)}x.font=`${W*.36}px serif`;x.textAlign='center';x.textBaseline='middle';x.fillText('🌲',W/2,H/2)}
      x.fillStyle='rgba(0,0,0,.45)';x.fillRect(0,H-W*.2,W,W*.2);x.fillStyle='#fde68a';x.font=`700 ${W*.11}px system-ui`;x.textAlign='center';x.textBaseline='middle';x.fillText('GRATTE',W/2,H-W*.1);x.globalCompositeOperation='destination-out';dernier=null};
    if(dos&&dos.image){const im=new Image();im.onload=()=>peindre(im);im.onerror=()=>peindre(null);im.src=img(dos.image);peindre(null)}else peindre(null);
    const gratter=e=>{const b=cv.getBoundingClientRect(),px=(e.clientX-b.left)/b.width*W,py=(e.clientY-b.top)/b.height*H,rr=W*.16;
      x.lineWidth=rr*2;x.lineCap='round';x.beginPath();if(dernier){x.moveTo(dernier[0],dernier[1]);x.lineTo(px,py);x.stroke()}x.arc(px,py,rr,0,7);x.fill();dernier=[px,py];
      for(let i=0;i<N;i++)for(let j=0;j<M;j++){const cx=(i+.5)*W/N,cy=(j+.5)*H/M;if(Math.hypot(cx-px,cy-py)<rr*1.1)touche.add(i+','+j)}
      if(touche.size>N*M*.5)reveler(c)};
    cv.addEventListener('pointerdown',e=>{bas=true;dernier=null;cv.setPointerCapture(e.pointerId);gratter(e)});
    cv.addEventListener('pointermove',e=>{if(bas)gratter(e)});
    const stop=()=>{bas=false;dernier=null};cv.addEventListener('pointerup',stop);cv.addEventListener('pointercancel',stop);
  }));
  $('#tkall').onclick=()=>cells.forEach(reveler);
}

const dkTropRare=id=>{if(!dkDiv)return false;const i=rangRar(rarOf[id])[0];return i<9&&i<DIVS[dkDiv].max};

const dkLibre=n=>DK_T.reduce((s,t)=>s+Math.max(0,n[t]-3),0);   // cartes posées sur la case libre

  if(deck.size>=DK_N)return 'Deck complet : 10 cartes.';

  return `Plus de place pour ${t==='magie'?'une magie':t==='piege'?'un piège':'un combattant'} : le deck se compose de 3 combattants, 3 magies, 3 pièges et 1 carte libre (déjà prise).`}

function dkCartes(){   // une tuile par carte (même si plusieurs versions), quantités additionnées
  const M=new Map();collData.forEach(x=>{const c=x.variantes_carte.cartes,o=M.get(c.id);if(o)o.quantite+=x.quantite||0;else M.set(c.id,{...x,quantite:x.quantite||0})});return [...M.values()]}
function drawDeck(){

  $('#dkl').innerHTML=`
   ${decksOK?`<div class="dkh"><select id="dsel" aria-label="Mes decks">${selDeck?'':`<option value="" selected>✏️ ${esc(dkNom||'Nouveau deck')}${dkSale()?' (non enregistré)':''}</option>`}${opts}</select><button id="dnew" class="sec" title="Commencer un deck vide">➕ Nouveau</button></div>`:''}
   <div class="dkc"><span class="${n.combattant>=3?'ok':''}">⚔️ ${Math.min(3,n.combattant)}/3</span><span class="${n.magie>=3?'ok':''}">✨ ${Math.min(3,n.magie)}/3</span><span class="${n.piege>=3?'ok':''}">🪤 ${Math.min(3,n.piege)}/3</span><span class="${libre.length?'ok':''}">★ ${Math.min(1,libre.length)}/1</span><b class="${ok?'ok':''}">${deck.size}/10</b></div>
   <div class="dks">${DK_T.map((t,r)=>[0,1,2].map(i=>slot(pos[t][i],t)).join('')+(r===1?slot(libre[0],null,true):'<div></div>')).join('')}</div>
   ${libre.length>1?`<div class="dkx"><span>⚠️ ${libre.length-1} carte${libre.length>2?'s':''} en trop : il faut 3 combattants, 3 magies, 3 pièges et 1 seule carte libre. Retire ${libre.length>2?'celles-ci':'celle-ci'} :</span><div class="dkxs">${libre.slice(1).map(x=>slot(x,null,true)).join('')}</div></div>`:''}
   ${enCombat?`<div class="dkok">⚔️ C'est ton deck de combat actuel${ok?'':' — mais il ne respecte plus la règle, corrige-le'}</div>`:''}
   <div class="dka">
    <button id="dplay" ${ok&&!enCombat?'':'disabled'} title="10 cartes : 3 combattants, 3 magies, 3 pièges + 1 libre">${enCombat&&ok?'✓ Deck de combat':ok?'⚔️ Utiliser pour les combats':deck.size>=DK_N?'⚠️ Composition à corriger':`⚔️ Encore ${DK_N-deck.size} carte${DK_N-deck.size>1?'s':''}`}</button>
    ${decksOK?`<button id="dsave" class="sec" ${ok&&(dkSale()||!selDeck)?'':'disabled'}>💾 Enregistrer</button>`:''}
    <div class="dkb"><button id="clr" class="sec" ${deck.size?'':'disabled'}>🧹 Vider</button>${decksOK&&selDeck?'<button id="dren" class="sec">✏️ Renommer</button><button id="ddl" class="sec">🗑 Supprimer</button>':''}</div>
   </div>${decksOK?'':'<small>Decks multiples indisponibles pour le moment (l\'admin doit lancer 09-decks-multiples.sql dans Supabase).</small>'}`;
  // ---- barre fixe en bas (téléphone) ----
  $('#dkm').innerHTML=`<span><b class="${ok?'ok':''}">${deck.size}/10</b> · ⚔️${n.combattant} ✨${n.magie} 🪤${n.piege}</span><button id="dplay2" ${ok&&!enCombat?'':'disabled'}>${enCombat?'✓ En combat':'⚔️ Utiliser'}</button>`;
  $('#dkl').insertAdjacentHTML('afterbegin',dkModes());}
  dkModesBrancher();
  // ---- colonne de droite : filtres + cartes ----
  const rars=[...new Map(tous.map(x=>{const r=x.variantes_carte.cartes.raretes;return [r.nom,r]})).values()].sort((a,b)=>rangRar(a)[0]-rangRar(b)[0]||rangRar(a)[1]-rangRar(b)[1]);
  const cols=[...new Set(tous.map(cn))].sort((a,b)=>(a=='Basique')-(b=='Basique')||a.localeCompare(b,'fr'));
  if(!$('#dkq')){$('#dkf').innerHTML=`<input id="dkq" type="search" placeholder="🔎 Chercher une carte…" value="${esc(dkF.q)}">

    $('#dkq').oninput=e=>{dkF.q=e.target.value;drawDeck()};$('#dkr').onchange=e=>{dkF.r=e.target.value;drawDeck()};$('#dkc').onchange=e=>{dkF.c=e.target.value;drawDeck()};$('#dktri').onchange=e=>{dkF.tri=e.target.value;drawDeck()}}
  $('#dkt').innerHTML=[['tout','Tout'],...DK_T.map(t=>[t,TYPES[t]])].map(([k,v])=>`<button class="${k==dkF.t?'on':'sec'}" data-dt="${k}">${v}</button>`).join('');
  $('#dkt').querySelectorAll('button').forEach(b=>b.onclick=()=>{dkF.t=b.dataset.dt;drawDeck()});
  $('#dkr').innerHTML=`<option value="tout">Toutes les raretés</option>`+rars.map(r=>`<option ${r.nom===dkF.r?'selected':''}>${esc(r.nom)}</option>`).join('');
  $('#dkc').innerHTML=`<option value="tout">Toutes les collections</option>`+cols.map(c=>`<option ${c===dkF.c?'selected':''}>${esc(c)}</option>`).join('');
  $('#dktri').value=dkF.tri;
  const q=dkF.q.trim().toLowerCase(),tri={nom:(a,b)=>String(a.variantes_carte.cartes.nom).localeCompare(b.variantes_carte.cartes.nom,'fr'),atq:(a,b)=>nz(b.variantes_carte.cartes.atq)-nz(a.variantes_carte.cartes.atq)||cmpColl(a,b),pv:(a,b)=>nz(b.variantes_carte.cartes.pv)-nz(a.variantes_carte.cartes.pv)||cmpColl(a,b),qte:(a,b)=>b.quantite-a.quantite||cmpColl(a,b)}[dkF.tri]||cmpColl;
  const L=tous.filter(x=>{const c=x.variantes_carte.cartes;return(dkF.t=='tout'||c.type==dkF.t)&&(dkF.r=='tout'||c.raretes.nom==dkF.r)&&(dkF.c=='tout'||cn(x)==dkF.c)&&(!q||String(c.nom).toLowerCase().includes(q))}).sort(tri);
  $('#dcg').innerHTML=L.length?L.map((x,i)=>{const v=x.variantes_carte,c=v.cartes,on=deck.has(c.id),bloq=!on&&!!dkRefus(c.id);
    return `<div class="dc${on?' on':''}${bloq?' bloq':''}" data-t="${TIER(c.raretes)}" style="--g:${esc(c.raretes.couleur||'#888')}"><button class="dcb" data-add="${c.id}" title="${on?'Retirer du deck':'Ajouter au deck'}">${v.image_path?`<img loading="lazy" src="${img(v.image_path)}" alt="${esc(c.nom)}">`:`<b class="dcn0">${esc(c.nom)}</b>`}${on?'<span class="dcv">✓</span>':''}</button>
      <div class="dci"><span>${TYPE_L[c.type]?TYPE_L[c.type][0]:''} ${esc(c.nom)}</span><button class="dcz" data-zi="${i}" title="Voir les détails">🔍</button></div></div>`}).join('')
   :`<p><small>${tous.length?'Aucune carte ne correspond à ces filtres.':'Tu n\'as encore aucune carte : achète un booster dans la boutique, puis ouvre-le en live avec !booster.'}</small></p>`;
  // ---- actions ----
  const redessine=()=>drawDeck();
  $('#dcg').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if(dkBascule(+b.dataset.add))redessine()});
  $('#dcg').querySelectorAll('[data-zi]').forEach(b=>b.onclick=()=>mdOpen(L,+b.dataset.zi,redessine));
  $('#dkl').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{deck.delete(+b.dataset.rm);redessine()});
  if(dkDiv)return;   // deck de championnat : ses boutons sont branchés par drawDeckChamp
  $('#clr').onclick=()=>{deck.clear();redessine()};
  const jouer=async()=>{if(!dkValide()){uiAlert('Il faut exactement 10 cartes : 3 combattants, 3 magies, 3 pièges et 1 carte libre.');return}
    if(decksOK&&(dkSale()||!selDeck)&&!(await dkSauver()))return;
    const {error}=await sb.rpc('enregistrer_deck',{p_cartes:[...deck]});
    if(error){uiAlert({DECK_TAILLE_INVALIDE:'Il faut exactement 10 cartes.',DECK_COMPOSITION_INVALIDE:'Il faut au moins 3 cartes de chaque type.'}[error.message]||error.message);return}
    dkCombat=new Set(deck);redessine();uiAlert('⚔️ Deck de combat enregistré ! Il sera utilisé pour tes prochains combats.')};
  $('#dplay').onclick=jouer;$('#dplay2').onclick=jouer;
  if(!decksOK)return;
  $('#dsave').onclick=async()=>{if(await dkSauver())redessine()};
  $('#dsel').onchange=async e=>{const id=e.target.value;if(dkSale()&&deck.size&&!(await uiConfirm('Tes changements sur ce deck ne sont pas enregistrés. Changer de deck quand même ?',{ok:'Changer de deck'}))){e.target.value=selDeck;return}
    const d=savedDecks.find(x=>String(x.id)===String(id));if(!d)return;
    const own=new Set(collData.map(x=>x.variantes_carte.cartes.id)),ids=(d.cartes||[]).filter(i=>own.has(i));
    if(ids.length<(d.cartes||[]).length)uiAlert((d.cartes.length-ids.length)+' carte(s) de ce deck ne sont plus dans ta collection.');
    selDeck=String(d.id);dkNom='';deck=new Set(ids);dkSrc=dkCle(new Set(d.cartes||[]));redessine()};
  $('#dnew').onclick=async()=>{if(savedDecks.length>=10){uiAlert('Tu as déjà 10 decks enregistrés : supprime-en un d\'abord.');return}
    if(dkSale()&&deck.size&&!(await uiConfirm('Tes changements sur ce deck ne sont pas enregistrés. Commencer un nouveau deck quand même ?',{ok:'Nouveau deck'})))return;
    const nom=((await uiPrompt('Nom du nouveau deck :',''))||'').trim();if(!nom)return;
    selDeck='';dkNom=nom.slice(0,30);deck=new Set();dkSrc='';redessine()};
  const ren=$('#dren');if(ren)ren.onclick=async()=>{const d=savedDecks.find(x=>String(x.id)===String(selDeck));if(!d)return;
    const nom=((await uiPrompt('Nouveau nom du deck :',d.nom))||'').trim();if(!nom||nom===d.nom)return;
    const r=await sb.rpc('sauver_deck',{p_nom:nom,p_cartes:d.cartes||[]});if(r.error){uiAlert(r.error.message);return}
    await sb.rpc('supprimer_deck',{p_id:+d.id});await loadDecks();selDeck=String(r.data);redessine()};
  const del=$('#ddl');if(del)del.onclick=async()=>{const d=savedDecks.find(x=>String(x.id)===String(selDeck));if(!d||!(await uiConfirm('Supprimer le deck « '+d.nom+' » ?')))return;
    const {error}=await sb.rpc('supprimer_deck',{p_id:+selDeck});if(error){uiAlert(error.message);return}
    selDeck='';dkNom='Nouveau deck';await loadDecks();dkSrc='';redessine()};
}
// ---- Decks de championnat : le choix du deck (combat ou ceinture), en haut de la colonne de gauche ----
function dkModes(){return `<div class="dkmode">${[['','⚔️ Combat'],...Object.entries(DIVS).map(([k,d])=>[k,d.e+' '+d.nom.replace('Ceinture ','')])].map(([k,l])=>`<button class="${k===dkDiv?'on':'sec'}" data-dkm="${k}" title="${k?'Deck de championnat : '+DIVS[k].nom:'Deck des combats du jour et des duels'}">${l}</button>`).join('')}</div>`}
function dkModesBrancher(){document.querySelectorAll('[data-dkm]').forEach(b=>b.onclick=async()=>{const k=b.dataset.dkm;if(k===dkDiv)return;
  if(dkSale()&&deck.size&&!(await uiConfirm('Tes changements sur ce deck ne sont pas enregistrés. Changer de deck quand même ?',{ok:'Changer de deck'})))return;
  if(!dkChamp&&k){const r=await sb.from('decks_championnat').select('division,cartes').eq('joueur_id',user.id);
   if(r.error){uiAlert(/decks_championnat/.test(r.error.message||'')?'Championnat indisponible : l\'admin doit lancer 33-championnat.sql dans Supabase.':r.error.message);return}
   dkChamp={};(r.data||[]).forEach(x=>dkChamp[x.division]=x.cartes||[])}
  if(!dkDiv)dkNormal={deck,selDeck,dkNom,dkSrc};
  dkDiv=k;
  if(k){const own=new Set(collData.map(x=>x.variantes_carte.cartes.id)),L=(dkChamp[k]||[]).map(Number);deck=new Set(L.filter(i=>own.has(i)));dkSrc=dkCle(new Set(L))}
  else if(dkNormal){({deck,selDeck,dkNom,dkSrc}=dkNormal);dkNormal=null}
  drawDeck()})}
function drawDeckChamp(parId){
  const D=DIVS[dkDiv],n=dkCompte(),ok=dkValide(),enr=!!(dkChamp&&dkChamp[dkDiv]&&dkChamp[dkDiv].length),sale=dkSale();
  const pos={combattant:[],magie:[],piege:[]};[...deck].map(i=>parId.get(i)).filter(Boolean).sort(cmpColl).forEach(x=>pos[x.variantes_carte.cartes.type].push(x));
  const slot=(x,t)=>{if(!x){const L=TYPE_L[t];return `<div class="sl vide"><span>${L[0]}</span><small>${L[1]}</small></div>`}
    const v=x.variantes_carte,c=v.cartes,trop=dkTropRare(c.id);return `<button class="sl" data-rm="${c.id}" style="--g:${esc(trop?'#ef4444':c.raretes.couleur||'#888')}" title="Retirer ${esc(c.nom)}${trop?' (trop rare pour cette ceinture)':''}">${v.image_path?`<img src="${img(v.image_path)}" alt="${esc(c.nom)}">`:`<b>${esc(c.nom)}</b>`}<i>✕</i></button>`};
  const trop=[...deck].filter(dkTropRare).length;
  $('#dkl').innerHTML=`${dkModes()}
   <div class="dkch">${D.e} <b>Deck de championnat · ${D.nom}</b><br>15 cartes : 5 combattants, 5 magies, 5 pièges${D.max?` · ${dkDiv==='rare'?'cartes communes et rares seulement':'jusqu\'aux cartes épiques'}`:' · toutes les raretés'}. Combat pour le titre en relais : 3 combattants chacun, un nouveau trio à chaque entrée, jusqu'au KO.</div>
   <div class="dkc"><span class="${n.combattant===5?'ok':''}">⚔️ ${n.combattant}/5</span><span class="${n.magie===5?'ok':''}">✨ ${n.magie}/5</span><span class="${n.piege===5?'ok':''}">🪤 ${n.piege}/5</span><b class="${ok?'ok':''}">${deck.size}/15</b></div>
   <div class="dks ch">${DK_T.map(t=>[0,1,2,3,4].map(i=>slot(pos[t][i],t)).join('')).join('')}</div>
   ${DK_T.some(t=>pos[t].length>5)?`<div class="dkx"><span>⚠️ Trop de cartes d'un type : retire-les.</span><div class="dkxs">${DK_T.flatMap(t=>pos[t].slice(5)).map(x=>slot(x)).join('')}</div></div>`:''}
   ${trop?`<div class="dkx"><span>⚠️ ${trop} carte${trop>1?'s':''} trop rare${trop>1?'s':''} pour cette ceinture (bord rouge) : retire-${trop>1?'les':'la'}.</span></div>`:''}
   ${enr&&!sale?`<div class="dkok">${D.e} Deck enregistré : tu peux défier pour la ${D.nom} (onglet 🥇 Ceintures, ou !defi ${dkDiv==='epique'?'épique':dkDiv} dans le chat)</div>`:''}
   <div class="dka"><button id="dchs" ${ok&&!trop&&(sale||!enr)?'':'disabled'}>${ok?(enr&&!sale?'✓ Deck enregistré':'💾 Enregistrer ce deck'):`Encore ${Math.max(0,15-deck.size)} carte${15-deck.size>1?'s':''}`}</button>
    <div class="dkb"><button id="dchc" class="sec" ${deck.size?'':'disabled'}>🧹 Vider</button>${enr?'<button id="dchd" class="sec">🗑 Supprimer</button>':''}</div></div>`;
  $('#dkm').innerHTML=`<span><b class="${ok?'ok':''}">${deck.size}/15</b> · ⚔️${n.combattant} ✨${n.magie} 🪤${n.piege}</span><button id="dchs2" ${ok&&!trop&&(sale||!enr)?'':'disabled'}>💾 Enregistrer</button>`;
  const sauver=async()=>{const r=await sb.rpc('enregistrer_deck_championnat',{p_division:dkDiv,p_cartes:[...deck]});
    if(r.error){uiAlert(/enregistrer_deck_championnat/.test(r.error.message||'')?'Championnat indisponible : l\'admin doit lancer 33-championnat.sql dans Supabase.':r.error.message);return}
    dkChamp[dkDiv]=[...deck];dkSrc=dkCle(deck);drawDeck();uiAlert(`${D.e} Deck de la ${D.nom} enregistré !`)};
  $('#dchs').onclick=sauver;$('#dchs2').onclick=sauver;
  $('#dchc').onclick=()=>{deck.clear();drawDeck()};
  const del=$('#dchd');if(del)del.onclick=async()=>{if(!(await uiConfirm(`Supprimer ton deck de la ${D.nom} ?`)))return;
    const r=await sb.rpc('enregistrer_deck_championnat',{p_division:dkDiv,p_cartes:[]});if(r.error){uiAlert(r.error.message);return}
    delete dkChamp[dkDiv];deck=new Set();dkSrc='';drawDeck()}}
// Enregistre le deck en cours sous son nom (demande un nom s'il n'en a pas). true si c'est fait.
async function dkSauver(){
  if(!dkValide()){uiAlert('Il faut exactement 10 cartes : 3 combattants, 3 magies, 3 pièges et 1 carte libre.');return false}
  const cur=savedDecks.find(x=>String(x.id)===String(selDeck));let nom=cur?cur.nom:dkNom;
  if(!nom||nom==='Nouveau deck'||nom==='Deck de combat'&&!cur){nom=((await uiPrompt('Nom du deck :',nom&&nom!=='Nouveau deck'?nom:''))||'').trim();if(!nom)return false}
  const {data,error}=await sb.rpc('sauver_deck',{p_nom:nom.slice(0,30),p_cartes:[...deck]});
  if(error){uiAlert(({TROP_DE_DECKS:'Tu as déjà 10 decks enregistrés : supprime-en un d\'abord.',NOM_INVALIDE:'Le nom doit faire entre 1 et 30 caractères.',DECK_TROP_GRAND:'Un deck contient 10 cartes au maximum.'}[error.message])||error.message);return false}
  await loadDecks();selDeck=String(data);dkNom='';dkSrc=dkCle(deck);return true}

/* ---------- Profils (visibles par tous les joueurs connectés) ---------- */
async function vProfil(id=user.id){
  const mine=id==user.id;
  const [rl,rp,rt]=await Promise.all([sb.rpc('liste_profils'),sb.rpc('profil_public',{p_joueur:id}),sb.rpc('trophees_joueur',{p_joueur:id})]);
  if(rl.error||rp.error){main.innerHTML='<p class="ko">Profils indisponibles pour le moment (l\'admin doit d\'abord lancer 05-profil.sql puis 06-profils-publics.sql dans Supabase).</p>';return}
  if(!rp.data){main.innerHTML='<p>Profil introuvable.</p>';return}
  const D=rp.data,S=D.stats||{},n=k=>S[k]??0,tot=n('victoires')+n('defaites')+n('nuls');
  const pct=tot?Math.round(100*n('victoires')/tot)+' %':'—';
  const st=(l,v,s)=>`<div class="stat"><span>${l}</span><b>${v}</b>${s?`<span>${s}</span>`:''}</div>`;
  const cardTile=(l,x,u)=>{
    if(!x)return st(l,'—');
    return `<div class="stat card2" style="--g:${esc(x.couleur||'#888')}">${x.image_path?`<img loading="lazy" src="${img(x.image_path)}">`:''}<div><span>${l}</span><b style="font-size:18px">${esc(x.nom)}</b><span>${x.valeur} ${u}</span></div></div>`};
  let coll='';
  if(mine){
    await loadColl();
    const rt=await sb.from('cartes').select('id',{count:'exact',head:true}).eq('actif',true);
    const mc=new Map();collData.forEach(x=>{const c=x.variantes_carte.cartes;mc.set(c.id,c)});
    const copies=collData.reduce((a,x)=>a+x.quantite,0),byR={};
    mc.forEach(c=>{const r=c.raretes.nom;byR[r]=(byR[r]||0)+1});
    coll=`<h3>Collection</h3><div class="stats">
   ${st('Cartes différentes',mc.size+(rt.count!=null?' / '+rt.count:''))}${st('Cartes au total',copies,'doublons compris')}
   ${st('Boosters ouverts',n('boosters_ouverts'))}
   ${Object.entries(byR).map(([k,v])=>st(esc(k),v,'cartes différentes')).join('')}</div>`;
  }
  main.innerHTML=`<div class="row"><h3 style="margin:0">${mine?'Mon profil':'Profil de '+esc(D.pseudo)}</h3>${mine?'':`<button class="sec" data-p="${user.id}">← Mon profil</button>`}</div>
  <h3>Combats</h3><div class="stats">
   ${st('Victoires',n('victoires'))}${st('Défaites',n('defaites'))}${st('Nuls',n('nuls'))}
   ${st('% de victoires',pct,tot+' combat'+(tot>1?'s':''))}
   ${st('Meilleure série de victoires',n('meilleure_serie'))}${st('Série en cours',n('serie_actuelle'))}</div>
  <h3>Records</h3><div class="stats">
   ${st('Plus gros coup infligé',n('plus_gros_coup'),'dégâts en une attaque')}
   ${st('Victoire la plus rapide',S.victoire_rapide_tours?S.victoire_rapide_tours+' tours':'—')}
   ${st('Combat le plus long',S.combat_long_tours?S.combat_long_tours+' tours':'—')}
   ${st('Dégâts totaux infligés',n('degats_totaux'))}</div>
  <h3>Cartes</h3><div class="stats">${cardTile('Carte la plus jouée',D.plus_jouee,'combats')}${cardTile('Carte la plus victorieuse',D.plus_gagnante,'victoires')}</div>
  ${rt&&!rt.error?armoire(rt.data||[],mine):''}
  ${coll}
  ${tot?'':`<p><small>${mine?'Aucun combat joué pour l\'instant : tes statistiques de combat apparaîtront après ton premier combat.':'Ce joueur n\'a pas encore combattu.'}</small></p>`}
  <p><button class="sec" data-cl>🏆 Voir le classement</button></p>`;
  const bc=main.querySelector('[data-cl]');if(bc)bc.onclick=()=>show('classement');
  main.querySelectorAll('button[data-p]').forEach(b=>b.onclick=()=>{vProfil(b.dataset.p);window.scrollTo(0,0)});
}

/* ---------- Classement ---------- */
// Tri du classement choisi par le joueur (gardé dans le navigateur)
const TRIS_CL={victoires:'Victoires',pct:'% de victoires',combats:'Combats joués',defaites:'Défaites',nuls:'Nuls',meilleure_serie:'Meilleure série',plus_gros_coup:'Plus gros coup'};

async function vClassement(){

  const pc=x=>tot(x)?Math.round(100*nb(x,'victoires')/tot(x))+' %':'—';
  const dispo=Object.keys(TRIS_CL).filter(k=>['victoires','pct','combats','defaites','nuls'].includes(k)||T0.some(x=>x[k]!=null));   // séries / records : seulement si le serveur les donne
  if(!dispo.includes(triCl))triCl='victoires';

  // à égalité : plus de victoires, puis plus de combats joués, puis le pseudo
  const L=T0.slice().sort((a,b)=>(val(b)-val(a))||(nb(b,'victoires')-nb(a,'victoires'))||(tot(b)-tot(a))||String(a.pseudo).localeCompare(String(b.pseudo),'fr')).slice(0,100);

   <div class="row"><label><small>Classer par</small><br><select id="cltri">${dispo.map(k=>`<option value="${k}"${k===triCl?' selected':''}>${TRIS_CL[k]}</option>`).join('')}</select></label></div>
   <p><small>Clique sur un pseudo pour voir son profil.${moi>=0?` Tu es <b>${moi+1}${moi?'e':'er'}</b>.`:''}</small></p>

  main.querySelectorAll('button[data-p]').forEach(b=>b.onclick=()=>{tab='profil';const T={...TABS};if(isAdmin)T.admin='⚙️ Admin';$('#nav').innerHTML=Object.entries(T).map(([k,v])=>`<button class="${k=='profil'?'on':'sec'}" data-t="${k}">${v}</button>`).join('');$('#nav').querySelectorAll('button').forEach(n=>n.onclick=()=>show(n.dataset.t));vProfil(b.dataset.p);window.scrollTo(0,0)});
}

async function exAlerteDeck(donne){const r=await sb.rpc('echange_collection',{p_joueur:user.id});if(r.error)return '';const C=r.data||[];
  const parCarte={};C.forEach(c=>{parCarte[c.carte_id]=(parCarte[c.carte_id]||0)+c.quantite});
  const out=new Set();donne.forEach(d=>{const c=C.find(z=>+z.variante_id===+d.variante_id);if(c&&c.au_deck){parCarte[c.carte_id]-=d.quantite;if(parCarte[c.carte_id]<=0)out.add(c.nom)}});
  return out.size?`\n\n⚠ Cette carte est dans ton deck de combat et en sortira : ${[...out].join(', ')}. Pense à compléter ton deck (10 cartes) avant ton prochain combat.`:''}
async function exMettre(x,m,accepte){
  const r=await sb.rpc('echange_contribuer',{p_id:x.id,p_montant:m});
  if(r.error){uiAlert(exErr(r.error));return}
  await refreshJoueur();
  if(r.data==='valide')await uiAlert(`🎉 Échange réussi avec ${x.autre} ! Les cartes sont dans ta collection.`);
  else if(r.data==='annule')await uiAlert('Échange annulé : une des cartes n\'est plus dans la collection de son propriétaire. Tes fragments t\'ont été rendus.');
  else uiAlert(accepte?`Échange accepté. Il manque encore des fragments dans le pot : ${x.autre} doit compléter.`:'Fragments ajoutés au pot.');
  vEchanges()}

// Équilibrage : enregistre automatiquement ce qui change sur une carte (appelé par l'admin). Ne bloque jamais l'enregistrement de la carte.
const txtEq={
  passif:c=>{const P=c.passif?(c.passif.briques?c.passif.briques.filter(b=>b&&b.type):(c.passif.type?[c.passif]:[])):[];return P.map(fxPassif).join(' · ')},

  effet:c=>{if(c.type=='magie')return c.effet?fxEffet(c.effet).join(' · '):'';const e=c.effet;if(!e)return'';return(fxCond(e.condition)||'Piège caché')+' : '+fxEffet(e.effet).join(' · ')+(nz(e.declenchements)>1?` (jusqu'à ${e.declenchements} fois)`:'')}};
async function noteEquilibrage(avant,apres){

    if(!avant){ch.push({champ:'Nouvelle carte',avant:null,apres:[rn[apres.rarete_id],apres.type=='combattant'?`ATQ ${apres.atq??'?'} · PV ${apres.pv??'?'}`:apres.type].filter(Boolean).join(' · ')})}
    else{
      if(avant.nom!==apres.nom)ch.push({champ:'Nom',avant:avant.nom,apres:apres.nom,sens:0});
      if(avant.rarete_id!==apres.rarete_id)ch.push({champ:'Rareté',avant:rn[avant.rarete_id]||'?',apres:rn[apres.rarete_id]||'?',sens:0});
      if(apres.type=='combattant'||avant.type=='combattant'){num('atq','ATQ');num('pv','PV')}
      ['passif','ultime','effet'].forEach(k=>{if(JSON.stringify(avant[k]??null)!==JSON.stringify(apres[k]??null)){const t=apres.type||avant.type,c0={...avant,type:t},c1={...apres,type:t};
        ch.push({champ:{passif:'Passif',ultime:'Ultime',effet:t=='piege'?'Piège':'Effet'}[k],avant:txtEq[k](c0)||null,apres:txtEq[k](c1),sens:0});if(ch[ch.length-1].avant==null)ch[ch.length-1].avant=''}});
      if(!!avant.actif!==!!apres.actif)ch.push({champ:'Disponible',avant:avant.actif?'Oui':'Non',apres:apres.actif?'Oui':'Non',sens:0});

/* ---------- Admin : récap des votes ---------- */
let avSem=0;
async function aVotes(){
  const box=$('#sub');box.innerHTML='<p><small>Chargement…</small></p>';
  const [rs,cr]=await Promise.all([sb.rpc('propositions_vote',{p_decalage:avSem}),sb.from('cartes').select('id,nom,type,atq,pv,passif,ultime,effet,raretes(nom,couleur),variantes_carte(nom,image_path)')]);
  if(rs.error){box.innerHTML='<p class="ko">Votes indisponibles : lance d\'abord 39-votes-propositions.sql dans Supabase.</p>';return}
  const byId={};(cr.data||[]).forEach(c=>byId[c.id]=c);
  const all=(rs.data||[]).map(x=>({...x,oui:+x.oui,non:+x.non}));
  // classement : le plus de oui, puis le moins de non
  const top=all.slice().sort((a,b)=>(b.oui-a.oui)||(a.non-b.non)).slice(0,10);
  const semL=['Cette semaine','Semaine dernière','Il y a 2 semaines','Il y a 3 semaines'];

   <p><small>${all.length} proposition${all.length>1?'s':''}. Classement par nombre de oui (l'auteur compte pour oui), puis le moins de non. « Modifier » ouvre directement la carte dans l'onglet Cartes (le changement apparaîtra tout seul dans l'onglet Équilibrage). « Supprimer » libère la carte, qui redevient proposable.</small></p>
   ${top.length?top.map((o,i)=>{const c=byId[o.carte_id],u=c?vImg(c):'',n=o.oui+o.non;
     return`<div class="pn av10"><span class="rk">${i+1}</span>${u?`<img loading="lazy" src="${esc(u)}" alt="">`:''}<div class="bd"><h4 style="margin:0">${esc(o.carte_nom)} <span class="vsens ${esc(o.sens)}">${SENS[o.sens]||esc(o.sens)}</span></h4>
      <div class="vasp">${esc(vLabA(c,o.aspect))}</div>${o.commentaire?`<div class="vcom">« ${esc(o.commentaire)} »</div>`:''}
      <div class="vcpt"><span>✅ Oui <b>${o.oui}</b></span><span>❌ Non <b>${o.non}</b></span><small>${n?Math.round(100*o.oui/n):0} % de oui</small></div>
      <div class="row" style="margin-top:8px">${c?`<button class="sec" data-avedit="${o.carte_id}">✏️ Modifier la carte</button>`:''}<button class="sec" data-avdel="${o.id}">🗑️ Supprimer</button></div></div></div>`}).join(''):'<p><small>Aucune proposition pour cette semaine.</small></p>'}`;
  box.querySelectorAll('[data-avs]').forEach(b=>b.onclick=()=>{avSem=+b.dataset.avs;aVotes()});
  box.querySelectorAll('[data-avdel]').forEach(b=>b.onclick=async()=>{if(!(await uiConfirm('Supprimer cette proposition et ses votes ?')))return;
    const r=await sb.rpc('retirer_proposition',{p_proposition:+b.dataset.avdel});if(r.error)uiAlert(r.error.message);aVotes()});
  box.querySelectorAll('[data-avedit]').forEach(b=>b.onclick=async()=>{const id=b.dataset.avedit;sub='cartes';vAdmin();
    for(let k=0;k<40;k++){await new Promise(r=>setTimeout(r,100));const e=document.querySelector(`#sub button[data-edit="${id}"]`);if(e){e.click();return}}});
}

// Images allégées : converties en WebP (transparence conservée) et réduites à 1200 px de haut maximum ; gardées 1 an en cache.
// Objectif : réduire le volume téléchargé depuis Supabase (quota « egress » du plan gratuit).
const CACHE_1AN='31536000';
async function alleger(file,maxH=1200,qual=.86){
  if(!file||!/^image\/(png|jpe?g|webp)$/i.test(file.type||''))return file;   // GIF animé ou autre : laissé tel quel
  try{const bmp=await createImageBitmap(file);const s=Math.min(1,maxH/bmp.height),w=Math.round(bmp.width*s),hh=Math.round(bmp.height*s);
    const c=document.createElement('canvas');c.width=w;c.height=hh;c.getContext('2d').drawImage(bmp,0,0,w,hh);
    const b=await new Promise(ok=>c.toBlob(ok,'image/webp',qual));
    return b&&b.size<file.size?b:file}catch(e){return file}}
async function upload(file){
  const f=await alleger(file),ext=f.type==='image/webp'?'webp':(file.name.split('.').pop()||'png');
  const path=crypto.randomUUID()+'.'+ext;
  await q(sb.storage.from('cartes').upload(path,f,{contentType:f.type||file.type,cacheControl:CACHE_1AN}));return path;
}

  const todo=cibles.filter(c=>!/\.webp$/i.test(c.p));
  log(`${cibles.length} image(s) trouvée(s), ${todo.length} à optimiser.`);
  for(const c of todo){
    try{const res=await fetch(pub(c.p));if(!res.ok)throw new Error('lecture impossible');const blob=await res.blob();
      const f=await alleger(new File([blob],c.p,{type:blob.type}));
      if(f.type!=='image/webp'||f.size>=blob.size){log(`= ${c.p} déjà léger, inchangé`);continue}
      const np=crypto.randomUUID()+'.webp';
      const u=await sb.storage.from('cartes').upload(np,f,{contentType:'image/webp',cacheControl:CACHE_1AN});if(u.error)throw u.error;
      const m=await sb.from(c.t).update({[c.k]:np}).eq('id',c.id);if(m.error){await sb.storage.from('cartes').remove([np]);throw m.error}
      try{localStorage.setItem('optim|'+c.t+'|'+c.id+'|'+c.k,c.p)}catch(e){}   // l'original est GARDÉ dans Supabase (on peut revenir en arrière)
      gain+=blob.size-f.size;n++;log(`✓ ${Math.round(blob.size/1024)} Ko → ${Math.round(f.size/1024)} Ko`)}
    catch(e){log(`✗ ${c.p} : ${e.message||e}`)}}
  log(`Terminé : ${n} image(s) optimisée(s), ${(gain/1048576).toFixed(1)} Mo économisés par affichage complet.`)}

const RANGS_RAR=['ggez','legendaire','epique','rare','commun'];   // GGEZ : au-dessus du légendaire (arc-en-ciel) ;   // du plus haut au plus bas ; un nom inconnu passe après, du plus rare au moins rare selon son poids de drop
function rangRar(r){const n=String((r&&r.nom)||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z]/g,''),i=RANGS_RAR.findIndex(k=>n.includes(k));return[i<0?9:i,+(r&&r.poids)||0]}

function cmpColl(a,b){const ca=a.variantes_carte.cartes,cb=b.variantes_carte.cartes,x=rangRar(ca.raretes),y=rangRar(cb.raretes);return(x[0]-y[0])||(x[1]-y[1])||(ORD_TYPE[ca.type]-ORD_TYPE[cb.type])||String(ca.nom||'').localeCompare(cb.nom||'','fr')||String(a.variantes_carte.nom||'').localeCompare(b.variantes_carte.nom||'','fr')}

// Tableau des niveaux des statuts (rework d'octobre 2026) : reglages_jeu « niveaux_statuts » (JSON), lu par swift-responder. Vide = valeurs par défaut du moteur.
const NIV_LIGNES=[['poison','Poison : dégâts par tour'],['saignement','Saignement : % des PV max par tour'],['saignementSoin','Saignement : % de soins en moins'],['brulure','Brûlure : % des PV max par tour'],['fatigue',"Fatigue : % d'ATQ en moins"],['fractureChance','Fracture : % de chances de se blesser'],['fractureAtq',"Fracture : dégâts, % de sa propre ATQ"],['glas','Glas : % des PV max par tour (vitesse de l\'ombre)'],['sangsue','Sangsue toxique : % du tic de poison récupéré']];
const NIV_SEULS=[['calcination','Brûlure : % des dégâts retirés aux PV max (calcination)'],['malediction',"Malédiction : ATQ en moins (sans niveau)"],['faiblesse','Faiblesse (vaporisation) : % de dégâts reçus en plus'],['faiblesseTours','Faiblesse : nombre de tours'],['critique',"Coup critique : puissance, % de l'ATQ (commune à toutes les cartes)"],['embrasementAtq',"Embrasement : % d'ATQ en plus"],['embrasementCalcination','Embrasement : % des PV max calcinés à chacun de ses tours'],['fureurPct',"Fureur incandescente : % d'ATQ par perte de PV"],['fureurMax',"Fureur incandescente : % d'ATQ au plus"],['injection','Injection virulente (poison III) : % des dégâts de poison restants'],['surchargeAuto','Surcharge : % des PV max (auto-électrocution)'],['surchargeAtq',"Surcharge : % d'ATQ en moins"],['surchargeEnchainement',"Surcharge : % de chances d'enchaîner"],['accumulateurCharges','Accumulateur : marques de foudre pour une charge pleine'],['accumulateurBonus','Accumulateur : % de dégâts en plus'],['brisure',"Brisure de volonté : × l'ATQ perdue aux malédictions"],['etreinte','Étreinte maudite : ATQ en moins par malédiction et par attaque'],['visee','Visée maintenue : % de chances de garder le ciblage'],['foudre','Marque de foudre niveau I : % de dégâts en plus sur le prochain coup']];
function nivLus(raw){let o={};try{o=raw?JSON.parse(raw):{}}catch{o={}}return o&&typeof o==='object'?o:{}}
function nivForm(raw){const o=nivLus(raw),d=NIVEAUX_DEFAUT,val=(k,i)=>{const x=i==null?o[k]:(Array.isArray(o[k])?o[k][i]:undefined);return x==null||x===''?(i==null?d[k]:d[k][i]):x};
 return`<form class="f" id="fniv" style="flex-direction:column;align-items:flex-start"><b>📊 Niveaux des statuts</b>
  <small>Ce que fait chaque niveau (I, II, III) : la carte ne garde que son niveau, sa durée et sa chance. Posés l'un sur l'autre, les niveaux s'additionnent (I + II = III, III au plus). Pris en compte dès le combat suivant. ${raw?'':'(Valeurs par défaut du moteur pour l\'instant.)'}</small>
  <table class="tniv"><tr><th></th><th>I</th><th>II</th><th>III</th></tr>${NIV_LIGNES.map(([k,l])=>`<tr><td><small>${esc(l)}</small></td>${[0,1,2].map(i=>`<td><input name="${k}_${i}" type="number" min="0" max="1000" step="0.5" value="${esc(val(k,i))}" style="width:70px"></td>`).join('')}</tr>`).join('')}</table>
  <div class="row">${NIV_SEULS.map(([k,l])=>`<label><small>${esc(l)}</small><br><input name="${k}" type="number" min="0" max="1000" step="0.5" value="${esc(val(k))}" style="width:80px"></label>`).join('')}</div>
  <div class="row"><button>Enregistrer</button><button type="button" class="sec" id="nivdef">↩ Valeurs par défaut</button></div></form>`}
// Admin > Tournois (46-tournois.sql) : créer le tournoi, suivre les inscriptions, lancer le tirage, régler l'enchaînement, annuler
async function aTournois(){
  const box=$('#sub');box.innerHTML='<p>Chargement…</p>';
  const [r,l]=await Promise.all([sb.rpc('tournoi_etat',{p_id:null}),sb.rpc('tournois_admin')]);
  if(r.error||l.error){box.innerHTML='<p class="ko">Tournois indisponibles : lance d\'abord 46-tournois.sql dans Supabase. Message : <b>'+esc((r.error||l.error).message)+'</b></p>';return}
  const T=r.data&&r.data.tournoi,ouvert=T&&['inscriptions','en_cours'].includes(T.statut),L=l.data||[];
  const STAT={inscriptions:'📝 Inscriptions',en_cours:'⚔️ En cours',termine:'🏁 Terminé',annule:'❌ Annulé'};
  let haut='';
  if(ouvert){const n=(T.inscrits||[]).length;
    haut=`<div class="f" style="display:block"><b>${esc(T.nom)}</b> · ${STAT[T.statut]} · deck ${esc(T.ceinture)} · ${n} inscrit${n>1?'s':''}${T.statut==='inscriptions'?' / '+T.max_joueurs:''}
      ${T.statut==='inscriptions'?`<p>${n?T.inscrits.map(x=>`<span class="chr">${esc(x.pseudo||'?')} <button class="sec" data-tr="${x.id}" title="Retirer" style="padding:0 6px">✕</button></span>`).join(' '):'<small>Aucun inscrit pour l\'instant.</small>'}</p>`:tableauSite(T)}
      <div class="row">${T.statut==='inscriptions'?`<button id="tlan" ${n<2?'disabled':''}>🎲 Tirer le tableau et lancer</button>`:''}
       ${T.statut==='inscriptions'?`<label>Format <select id="tfmt"><option value="elimination"${T.format!=='suisse'?' selected':''}>Élimination directe</option><option value="suisse"${T.format==='suisse'?' selected':''}>Rondes suisses + double élimination</option></select></label>`:`<small>${T.format==='suisse'?'Rondes suisses + double élimination':'Élimination directe'}</small>`}
       <label><input type="checkbox" id="tauto" ${T.auto?'checked':''}> Enchaîner automatiquement les combats</label>
       ${[1,2,3,0].map(i=>`<label class="sec" style="cursor:pointer">${['🎗️','🥇','🥈','🥉'][i]} ${i?'Trophée':'Écharpe'} <input type="file" data-tro="${i}" accept="image/*" style="display:none"></label>`).join('')}
       <button class="sec" id="tann">🛑 Annuler le tournoi</button></div>
      <small>${T.statut==='inscriptions'?'Le tirage peut aussi se faire en live : la première commande « Tournoi - Suivant » tire le tableau et lance le premier combat.':'Le combat suivant se lance avec l\'action « Tournoi - Suivant » (ou tout seul, si l\'enchaînement est coché).'}</small></div>`}
  else haut=`<form class="f" id="tnew"><b>Nouveau tournoi</b>
     <label><small>Nom</small><br><input name="nom" required maxlength="60" placeholder="Coupe du Cerf"></label>
     <label><small>Format</small><br><select name="fmt"><option value="suisse">Rondes suisses (BO1) puis double élimination (BO3, finales BO5)</option><option value="elimination">Élimination directe (BO1, demi BO3, finales BO5)</option></select></label>
     <label><small>Thème : le deck de championnat utilisé</small><br><select name="div"><option value="libre">🥇 Ceinture Libre (toutes raretés)</option><option value="epique">🥈 Ceinture Épique (jusqu'à épique)</option><option value="rare">🥉 Ceinture Rare (communes et rares)</option></select></label>
     <label><small>Nombre maximum de joueurs (vide : réglage par défaut, 32)</small><br><input name="max" type="number" min="2" max="64" style="width:90px"></label>
     <label><small>Images des trophées, une par place (facultatives : une place sans image prend celle du vainqueur ; sans aucune image, une coupe or, argent ou bronze)</small><br>🥇 <input name="tro1" type="file" accept="image/*"><br>🥈 <input name="tro2" type="file" accept="image/*"><br>🥉 <input name="tro3" type="file" accept="image/*"></label>
     <label><small>Image de l'écharpe offerte à chaque participant (facultative : sinon une écharpe dessinée)</small><br>🎗️ <input name="tro0" type="file" accept="image/*"></label>
     <label><input name="auto" type="checkbox" checked> Enchaîner automatiquement les combats en live</label>
     <small>BO1 jusqu'aux quarts, BO3 en demi-finale, BO5 en petite finale et en finale (réglages tournoi_format_autres, tournoi_format_demi, tournoi_format_petite, tournoi_format_finale). Un seul tournoi ouvert à la fois. Les récompenses reprennent celles du tournoi précédent : à retoucher dans l'onglet 🎁 Récompenses.</small>
     <button>Créer le tournoi et ouvrir les inscriptions</button></form>`;
  box.innerHTML=haut+`<h3>Tous les tournois</h3>${L.length?`<table><tr><th>Tournoi</th><th>Statut</th><th>Joueurs</th><th>Vainqueur</th></tr>${L.map(x=>`<tr><td><b>${esc(x.nom)}</b><br><small>${(DIVS[x.division]||{}).e||''} ${new Date(x.cree_le).toLocaleDateString('fr-FR')}</small></td><td>${STAT[x.statut]||x.statut}</td><td>${x.joueurs}</td><td>${esc(x.pseudo_gagnant||'—')}</td></tr>`).join('')}</table>`:'<p><small>Aucun tournoi pour l\'instant.</small></p>'}`;
  const f=$('#tnew');if(f)f.onsubmit=async e=>{e.preventDefault();const F=new FormData(f),bt=f.querySelector('button');bt.disabled=true;
    try{const tro=[];for(const i of [0,1,2,3]){const fi=f['tro'+i].files[0];tro[i]=fi?await upload(fi):null}
      const x=await sb.rpc('tournoi_creer',{p_nom:F.get('nom'),p_division:F.get('div'),p_max:F.get('max')?parseInt(F.get('max'),10):null,p_trophee:tro[1],p_auto:f.auto.checked});
      if(x.error)throw x.error;
      if(F.get('fmt')==='suisse'){const y=await sb.rpc('tournoi_format',{p_id:x.data,p_format:'suisse'});if(y.error)throw y.error}
      for(const i of [0,2,3])if(tro[i]){const y=await sb.rpc('tournoi_trophee',{p_id:x.data,p_place:i,p_image:tro[i]});if(y.error)throw y.error}uiAlert('🎖️ Tournoi créé : les inscriptions sont ouvertes (!tournoi dans le chat, ou l\'onglet Tournois du site). Règle ses récompenses dans l\'onglet 🎁 Récompenses.');aTournois()}
    catch(err){bt.disabled=false;uiAlert((err&&err.message)||String(err))}};
  if(!ouvert)return;
  box.querySelectorAll('[data-tr]').forEach(b=>b.onclick=async()=>{const x=await sb.rpc('tournoi_retirer',{p_id:T.id,p_joueur:b.dataset.tr});if(x.error)return uiAlert(x.error.message);aTournois()});
  const lan=$('#tlan');if(lan)lan.onclick=async()=>{if(!(await uiConfirm('Fermer les inscriptions et tirer le tableau au sort ?')))return;const x=await sb.rpc('tournoi_lancer',{p_id:T.id});if(x.error)return uiAlert(x.error.message);aTournois()};
  {const fm=$('#tfmt');if(fm)fm.onchange=async e=>{const x=await sb.rpc('tournoi_format',{p_id:T.id,p_format:e.target.value});if(x.error)uiAlert(x.error.message);else uiAlert('Format du tournoi mis à jour.')}}
  $('#tauto').onchange=async e=>{const x=await sb.rpc('tournoi_regler',{p_id:T.id,p_auto:e.target.checked,p_trophee:null});if(x.error)uiAlert(x.error.message)};
  box.querySelectorAll('[data-tro]').forEach(inp=>inp.onchange=async e=>{const fi=e.target.files[0];if(!fi)return;const i=+inp.dataset.tro;try{const path=await upload(fi);const x=await sb.rpc('tournoi_trophee',{p_id:T.id,p_place:i,p_image:path});if(x.error)throw x.error;uiAlert(i?`${['','🥇','🥈','🥉'][i]} Trophée de la ${i===1?'1re':i+'e'} place mis à jour.`:'🎗️ Écharpe de participation mise à jour.')}catch(err){uiAlert((err&&err.message)||String(err))}});
  $('#tann').onclick=async()=>{if(!(await uiConfirm(`Annuler le tournoi « ${T.nom} » ? Personne ne reçoit de trophée.`)))return;const x=await sb.rpc('tournoi_annuler',{p_id:T.id});if(x.error)return uiAlert(x.error.message);aTournois()};
}
// Admin > Récompenses (46-tournois.sql) : ce que gagnent les 4 premières places du tournoi ouvert (gold, boosters, dos de carte, carte)
async function aRecompenses(){
  const box=$('#sub');box.innerHTML='<p>Chargement…</p>';
  const [r,b,d,v]=await Promise.all([sb.rpc('tournoi_etat',{p_id:null}),sb.from('types_boosters').select('id,nom,actif').order('id'),
    sb.from('dos_cartes').select('id,nom').order('nom'),sb.from('variantes_carte').select('id,nom,cartes(nom,raretes(nom,poids))')]);
  if(r.error){box.innerHTML='<p class="ko">Récompenses indisponibles : lance d\'abord 46-tournois.sql dans Supabase. Message : <b>'+esc(r.error.message)+'</b></p>';return}
  const T=r.data&&r.data.tournoi;
  if(!T||!['inscriptions','en_cours'].includes(T.statut)){box.innerHTML='<p>Aucun tournoi ouvert : crée d\'abord le tournoi dans l\'onglet 🎖️ Tournois, puis règle ses récompenses ici.</p>';return}
  const R={};(T.recompenses||[]).forEach(x=>R[x.place]=x);
  const V=(v.data||[]).filter(x=>x.cartes).sort((x,y)=>((x.cartes.raretes||{}).poids??1e9)-((y.cartes.raretes||{}).poids??1e9)||x.cartes.nom.localeCompare(y.cartes.nom)||x.nom.localeCompare(y.nom));   // les plus rares en premier
  const opt=(L,val,lab)=>`<option value="">— Aucun —</option>`+L.map(x=>`<option value="${x.id}"${String(val??'')===String(x.id)?' selected':''}>${esc(lab(x))}</option>`).join('');
  const ligne=p=>{const x=R[p]||{};
    return `<div class="stat" data-pl="${p}"><h4 style="margin:0 0 8px">${PLACE_NOM[p]}${p===4?' <small style="opacity:.6">(perdant de la petite finale, sans trophée)</small>':''}</h4>
     <div class="row"><label><small>💰 Gold</small><br><input data-k="gold" type="number" min="0" value="${x.gold||0}" style="width:100px"></label>
      <label><small>📦 Booster</small><br><select data-k="booster">${opt(b.data||[],x.booster_id,y=>y.nom+(y.actif?'':' (inactif)'))}</select></label>
      <label><small>Nombre</small><br><input data-k="nb" type="number" min="0" value="${x.boosters||1}" style="width:70px"></label></div>
     <div class="row"><label><small>🂠 Dos de carte</small><br><select data-k="dos">${opt(d.data||[],x.dos_id,y=>y.nom||'Dos')}</select></label>
      <label style="flex:1;min-width:200px"><small>🃏 Carte (la version précise)</small><br><select data-k="carte" style="width:100%">${opt(V,x.variante_id,y=>`${y.cartes.nom} — ${y.nom}${y.cartes.raretes?' · '+y.cartes.raretes.nom:''}`)}</select></label></div>
     <small style="opacity:.75">${recompenseHtml(x)||'Rien pour l\'instant.'}</small></div>`};
  box.innerHTML=`<p>Récompenses du tournoi <b>${esc(T.nom)}</b>, données à la fin du tournoi (1re à 3e place : aussi un trophée). Un dos de carte déjà possédé n'est pas redonné. Les joueurs voient ces récompenses dans l'onglet 🎖️ Tournois.</p>
   <div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">${[1,2,3,4].map(ligne).join('')}</div>
   <button id="rsave">Enregistrer les récompenses</button>`;
  $('#rsave').onclick=async()=>{const bt=$('#rsave');bt.disabled=true;
    try{for(const el of box.querySelectorAll('[data-pl]')){const g=k=>el.querySelector(`[data-k="${k}"]`).value,n=x=>x===''?null:parseInt(x,10);
      const x=await sb.rpc('tournoi_recompense_regler',{p_id:T.id,p_place:+el.dataset.pl,p_gold:Math.max(0,parseInt(g('gold'),10)||0),p_booster:n(g('booster')),p_boosters:Math.max(0,parseInt(g('nb'),10)||0),p_dos:g('dos')||null,p_variante:n(g('carte'))});
      if(x.error)throw x.error}
     uiAlert('🎁 Récompenses enregistrées.');aRecompenses()}catch(err){bt.disabled=false;uiAlert((err&&err.message)||String(err))}};
}

     <label><small>Multiplicateur</small><br><input name="mul" type="number" min="0" max="10" step="0.5" value="${esc(v.multiplicateur_gains??1)}" style="width:80px"></label>
     <label><small>Jusqu'à (facultatif)</small><br><input name="fin" type="datetime-local" value="${esc(finLocale(v.multiplicateur_fin))}"></label></div>
    <small id="gainetat">${etatGains(v)}</small>
    <div class="row"><button>Enregistrer</button><button type="button" class="sec" id="gx2">🔥 Soirée ×2 (6 h)</button><button type="button" class="sec" id="gx1">↩ Revenir à ×1</button></div></form>
   <form class="f" id="fbounty" style="flex-direction:column;align-items:flex-start"><b>🎯 Événement Bounty</b>
    <small>De temps en temps, une prime aléatoire apparaît à la fin d'un combat (pluie de pièces sur le stream) et se partage entre les deux joueurs, en plus des gains normaux (match nul : moitié-moitié). Parfois, le gagnant rafle tout. Elle n'est pas multipliée par les soirées ×2. Avec une heure de fin, l'événement s'arrête tout seul.</small>
    <div class="row"><label><small>Actif</small><br><input name="on" type="checkbox" ${String(v.bounty_actif)==='1'?'checked':''}></label>
     <label><small>Prime min</small><br><input name="bmin" type="number" min="0" max="100000" value="${esc(v.bounty_min??5)}" style="width:80px"></label>
     <label><small>Prime max</small><br><input name="bmax" type="number" min="0" max="100000" value="${esc(v.bounty_max??90)}" style="width:80px"></label>
     <label><small>Part du gagnant %</small><br><input name="bpart" type="number" min="0" max="100" value="${esc(v.bounty_part_gagnant??70)}" style="width:80px"></label>
     <label><small>Chance qu'une prime apparaisse %</small><br><input name="bch" type="number" min="0" max="100" value="${esc(v.bounty_chance??30)}" style="width:80px"></label>
     <label><small>Chance « le gagnant rafle tout » %</small><br><input name="btout" type="number" min="0" max="100" value="${esc(v.bounty_tout??10)}" style="width:80px"></label>
     <label><small>Jusqu'à (facultatif)</small><br><input name="fin" type="datetime-local" value="${esc(finLocale(v.bounty_fin))}"></label></div>
    <small>${etatBounty(v)}</small>
    <div class="row"><button>Enregistrer</button><button type="button" class="sec" id="bgo">🎯 Lancer le Bounty (6 h)</button><button type="button" class="sec" id="bstop">⏹ Arrêter le Bounty</button></div></form>
   <h3>Recyclage des doublons</h3><form class="f" id="frc"><small>Ce que rapporte chaque exemplaire en trop quand le joueur choisit le <b>gold</b>. La colonne Fragments donne des fragments EN PLUS du gold : laisse-la à 0 (le recyclage en fragments se règle dans « Échanges » ci-dessous).</small>
   <table><tr><th></th><th>Gold</th><th>Fragments</th></tr>${[['commun','Commun'],['rare','Rare'],['epique','Épique'],['legendaire','Légendaire'],['ggez','GGEZ']].map(([k,n],i)=>`<tr><td>${n}</td><td><input name="g_${k}" type="number" min="0" value="${esc(v['recyclage_gold_'+k]??[5,10,35,80,80][i])}" style="width:80px"></td><td><input name="f_${k}" type="number" min="0" value="${esc(v['recyclage_fragments_'+k]??0)}" style="width:80px"></td></tr>`).join('')}</table><button>Enregistrer le recyclage</button></form>
   <h3>🔄 Échanges</h3><form class="f" id="fech" style="flex-direction:column;align-items:flex-start"><small>Chaque carte échangée ajoute son prix au pot ; les joueurs le remplissent à deux. Les fragments s'obtiennent en recyclant les doublons (le joueur choisit gold OU fragments). Nécessite 28-echanges.sql.</small>
    <table><tr><th></th><th>Prix dans le pot 🧩</th><th>Recyclage d'un doublon 🧩</th></tr><tr><td>Commune</td><td><input name="p_commun" type="number" min="0" value="${esc(v.echange_prix_commun??5)}" style="width:80px"></td><td><input name="f_commun" type="number" min="0" value="${esc(v.fragments_recyclage_commun??2)}" style="width:80px"></td></tr><tr><td>Rare</td><td><input name="p_rare" type="number" min="0" value="${esc(v.echange_prix_rare??10)}" style="width:80px"></td><td><input name="f_rare" type="number" min="0" value="${esc(v.fragments_recyclage_rare??4)}" style="width:80px"></td></tr><tr><td>Épique</td><td><input name="p_epique" type="number" min="0" value="${esc(v.echange_prix_epique??30)}" style="width:80px"></td><td><input name="f_epique" type="number" min="0" value="${esc(v.fragments_recyclage_epique??12)}" style="width:80px"></td></tr><tr><td>Légendaire</td><td><input name="p_legendaire" type="number" min="0" value="${esc(v.echange_prix_legendaire??60)}" style="width:80px"></td><td><input name="f_legendaire" type="number" min="0" value="${esc(v.fragments_recyclage_legendaire??25)}" style="width:80px"></td></tr><tr><td>GGEZ</td><td><input name="p_ggez" type="number" min="0" value="${esc(v.echange_prix_ggez??100)}" style="width:80px"></td><td><input name="f_ggez" type="number" min="0" value="${esc(v.fragments_recyclage_ggez??40)}" style="width:80px"></td></tr></table>
    <div class="row"><label><small>Échanges par jour</small><br><input name="pj" type="number" min="0" max="20" value="${esc(v.echange_par_jour??1)}" style="width:80px"></label>
     <label><small>Ancienneté min (jours)</small><br><input name="age" type="number" min="0" max="365" value="${esc(v.echange_age_jours??7)}" style="width:80px"></label>
     <label><small>Boosters ouverts min</small><br><input name="bo" type="number" min="0" max="10000" value="${esc(v.echange_boosters_min??50)}" style="width:80px"></label>
     <label><small>Expiration d'une offre (h)</small><br><input name="exp" type="number" min="1" max="720" value="${esc(v.echange_expiration_h??48)}" style="width:80px"></label>
     <label><small>Cartes max par côté</small><br><input name="mx" type="number" min="1" max="20" value="${esc(v.echange_max_cartes??5)}" style="width:80px"></label></div>
    <button>Enregistrer</button></form>
   <h3>Tests</h3><div class="f"><button class="sec" id="rzc">Remettre à zéro les combats gratuits du jour (tous les joueurs)</button></div>`;
  $('#optorph').onclick=async()=>{const L=$('#optlog');L.textContent='Recherche des images inutilisées…\n';   // images du stockage qui ne servent plus à aucune carte (active ou non), booster, dos ni proposition (20-images-inutilisees.sql)
    const r=await sb.rpc('admin_images_inutilisees');if(r.error){L.textContent+='✗ '+r.error.message+'\n(lance d\'abord 20-images-inutilisees.sql dans Supabase)';return}
    // les dessins seuls des cartes composées (dessins/…) servent à refaire leurs images : ceux encore utilisés ne sont jamais supprimés
    const dp=await sb.from('variantes_carte').select('dessin_path').not('dessin_path','is',null),garde=new Set((dp.data||[]).map(x=>x.dessin_path));
    const R2=(r.data||[]).filter(x=>x.chemin&&!(String(x.chemin).startsWith('dessins/')&&(dp.error||garde.has(x.chemin))));
    const P=R2.map(x=>x.chemin),tot=R2.reduce((a,x)=>a+(+x.octets||0),0);
    if(!P.length){L.textContent+='Aucune image inutilisée : rien à supprimer.';return}
    if(!(await uiConfirm(`Supprimer définitivement ${P.length} image(s) inutilisée(s) (${(tot/1048576).toFixed(1)} Mo) ?\nElles ne servent à aucune carte, active ou désactivée, ni booster, dos ou proposition.`)))return;
    let n=0;for(let i=0;i<P.length;i+=50){const d=await sb.storage.from('cartes').remove(P.slice(i,i+50));if(d.error)L.textContent+='✗ '+d.error.message+'\n';else n+=(d.data||[]).length}
    L.textContent+=`${n} image(s) supprimée(s), ${(tot/1048576).toFixed(1)} Mo libérés.`};
  $('#optdel').onclick=async()=>{const K=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('optim|'))K.push(k)}}catch(e){}
    if(!K.length)return uiAlert('Aucun original à supprimer depuis ce navigateur.');if(!(await uiConfirm('Supprimer définitivement les '+K.length+' image(s) d\'origine ?\nTu ne pourras plus revenir en arrière.')))return;
    const P=K.map(k=>localStorage.getItem(k)).filter(Boolean),L=$('#optlog');L.textContent='';let n=0;
    for(let i=0;i<P.length;i+=50){const r=await sb.storage.from('cartes').remove(P.slice(i,i+50));if(r.error)L.textContent+='✗ '+r.error.message+'\n';else n+=(r.data||[]).length}
    K.forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});L.textContent+=n+' original(aux) supprimé(s).'};
  $('#optback').onclick=async()=>{const K=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('optim|'))K.push(k)}}catch(e){}
    if(!K.length)return uiAlert('Aucune optimisation à annuler depuis ce navigateur.');if(!(await uiConfirm('Remettre les '+K.length+' image(s) d\'origine ?')))return;
    const L=$('#optlog');L.textContent='';let n=0;for(const k of K){const [,tab,id,col]=k.split('|');const p=localStorage.getItem(k);
      const r=await sb.from(tab).update({[col]:p}).eq('id',id);if(r.error)L.textContent+='✗ '+k+' : '+r.error.message+'\n';else{n++;localStorage.removeItem(k)}}
    L.textContent+=n+' image(s) remise(s) à l\'original.'};
  $('#optim').onclick=async()=>{if(!(await uiConfirm('Optimiser toutes les images déjà en ligne ? Les anciens fichiers seront remplacés par des versions WebP plus légères.')))return;const b=$('#optim'),L=$('#optlog');b.disabled=true;L.textContent='';await optimiserImages(t=>{L.textContent+=t+'\n';L.scrollTop=1e9});b.disabled=false};
  $('#fjeu').onsubmit=async e=>{e.preventDefault();const f=e.target,live=f.live.value,prix=Math.max(0,Math.min(100000,parseInt(f.prix.value,10)||0));
    // fermé = jeu_ferme 1 et jeu_live 0 (les compteurs du championnat s'arrêtent comme en pause)
    await q(sb.from('reglages_jeu').upsert([{cle:'jeu_live',valeur:live==='1'?'1':'0'},{cle:'jeu_ferme',valeur:live==='off'?'1':'0'},{cle:'duel_site_prix',valeur:String(prix)}]));await chargerEtat();
    if(live==='off'&&!JEU.ferme){uiAlert('⚠️ Le jeu n\'a pas pu être fermé : lance d\'abord 40-jeu-ferme.sql dans Supabase.');show(tab);return}
    uiAlert(live==='off'?'🔒 Jeu fermé partout : les commandes du live répondent « jeu fermé », !booster est refusé et l\'onglet « Jouer » est masqué pour les joueurs.':live==='0'?'🎬 Jeu en pause : les joueurs jouent sur le site (onglet « 🎮 Jouer »). Pense à fermer Streamer.bot ou à mettre tes récompenses de points de chaîne en pause.':'🎥 Jeu de nouveau en live : l\'onglet « Jouer » est masqué pour les joueurs.');show(tab)};
  $('#fverrou').onsubmit=async e=>{e.preventDefault();const on=e.target.on.checked;
    await q(sb.from('reglages_jeu').upsert({cle:'titre_primes_verrou',valeur:on?'1':'0'}));
    const ok=await sb.rpc('titre_verrouille');if(ok.error){uiAlert('⚠️ Lance d\'abord 42-primes-verrou.sql dans Supabase.');aReglages();return}
    uiAlert(on?'🔒 Primes des ceintures verrouillées : les champions gardent leur série, les compteurs du championnat sont arrêtés. Pense à déverrouiller à ton retour en live.':'🔓 Primes des ceintures déverrouillées : tout repart normalement.');aReglages()};
  $('#fvit').onsubmit=async e=>{e.preventDefault();const v=e.target.v.value;
    await q(sb.from('reglages_jeu').upsert({cle:'vitesse_combat',valeur:v}));uiAlert('Vitesse des combats enregistrée : '+e.target.v.selectedOptions[0].textContent+'. (Si rien ne change en live, lance 27-vitesse-combat.sql dans Supabase.)');aReglages()};
  $('#fr').onsubmit=async e=>{e.preventDefault();const n=Math.max(0,Math.min(50,parseInt(e.target.n.value,10)||0));
    await q(sb.from('reglages_jeu').upsert({cle:'combats_gratuits_par_jour',valeur:String(n)}));uiAlert('Enregistré : '+n+' combat'+(n>1?'s':'')+' gratuit'+(n>1?'s':'')+' par jour.');aReglages()};
  $('#fniv').onsubmit=async e=>{e.preventDefault();const f=e.target,n=x=>Math.max(0,Math.min(1000,+x||0)),o={};
    NIV_LIGNES.forEach(([k])=>{o[k]=[0,1,2].map(i=>n(f[k+'_'+i].value))});NIV_SEULS.forEach(([k])=>{o[k]=n(f[k].value)});
    await q(sb.from('reglages_jeu').upsert({cle:'niveaux_statuts',valeur:JSON.stringify(o)}));uiAlert('Niveaux des statuts enregistrés : ils comptent dès le combat suivant.');aReglages()};
  $('#nivdef').onclick=async()=>{if(!await uiConfirm('Revenir aux valeurs par défaut du moteur pour tous les niveaux ?'))return;
    await q(sb.from('reglages_jeu').upsert({cle:'niveaux_statuts',valeur:''}));uiAlert('Niveaux remis aux valeurs par défaut.');aReglages()};
  $('#fgain').onsubmit=async e=>{e.preventDefault();const f=e.target,n=(x,max)=>Math.max(0,Math.min(max,+x||0));
    const fin=f.fin.value?new Date(f.fin.value):null;if(fin&&isNaN(fin))return uiAlert('Heure de fin invalide.');
    await sauverGains({gain_victoire:Math.round(n(f.gv.value,10000)),gain_defaite:Math.round(n(f.gd.value,10000)),gain_nul:Math.round(n(f.gn.value,10000)),multiplicateur_gains:n(f.mul.value,10),multiplicateur_fin:fin?fin.toISOString():''});
    uiAlert('Gains enregistrés.');aReglages()};
  $('#gx2').onclick=async()=>{await sauverGains({multiplicateur_gains:2,multiplicateur_fin:new Date(Date.now()+6*3600e3).toISOString()});uiAlert('🔥 Soirée double gains lancée pour 6 heures !');aReglages()};
  $('#gx1').onclick=async()=>{await sauverGains({multiplicateur_gains:1,multiplicateur_fin:''});uiAlert('Gains remis à la normale (×1).');aReglages()};
  $('#fbounty').onsubmit=async e=>{e.preventDefault();const f=e.target,n=(x,max)=>Math.max(0,Math.min(max,Math.round(+x||0)));
    const fin=f.fin.value?new Date(f.fin.value):null;if(fin&&isNaN(fin))return uiAlert('Heure de fin invalide.');
    const mn=n(f.bmin.value,100000),mx=Math.max(mn,n(f.bmax.value,100000));
    await sauverGains({bounty_actif:f.on.checked?1:0,bounty_min:mn,bounty_max:mx,bounty_part_gagnant:n(f.bpart.value,100),bounty_chance:n(f.bch.value,100),bounty_tout:n(f.btout.value,100),bounty_fin:fin?fin.toISOString():''});
    uiAlert('Bounty enregistré.');aReglages()};
  $('#bgo').onclick=async()=>{await sauverGains({bounty_actif:1,bounty_fin:new Date(Date.now()+6*3600e3).toISOString()});uiAlert('🎯 Bounty lancé pour 6 heures !');aReglages()};
  $('#bstop').onclick=async()=>{await sauverGains({bounty_actif:0,bounty_fin:''});uiAlert('Bounty arrêté.');aReglages()};
  $('#fma').onsubmit=async e=>{e.preventDefault();const n=Math.max(0,Math.min(50,parseInt(e.target.n.value,10)||0));
    await q(sb.from('reglages_jeu').upsert({cle:'combats_meme_adversaire_par_jour',valeur:String(n)}));uiAlert(n?'Enregistré : '+n+' combat'+(n>1?'s':'')+' maximum par jour contre le même adversaire.':'Enregistré : pas de limite contre le même adversaire.');aReglages()};
  $('#frc').onsubmit=async e=>{e.preventDefault();const f=e.target,rows=[];
    for(const k of['commun','rare','epique','legendaire','ggez']){rows.push({cle:'recyclage_gold_'+k,valeur:String(Math.max(0,parseInt(f['g_'+k].value,10)||0))},{cle:'recyclage_fragments_'+k,valeur:String(Math.max(0,parseInt(f['f_'+k].value,10)||0))})}
    await q(sb.from('reglages_jeu').upsert(rows));PRIX=null;uiAlert('Prix de recyclage enregistrés.');aReglages()};
  $('#fech').onsubmit=async e=>{e.preventDefault();const f=e.target,n=(x,mn,mx)=>String(Math.max(mn,Math.min(mx,parseInt(x,10)||0))),rows=[];
    for(const k of['commun','rare','epique','legendaire','ggez']){rows.push({cle:'echange_prix_'+k,valeur:n(f['p_'+k].value,0,100000)},{cle:'fragments_recyclage_'+k,valeur:n(f['f_'+k].value,0,100000)})}
    rows.push({cle:'echange_par_jour',valeur:n(f.pj.value,0,20)},{cle:'echange_age_jours',valeur:n(f.age.value,0,365)},{cle:'echange_boosters_min',valeur:n(f.bo.value,0,10000)},{cle:'echange_expiration_h',valeur:n(f.exp.value,1,720)},{cle:'echange_max_cartes',valeur:n(f.mx.value,1,20)});
    await q(sb.from('reglages_jeu').upsert(rows));FRAG=null;uiAlert('Réglages des échanges enregistrés.');aReglages()};
  $('#rzc').onclick=async()=>{if(!(await uiConfirm('Remettre à zéro le compteur de combats gratuits de tous les joueurs ?')))return;
    await q(sb.rpc('admin_reset_combats_jour'));uiAlert('Compteurs remis à zéro.')};
}

sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_IN'&&!user)init()});
chargerMiroir().then(init);
</script></body></html>
