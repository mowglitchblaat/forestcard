<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Combat</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent;font-family:system-ui,sans-serif;color:#fff}
body.obs{background:transparent}
#scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-around;opacity:0;transition:opacity .6s}   /* fond entièrement transparent, même pendant le combat (ajoute ?fond à l'URL pour retrouver un fond sombre) */
#scene.dark{background:rgba(8,16,12,.88)}
#tour{text-shadow:0 0 8px #000,0 0 3px #000}.nm{text-shadow:0 0 8px #000,0 0 3px #000}
#scene.on{opacity:1}
.p{position:relative;width:22vw;text-align:center}
.card .char{position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;transition:opacity .9s;background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 38%,rgba(30,12,2,.5) 66%,rgba(10,4,0,.9) 100%),linear-gradient(0deg,rgba(12,5,0,.8),rgba(12,5,0,0) 45%)}
.card .char::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 1.4vh rgba(255,110,20,.55);animation:braises 2.2s ease-in-out infinite;will-change:opacity}
@keyframes braises{50%{opacity:.4}}
.card{position:relative;z-index:1;overflow:hidden;width:100%;aspect-ratio:5/7;border-radius:12px;background:#1b2a22 center/cover;display:flex;align-items:center;justify-content:center;font-size:3vh;font-weight:700;box-shadow:0 0 25px #000;transition:transform .15s}
.card.hit{animation:hit .4s}.card.atk{transform:scale(1.07)}.card.ko{filter:grayscale(1) brightness(.5)}
@keyframes hit{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.nm{margin:1vh 0 .5vh;font-size:2.4vh;font-weight:700;text-shadow:0 0 6px #000}
.bar{height:2.4vh;background:#400;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#22c55e;transition:width .5s}
.pv{font-size:2vh;text-shadow:0 0 4px #000}
/* ATQ (rouge) et PV (bleu) en direct sur la carte — seulement si la carte a une « image pour le combat » (sans chiffres).
   Réglages : --sl / --sr = distance du bord gauche / droit, --sb = distance du bas, --ss = taille des chiffres */
.sv{--sl:5%;--sr:5%;--sb:1.5%;--ss:3.6vw;position:absolute;z-index:5;bottom:var(--sb);font-size:var(--ss);font-weight:900;line-height:1;pointer-events:none;text-shadow:0 0 .35vw #fff,0 0 .35vw #fff,0 0 .15vw #fff}
.sv::before{content:attr(data-v)}.sva{left:var(--sl);color:#e0303c}.svp{right:var(--sr);color:#4747d6}
.sv.pls{animation:svp .5s}@keyframes svp{40%{transform:scale(1.4)}}.sub{font-size:1.7vh;opacity:.8}
/* ATQ boostée temporairement (valeur finale affichée) : rage = braise rouge qui pulse, ATQ ×2 = reflet doré, les deux = rage ; petite flèche ▲ */
.sva.b-rage{color:#ff4a24}.sva.b-x2{color:#ffd23f}.sva.b-rage::after,.sva.b-x2::after{content:'▲';font-size:.42em;vertical-align:.9em;margin-left:.08em}
.sva.b-rage{-webkit-text-stroke:.12vw #a3121c;text-shadow:0 0 .4vw #ff3b2f,0 0 1vw #e01e1e;animation:bRage 1.1s ease-in-out infinite}
.sva.b-rage::after{color:#ff5a3c}
@keyframes bRage{50%{text-shadow:0 0 .7vw #ff7a50,0 0 1.8vw #ff2a1a}}
.sva.b-x2{-webkit-text-stroke:.12vw #8a5a00;text-shadow:0 0 .35vw #fbbf24,0 0 .9vw #d99a0b;animation:bX2 1.6s ease-in-out infinite}
.sva.b-x2::after{color:#fcd34d}
@keyframes bX2{50%{text-shadow:0 0 .7vw #fff3c4,0 0 1.6vw #f5b70a}}
.sva.b-rage.pls,.sva.b-x2.pls{animation:svp .5s,bRage 1.1s ease-in-out .5s infinite}.sva.b-x2.pls{animation:svp .5s,bX2 1.6s ease-in-out .5s infinite}
/* chiffres flottants : au-dessus des cartes et des effets */
.fl{position:absolute;left:50%;top:34%;z-index:12;font-size:10vh;font-weight:900;white-space:nowrap;text-shadow:-.35vh -.35vh 0 #000,.35vh -.35vh 0 #000,-.35vh .35vh 0 #000,.35vh .35vh 0 #000,0 .6vh 1.6vh #000;animation:fl 1.5s ease-out forwards;pointer-events:none}
@keyframes mg{to{box-shadow:inset 0 0 60px 18px rgba(190,110,255,.8)}}
canvas.fx.malediction{box-shadow:inset 0 0 40px 10px rgba(150,70,230,.7);animation:mg 1.8s infinite alternate}
.fl.big{font-size:15vh}
@keyframes fl{0%{transform:translate(-50%,0) scale(.3);opacity:0}12%{transform:translate(-50%,-1vh) scale(1.35);opacity:1}25%{transform:translate(-50%,-2vh) scale(1)}70%{opacity:1}100%{transform:translate(-50%,-12vh) scale(1);opacity:0}}
#mid{width:34vw;text-align:center}
#ban{font-size:3.4vh;font-weight:800;min-height:10vh;text-shadow:0 0 10px #000}
#ban.magie{color:#60a5fa}#ban.piege{color:#f87171}#ban.ultime{color:#fbbf24;font-size:4.4vh}#ban.fin{color:#a7f3d0;font-size:4.6vh}
#tour{font-size:2.4vh;opacity:.8;margin-bottom:1vh}
#ctl{position:fixed;left:8px;bottom:8px;z-index:9;display:none;gap:8px;align-items:center;font-size:14px}
#ctl button,#ctl select{padding:6px 10px;border-radius:6px;border:0}
#log{position:fixed;left:50%;transform:translateX(-50%);bottom:8px;width:30vw;max-height:16vh;overflow:auto;font:12px/1.4 monospace;background:rgba(0,0,0,.6);padding:6px;border-radius:6px;display:none}

.cw{position:relative}
@keyframes ult{0%,100%{transform:scale(1)}20%,80%{transform:scale(1.06)}}
.card.ult{animation:ult 2.3s ease-in-out}
.mp{display:flex;justify-content:center;gap:2vw;margin-top:1vh}
.mw small{display:block;font-size:1.5vh;opacity:.8;margin-top:.4vh}
.mini{width:6.5vw;aspect-ratio:5/7;border-radius:8px;background:#1b2a22 center/cover;display:flex;align-items:center;justify-content:center;font-size:1.4vh;font-weight:700;padding:3px;box-sizing:border-box;box-shadow:0 0 10px #000}
.mini.vide{opacity:.3}
.mini{position:relative}.mini.annule{box-shadow:0 0 14px #ef4444}
.mini.annule::before{content:'';position:absolute;inset:0;border-radius:8px;background:rgba(0,0,0,.5)}
.mini.annule::after{content:'✖';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:6.5vh;font-weight:900;color:#ef2d2d;text-shadow:0 0 6px #000,0 0 14px #000;animation:croix .5s ease-out}
@keyframes croix{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
/* attaque ANNULÉE : la carte s'élance, est stoppée net et s'éteint, un ✖ rouge tamponne la carte (pas de bouclier : rien n'a été bloqué, l'attaque n'a pas eu lieu) */
.pgm{position:absolute;left:0;right:0;bottom:3%;display:flex;justify-content:center;gap:.6vh;z-index:7;pointer-events:none;flex-wrap:wrap;padding:0 4%}
.pgm i{width:3.6vh;height:3.6vh;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(8,16,24,.82);border:.25vh solid #3b5568;box-shadow:0 0 .6vh #000;transition:all .5s;animation:pgin .5s cubic-bezier(.2,.9,.3,1.4)}
.pgm i svg{width:68%;height:68%;fill:#5b7486;transition:fill .5s}
.pgm i.on.p{border-color:#38bdf8;box-shadow:0 0 1.2vh #38bdf8,0 0 .4vh #000}.pgm i.on.p svg{fill:#bae6fd}
.pgm i.on.u{border-color:#fb923c;box-shadow:0 0 1.2vh #fb923c,0 0 .4vh #000}.pgm i.on.u svg{fill:#fed7aa}
.pgm i.flash{animation:pgfl .9s ease-out}
@keyframes pgin{from{transform:scale(0) rotate(-120deg)}to{transform:none}}
@keyframes pgfl{0%{transform:scale(1)}30%{transform:scale(1.5);filter:brightness(2)}100%{transform:scale(1)}}
.card.annul{animation:annul 1s ease-out}
@keyframes annul{0%{transform:none;filter:none}22%{transform:scale(1.07) translateY(-1.2vh)}34%{transform:scale(.96) translateY(.4vh);filter:grayscale(.9) brightness(.6)}70%{filter:grayscale(.9) brightness(.6)}100%{transform:none;filter:none}}
.annx{pointer-events:none;z-index:60;animation:croix .35s ease-out,annxo .5s ease-in .75s forwards}.annx::before,.annx::after{content:'';position:absolute;left:50%;top:50%;width:62%;height:9%;margin:-4.5% 0 0 -31%;border-radius:999px;background:#ef2d2d;box-shadow:0 0 12px #000,0 0 26px rgba(239,45,45,.7)}.annx::before{transform:rotate(45deg)}.annx::after{transform:rotate(-45deg)}
@keyframes annxo{to{opacity:0;transform:scale(.8)}}
.mini.back{background:linear-gradient(135deg,#7f1d1d,#1e1b4b);border:3px solid #f87171;font-size:4vh}
.mini.back.dos{background-color:#111;background-size:cover;background-position:center;border:2px solid rgba(255,255,255,.35)}
.mini.rev{animation:rev .8s;box-shadow:0 0 20px #f87171}
.mini.act{animation:act 1.6s;box-shadow:0 0 20px #60a5fa}
#scene~.zoom,.zoom{position:fixed;z-index:25;border-radius:1.2vh;background:#1b2a22 center/cover;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:3vh;padding:1vh;box-sizing:border-box;pointer-events:none;will-change:transform}
.zoom.magie{box-shadow:0 0 5vh 1.2vh rgba(96,165,250,.85),0 0 0 .5vh rgba(147,197,253,.9)}
.zoom.piege{box-shadow:0 0 5vh 1.2vh rgba(248,113,113,.85),0 0 0 .5vh rgba(252,165,165,.9)}
@keyframes rev{from{transform:rotateY(90deg) scale(1.6)}to{transform:none}}
@keyframes act{30%,70%{transform:scale(1.4);box-shadow:0 0 30px 10px #60a5fa}}
canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
canvas.fx.brulure{box-shadow:inset 0 0 35px 10px rgba(249,115,22,.9);animation:fg .4s infinite alternate}
@keyframes fg{to{box-shadow:inset 0 0 55px 18px rgba(255,160,30,.95)}}
canvas.fx.poison{box-shadow:inset 0 0 40px 12px rgba(34,197,94,.75);animation:pg 1.6s infinite alternate}
@keyframes pg{to{box-shadow:inset 0 0 60px 20px rgba(60,220,90,.85)}}
#fxs{position:fixed;inset:0;width:100%;height:100%;z-index:7;pointer-events:none}
@keyframes dodge{0%{transform:none}25%{transform:translateX(calc(var(--dx)*5vw)) rotate(calc(var(--dx)*7deg)) skewX(calc(var(--dx)*-10deg))}100%{transform:none}}
.card.dodge{animation:dodge .85s cubic-bezier(.2,.8,.3,1)}
@keyframes tremble{0%{transform:none}10%{transform:translate(-2px,1px) rotate(-.3deg)}20%{transform:translate(3px,-1px) rotate(.4deg)}30%{transform:translate(-4px,2px) rotate(-.6deg)}40%{transform:translate(4px,-2px) rotate(.7deg)}50%{transform:translate(-5px,2px) rotate(-.8deg)}60%{transform:translate(5px,-3px) rotate(.9deg)}70%{transform:translate(-6px,3px) rotate(-1deg)}80%{transform:translate(6px,-3px) rotate(1deg)}90%{transform:translate(-7px,3px) rotate(-1.1deg)}100%{transform:translate(7px,-3px) rotate(1.1deg)}}
.card.tremble{animation:tremble .52s linear forwards}
canvas.fx.etourdi{box-shadow:inset 0 0 25px 6px rgba(250,204,21,.5)}
canvas.fx.saignement{box-shadow:inset 0 0 38px 10px rgba(170,10,20,.75);animation:sg 1.4s infinite alternate}
@keyframes sg{to{box-shadow:inset 0 0 55px 16px rgba(200,15,25,.85)}}
/* ligne de l'écriteau qui s'allume quand son effet agit */
.zl{position:absolute;z-index:4;pointer-events:none;border-radius:1.2vw;border:.18vw solid var(--zc);box-shadow:0 0 1vw .3vw var(--zc),inset 0 0 1.4vw .2vw var(--zc);background:color-mix(in srgb,var(--zc) 16%,transparent);mix-blend-mode:screen}
canvas.fx.rage{box-shadow:inset 0 0 38px 10px rgba(230,20,30,.8);animation:rg .5s infinite alternate}
@keyframes rg{to{box-shadow:inset 0 0 55px 16px rgba(255,60,20,.95)}}
canvas.fx.fatigue{box-shadow:inset 0 0 40px 10px rgba(70,90,130,.7)}
canvas.fx.gel{box-shadow:inset 0 0 40px 12px rgba(150,220,255,.8)}
.lame{position:absolute;pointer-events:none;z-index:4;transform-origin:50% 100%;animation:lp 1.1s ease-in-out infinite alternate}
.lame svg{width:100%;height:100%;display:block;overflow:visible}
.lame.l1{left:4%;top:-16%;width:19%;height:44%}.lame.l2{right:4%;top:-16%;width:19%;height:44%}.lame.l3{left:34%;top:-34%;width:32%;height:90%;z-index:5}
.lame::after{content:'';position:absolute;left:50%;bottom:-6%;width:70%;height:14%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(rgba(255,40,50,.85),rgba(160,0,10,0) 70%)}
@keyframes lp{from{filter:drop-shadow(0 0 3px rgba(220,30,40,.55)) drop-shadow(0 3px 3px rgba(0,0,0,.6))}to{filter:drop-shadow(0 0 10px rgba(255,40,50,.95)) drop-shadow(0 3px 3px rgba(0,0,0,.6))}}
canvas.fx.transc{box-shadow:inset 0 0 26px 6px rgba(255,230,150,.6)}
canvas.fx.solide{box-shadow:inset 0 0 30px 8px rgba(120,113,108,.75)}
/* téléphone : menus de test et barre de boutons déplaçables au doigt (n'affecte pas l'écran d'ordinateur) */
#demo,#ctl{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#recap{position:fixed;inset:4vh 22vw;z-index:30;background:rgba(8,14,11,.97);border:1px solid #2f4a3c;border-radius:12px;padding:14px 16px;overflow:auto;display:none;font:14px/1.55 system-ui;color:#e8efe9;box-shadow:0 0 40px #000}
#recap h3{margin:0 0 6px;font-size:16px;color:#fde68a}#recap h5{margin:12px 0 3px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#7dd3a8;border-top:1px solid #24382d;padding-top:6px}
#recap .x{position:sticky;top:0;float:right;padding:5px 12px;border:0;border-radius:6px;background:#334155;color:#fff;cursor:pointer}
#recap .l{padding:1px 0}#recap .l.degats{color:#fca5a5}#recap .l.soin{color:#86efac}#recap .l.piege,#recap .l.magie{color:#93c5fd}#recap .l.ultime{color:#fbbf24}#recap .l.fin{color:#a7f3d0;font-weight:700;margin-top:8px}
#recap .pvs{font-size:12px;opacity:.85;margin:2px 0 6px}
#outils{display:flex;gap:6px;align-items:center;margin:0 0 8px}#outils button,#outils select{padding:6px 10px;border-radius:6px;border:0}
@media(max-width:800px){#recap{inset:2vh 3vw}}
#demo{touch-action:pan-y}
@media(max-width:800px){#demo{width:94vw;max-height:72vh;top:2vh}#ctl{flex-wrap:nowrap;overflow-x:auto;max-width:96vw;touch-action:pan-x}#ctl>*{flex:none;white-space:nowrap}}
#demo{position:fixed;left:50%;top:3vh;transform:translateX(-50%);width:34vw;max-height:94vh;overflow:auto;background:rgba(0,0,0,.55);border-radius:12px;padding:10px;font:13px system-ui;z-index:9;display:none}
#demo h4{margin:8px 0 4px;font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:.08em}
#demo .g{display:grid;grid-template-columns:1fr 1fr;gap:4px}
#demo button,#demo select{padding:7px 6px;border:0;border-radius:6px;background:#1f3a2c;color:#e8fff1;cursor:pointer;font-size:12px}
#demo button:hover{background:#2f6a4a}#demo .big{background:#7c2d12;font-weight:700;width:100%;margin-bottom:4px}
#dl{font:700 16px system-ui;min-height:40px;text-align:center;color:#fde68a;margin-bottom:6px}
#reel select{width:100%;margin-bottom:3px}#reel .ri{font-size:11px;opacity:.8;margin-bottom:4px;min-height:44px}#reel .ri small{display:block;margin-top:2px;opacity:.9}

/* dos de carte au début du combat, puis retournement */
.card .dosf{position:absolute;inset:0;z-index:7;background:linear-gradient(135deg,#14532d,#052e16) center/cover;border-radius:inherit;border:3px solid rgba(255,255,255,.4);box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:7vh}
.mini.back.dos.mag{border-color:rgba(147,197,253,.55)}
/* brillances de rareté (comme dans le catalogue) */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes cbspin{to{--ang:360deg}}
@keyframes cbglow{0%,100%{box-shadow:0 0 1.2vh 0 var(--g1)}50%{box-shadow:0 0 3.2vh .5vh var(--g2)}}
@keyframes cbshine{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.cw{--g:#888;--g1:color-mix(in srgb,var(--g) 40%,transparent);--g2:color-mix(in srgb,var(--g) 85%,transparent)}
.cw.rr::before{content:'';position:absolute;inset:-3px;border-radius:15px;z-index:0;animation:cbglow 3s ease-in-out infinite}
.cw.rr-ra::before{animation-duration:3.6s}.cw.rr-ep::before{animation-duration:3s}
.cw.rr-lg::before{inset:-5px;border-radius:17px;background:conic-gradient(from var(--ang),var(--g),#fffbe0,var(--g),#ffe58a,var(--g));animation:cbglow 2.4s ease-in-out infinite,cbspin 4.5s linear infinite}
.card .shn{position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.42) 50%,transparent 62%);transform:translateX(-130%);animation:cbshine 4.2s ease-in-out infinite}
.cw.rr-lg .card .shn{animation-duration:3.2s}

/* tour en cours : le pseudo du joueur s'allume au-dessus de sa carte */
.pj{font-size:3.7vh;font-weight:900;letter-spacing:.02em;line-height:1.1;margin:0 0 1.2vh;color:#e5ece7;opacity:.55;text-shadow:0 0 8px #000,0 0 3px #000;transition:opacity .35s,transform .35s,color .35s;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq{display:inline-flex;gap:.6vh;margin-left:1vh;vertical-align:middle}.eq b{width:1.5vh;height:1.5vh;border-radius:50%;background:#fcd34d;box-shadow:0 0 .8vh #f59e0b;display:inline-block}.eq b.off{background:#3f3f46;box-shadow:none}.eq b.go{animation:eqgo .9s ease-out}@keyframes eqgo{0%{transform:scale(2.2);background:#fff}100%{transform:none}}
.belt{position:absolute;left:50%;bottom:14%;width:128%;transform:translateX(-50%);z-index:6;--r:0deg;pointer-events:none;filter:drop-shadow(0 .4vh .6vh rgba(0,0,0,.85)) drop-shadow(0 0 1.2vh rgba(255,215,120,.55));animation:beltlueur 2.6s ease-in-out infinite}
@keyframes beltlueur{50%{filter:drop-shadow(0 .4vh .6vh rgba(0,0,0,.85)) drop-shadow(0 0 2.4vh rgba(255,230,150,.9))}}
#beltmid{display:block;width:26vw;margin:0 auto 1.5vh;filter:drop-shadow(0 0 1.5vh rgba(255,215,120,.6));animation:beltlueur 2.6s ease-in-out infinite}
.belt.pop,#beltmid.pop{animation:beltpop .9s cubic-bezier(.2,1.4,.4,1),beltlueur 2.6s ease-in-out .9s infinite}
.belt.b1,.belt.b2{width:62%;bottom:auto;top:7%}.belt.b1{left:13%;--r:-45deg;transform:translateX(-50%) rotate(var(--r))}.belt.b2{left:87%;--r:45deg;transform:translateX(-50%) rotate(var(--r))}
@keyframes beltpop{0%{opacity:0;transform:translateX(-50%) rotate(var(--r)) scale(2.2)}100%{opacity:1;transform:translateX(-50%) rotate(var(--r)) scale(1)}}
.p.actif .pj{opacity:1;color:#fff;transform:scale(1.1);animation:pjglow 1.6s ease-in-out infinite;text-shadow:0 0 .8vh #ffd34d,0 0 2vh #ffb300,0 0 3px #000}
.p.actif .pj::before{content:'▶ ';color:#ffd34d}.p.actif .pj::after{content:' ◀';color:#ffd34d}
@keyframes pjglow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
.p.actif .nm{color:#fff}
.p.idle .cw{filter:brightness(.72) saturate(.85)}
.cw{transition:filter .4s}
.nm{font-size:2vh;font-weight:600;opacity:.9}

.cw.rr-ul::before{inset:-5px;border-radius:17px;background:conic-gradient(from var(--ang),#ff3b6b,#ffb703,#5eead4,#60a5fa,#c084fc,#ff3b6b);animation:cbglow 2s ease-in-out infinite,cbspin 3.4s linear infinite}
.cw.rr-ul{--g1:rgba(255,120,200,.45);--g2:rgba(120,200,255,.9)}
.cw.brise::before{opacity:0!important;animation:none!important;transition:opacity .15s}   /* carte brisée : le contour de rareté part avec les éclats */
.cw.rr-ul .card .shn{background:linear-gradient(115deg,transparent 30%,rgba(255,60,120,.4) 40%,rgba(255,220,60,.42) 47%,rgba(80,255,200,.42) 54%,rgba(100,160,255,.42) 61%,transparent 70%);mix-blend-mode:color-dodge;animation-duration:2.6s}
.avm{position:absolute;top:-17%;width:17%;height:42%;z-index:6;pointer-events:none;transform-origin:50% 92%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.7))}
.avm svg{width:100%;height:100%;display:block;overflow:visible}.avm.a1{left:6%}.avm.a2{right:6%}
.avm.idle{animation:avsw 1.3s ease-in-out infinite alternate}@keyframes avsw{from{rotate:-4deg}to{rotate:4deg}}
.cw.avalee{opacity:.2;filter:grayscale(1) blur(1px);transition:opacity .5s,filter .5s}
.ventre{position:absolute;left:50%;bottom:-9%;width:40%;aspect-ratio:1;translate:-50% 0;z-index:7;pointer-events:none;border-radius:50%;background:#2a0f16 center/cover;
 border:3px solid #f472b6;box-shadow:0 0 0 3px #4a0d22,0 0 22px rgba(244,114,182,.75),inset 0 0 18px rgba(0,0,0,.85);animation:vbat 1.1s ease-in-out infinite}
