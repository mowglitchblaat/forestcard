<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jeu de cartes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#14141a;color:#eee}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#1d1d27}
h1{margin:0;font-size:20px}nav{display:flex;gap:6px;padding:10px 20px;flex-wrap:wrap}
@media(max-width:800px){nav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x;padding:10px 12px}nav button{flex:none;white-space:nowrap}main{overflow-x:auto;-webkit-overflow-scrolling:touch}table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}}
main{padding:10px 20px 40px;max-width:1100px;margin:auto}
button,select,input,textarea{font:inherit;padding:7px 10px;border-radius:6px;border:1px solid #444;background:#262633;color:#eee}
button{cursor:pointer;background:#7c3aed;border-color:#7c3aed}button.sec{background:#262633;border-color:#444}button.on{background:#7c3aed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{border:3px solid #444;border-radius:10px;padding:6px;background:#1d1d27;display:flex;flex-direction:column;gap:4px}
.card img{width:100%;border-radius:6px}small{color:#aaa}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:26px 22px;padding:10px}
.cw{display:flex;flex-direction:column;gap:12px}
.cimg{width:100%;display:block;filter:drop-shadow(0 0 3px var(--g)) drop-shadow(0 0 12px var(--g))}
.inf{font-size:11px;color:#6b6b78;text-align:center;line-height:1.4;border-top:1px dashed #2c2c38;padding-top:6px}
.dbar{position:sticky;top:0;z-index:5;background:#1d1d27;padding:10px 14px;border-radius:10px;margin:8px 0 14px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid #2c2c38}
button:disabled{opacity:.4;cursor:not-allowed}
.cimg.in{filter:drop-shadow(0 0 3px var(--g)) drop-shadow(0 0 12px var(--g)) drop-shadow(0 0 24px var(--g))}
.cw button{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
form.f{display:grid;gap:8px;max-width:720px;background:#1d1d27;padding:14px;border-radius:10px;margin-bottom:20px}
table{border-collapse:collapse;width:100%}td,th{padding:6px;border-bottom:1px solid #333;text-align:left}
.ok{color:#4ade80}.ko{color:#f87171}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:8px 0 22px}
.stat{background:#1d1d27;border:1px solid #2c2c38;border-radius:10px;padding:12px}
.stat b{display:block;font-size:26px;margin:2px 0}.stat span{color:#aaa;font-size:13px;display:block}
.stat.card2{display:flex;gap:12px;align-items:center;grid-column:span 2}
.stat.card2 img{width:80px;border-radius:4px;filter:drop-shadow(0 0 3px var(--g)) drop-shadow(0 0 10px var(--g))}
.mk{min-width:0}.mk>select{width:100%;max-width:100%;text-overflow:ellipsis}
.mk .row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}.mk .row label{flex:1 1 130px;min-width:0}.mk .row input,.mk .row select{width:100%;min-width:0;max-width:100%}
form.f select{max-width:100%;min-width:0}form.f>*{min-width:0}
</style></head><body>
<header><h1>🃏 Jeu de cartes</h1><div id="me"></div></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const sb=supabase.createClient('https://bjsvqikjnvaomyoifiml.supabase.co','sb_publishable_-3cPqDCyE-zhb3z5r6dPhg_DJFKGAI6');
const $=s=>document.querySelector(s),main=$('#main');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=p=>p?sb.storage.from('cartes').getPublicUrl(p).data.publicUrl:'';
async function q(p){const r=await p;if(r.error){alert(r.error.message);throw r.error}return r.data}
let user,joueur,isAdmin,tab='collection',sub='cartes',B={};
const opts=(a,l='nom')=>a.map(x=>`<option value="${x.id}">${esc(x[l])}</option>`).join('');
const TABS={collection:'Ma collection',boutique:'Boutique',deck:'Mon deck',profil:'Profils'};

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){
    $('#nav').innerHTML='';$('#me').innerHTML='<button id="login">Se connecter avec Twitch</button>';
    main.innerHTML='<p>Connecte-toi avec ton compte Twitch pour voir ta collection.</p>';
    $('#login').onclick=()=>sb.auth.signInWithOAuth({provider:'twitch',options:{redirectTo:location.origin+location.pathname}});
    return;
  }
  user=session.user;
  joueur=await q(sb.from('joueurs').select('*').eq('id',user.id).single());
  isAdmin=await q(sb.rpc('is_admin'));
  header();show(tab);
}
function header(){
  $('#me').innerHTML=`${isAdmin?'<small style="opacity:.5;margin-right:8px">site v8</small>':''}${esc(joueur.pseudo)} · 💰 ${joueur.monnaie} <button class="sec" id="out">Déconnexion</button>`;
  $('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};
}
async function refreshJoueur(){joueur=await q(sb.from('joueurs').select('*').eq('id',user.id).single());header()}
function show(t){
  tab=t;const T={...TABS};if(isAdmin)T.admin='⚙️ Admin';
  $('#nav').innerHTML=Object.entries(T).map(([k,v])=>`<button class="${k==t?'on':'sec'}" data-t="${k}">${v}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.t));
  ({collection:vCollection,boutique:vBoutique,deck:vDeck,profil:vProfil,admin:vAdmin})[t]();
}

/* ---------- Collection ---------- */
let deck=null,typeOf={},flt='tout',fcol='tout',collData=[];
const cn=x=>x.variantes_carte.cartes.collections?.nom||'Communes';
const TYPES={combattant:'Combattants',magie:'Magies',piege:'Pièges'};
async function loadColl(){
  collData=await q(sb.from('collection_joueur').select('quantite,variantes_carte(nom,image_path,cartes(id,nom,type,collections(nom),raretes(nom,couleur)))').eq('joueur_id',user.id));
  typeOf={};collData.forEach(x=>{const c=x.variantes_carte.cartes;typeOf[c.id]=c.type});
  if(!deck){const dk=await q(sb.from('deck').select('carte_id').eq('joueur_id',user.id));deck=new Set(dk.map(x=>x.carte_id))}
}
function updBar(){
  const n=t=>[...deck].filter(i=>typeOf[i]==t).length,ok=deck.size>=9&&deck.size<=10&&n('combattant')>=3&&n('magie')>=3&&n('piege')>=3;
  $('#dbar').innerHTML=`<span><b>${deck.size}/10</b> — combattants ${n('combattant')}/3 · magies ${n('magie')}/3 · pièges ${n('piege')}/3</span><button id="sv" ${ok?'':'disabled'} title="9 ou 10 cartes, au moins 3 de chaque type">Enregistrer le deck</button>`;
  $('#sv').onclick=async()=>{
    const {error}=await sb.rpc('enregistrer_deck',{p_cartes:[...deck]});
    alert(error?({DECK_TAILLE_INVALIDE:'Il faut 9 ou 10 cartes.',DECK_COMPOSITION_INVALIDE:'Il faut au moins 3 cartes de chaque type.'}[error.message]||error.message):'Deck enregistré !');};
}
function cardHTML(x){
  const v=x.variantes_carte,c=v.cartes,on=deck.has(c.id);
  return `<div class="cw">${v.image_path?`<img class="cimg${on?' in':''}" style="--g:${esc(c.raretes.couleur)}" src="${img(v.image_path)}">`:''}<div class="inf">${esc(c.nom)} · ${esc(c.type)} · ${esc(c.raretes.nom)}<br>${esc(v.nom)} ×${x.quantite}</div><button class="${on?'sec':''}" data-c="${c.id}">${on?'✓ Retirer du deck':'Ajouter au deck'}</button></div>`;
}
function bindToggle(redraw){
  main.querySelectorAll('button[data-c]').forEach(b=>b.onclick=()=>{const id=+b.dataset.c;
    if(deck.has(id))deck.delete(id);
    else if(deck.size>=10){alert('Deck complet : 10 cartes maximum.');return}
    else deck.add(id);
    redraw();});
}
async function vCollection(){
  await loadColl();
  if(!collData.length){main.innerHTML='<p>Tu n\'as encore aucune carte. Achète un booster dans la boutique, puis ouvre-le en live avec !booster.</p>';return}
  main.innerHTML='<div id="dbar" class="dbar"></div><div class="row" id="flt"></div><div class="row" id="fcol"></div><div class="cgrid" id="gr"></div>';
  drawColl();
}
function drawColl(){
  $('#flt').innerHTML=[['tout','Tout'],...Object.entries(TYPES)].map(([k,v])=>`<button class="${k==flt?'on':'sec'}" data-f="${k}">${v}</button>`).join('');
  $('#flt').querySelectorAll('button').forEach(b=>b.onclick=()=>{flt=b.dataset.f;drawColl()});
  const names=[...new Set(collData.map(cn))].sort();
  $('#fcol').innerHTML=[['tout','Toutes les collections'],...names.map(n=>[n,n])].map(([k,v])=>`<button class="${k==fcol?'on':'sec'}" data-k="${esc(k)}">${esc(v)}</button>`).join('');
  $('#fcol').querySelectorAll('button').forEach(b=>b.onclick=()=>{fcol=b.dataset.k;drawColl()});
  $('#gr').innerHTML=collData.filter(x=>(flt=='tout'||x.variantes_carte.cartes.type==flt)&&(fcol=='tout'||cn(x)==fcol)).map(cardHTML).join('');
  bindToggle(drawColl);updBar();
}

/* ---------- Boutique ---------- */
async function vBoutique(){
  const [t,s]=await Promise.all([q(sb.from('types_boosters').select('*').eq('actif',true)),
    q(sb.from('stock_boosters').select('quantite,types_boosters(nom)').eq('joueur_id',user.id).gt('quantite',0))]);
  main.innerHTML=`<h3>Tes boosters non ouverts</h3><p>${s.length?s.map(x=>`${esc(x.types_boosters.nom)} ×${x.quantite}`).join(' · ')+'<br><small>Ouvre-les pendant le live avec !booster</small>':'Aucun'}</p>
  <h3>Acheter</h3><div class="grid">${t.map(b=>`<div class="card">${b.image_path?`<img src="${img(b.image_path)}">`:''}<b>${esc(b.nom)}</b><small>${b.nb_cartes} cartes</small><button data-id="${b.id}">Acheter · 💰 ${b.prix}</button></div>`).join('')}</div>`;
  main.querySelectorAll('button[data-id]').forEach(b=>b.onclick=async()=>{
    const {error}=await sb.rpc('acheter_booster',{p_type_id:+b.dataset.id});
    if(error)alert(error.message.includes('MONNAIE')?'Pas assez de monnaie.':error.message);
    await refreshJoueur();vBoutique();});
}

/* ---------- Deck ---------- */
async function vDeck(){
  await loadColl();
  main.innerHTML='<div id="dbar" class="dbar"></div><div class="cgrid" id="gr"></div>';
  drawDeck();
}
function drawDeck(){
  const seen=new Set(),ord={combattant:0,magie:1,piege:2};
  const L=collData.filter(x=>{const i=x.variantes_carte.cartes.id;if(!deck.has(i)||seen.has(i))return false;seen.add(i);return true})
    .sort((a,b)=>ord[a.variantes_carte.cartes.type]-ord[b.variantes_carte.cartes.type]);
  $('#gr').innerHTML=L.length?L.map(cardHTML).join(''):'<p>Ton deck est vide. Ajoute des cartes depuis « Ma collection ».</p>';
  bindToggle(drawDeck);updBar();
}

/* ---------- Profils (visibles par tous les joueurs connectés) ---------- */
async function vProfil(id=user.id){
  const mine=id==user.id;
  const [rl,rp]=await Promise.all([sb.rpc('liste_profils'),sb.rpc('profil_public',{p_joueur:id})]);
  if(rl.error||rp.error){main.innerHTML='<p class="ko">Profils indisponibles pour le moment (l\'admin doit d\'abord lancer 05-profil.sql puis 06-profils-publics.sql dans Supabase).</p>';return}
  if(!rp.data){main.innerHTML='<p>Profil introuvable.</p>';return}
  const D=rp.data,S=D.stats||{},n=k=>S[k]??0,tot=n('victoires')+n('defaites')+n('nuls');
  const pct=tot?Math.round(100*n('victoires')/tot)+' %':'—';
  const st=(l,v,s)=>`<div class="stat"><span>${l}</span><b>${v}</b>${s?`<span>${s}</span>`:''}</div>`;
  const cardTile=(l,x,u)=>{
    if(!x)return st(l,'—');
    return `<div class="stat card2" style="--g:${esc(x.couleur||'#888')}">${x.image_path?`<img src="${img(x.image_path)}">`:''}<div><span>${l}</span><b style="font-size:18px">${esc(x.nom)}</b><span>${x.valeur} ${u}</span></div></div>`};
  let coll='';
  if(mine){
    await loadColl();
    const rt=await sb.from('cartes').select('id',{count:'exact',head:true}).eq('actif',true);
    const mc=new Map();collData.forEach(x=>{const c=x.variantes_carte.cartes;mc.set(c.id,c)});
    const copies=collData.reduce((a,x)=>a+x.quantite,0),byR={};
    mc.forEach(c=>{const r=c.raretes.nom;byR[r]=(byR[r]||0)+1});
    coll=`<h3>Collection</h3><div class="stats">
   ${st('Cartes différentes',mc.size+(rt.count!=null?' / '+rt.count:''))}${st('Cartes au total',copies,'doublons compris')}
   ${st('Boosters ouverts',n('boosters_ouverts'))}
   ${Object.entries(byR).map(([k,v])=>st(esc(k),v,'cartes différentes')).join('')}</div>`;
  }
  const rank=rl.data.slice(0,50).map((x,i)=>`<tr><td>${i+1}</td><td><button class="${x.joueur_id==id?'on':'sec'}" data-p="${x.joueur_id}">${esc(x.pseudo)}${x.joueur_id==user.id?' (moi)':''}</button></td><td>${x.victoires}</td><td>${x.defaites}</td><td>${x.nuls}</td></tr>`).join('');
  main.innerHTML=`<div class="row"><h3 style="margin:0">${mine?'Mon profil':'Profil de '+esc(D.pseudo)}</h3>${mine?'':`<button class="sec" data-p="${user.id}">← Mon profil</button>`}</div>
  <h3>Combats</h3><div class="stats">
   ${st('Victoires',n('victoires'))}${st('Défaites',n('defaites'))}${st('Nuls',n('nuls'))}
   ${st('% de victoires',pct,tot+' combat'+(tot>1?'s':''))}
   ${st('Meilleure série de victoires',n('meilleure_serie'))}${st('Série en cours',n('serie_actuelle'))}</div>
  <h3>Records</h3><div class="stats">
   ${st('Plus gros coup infligé',n('plus_gros_coup'),'dégâts en une attaque')}
   ${st('Victoire la plus rapide',S.victoire_rapide_tours?S.victoire_rapide_tours+' tours':'—')}
   ${st('Combat le plus long',S.combat_long_tours?S.combat_long_tours+' tours':'—')}
   ${st('Dégâts totaux infligés',n('degats_totaux'))}</div>
  <h3>Cartes</h3><div class="stats">${cardTile('Carte la plus jouée',D.plus_jouee,'combats')}${cardTile('Carte la plus victorieuse',D.plus_gagnante,'victoires')}</div>
  ${coll}
  ${tot?'':`<p><small>${mine?'Aucun combat joué pour l\'instant : tes statistiques de combat apparaîtront après ton premier combat.':'Ce joueur n\'a pas encore combattu.'}</small></p>`}
  <h3>Classement</h3><p><small>Clique sur un pseudo pour voir son profil.</small></p>
  <table><tr><th>#</th><th>Joueur</th><th>V</th><th>D</th><th>N</th></tr>${rank}</table>`;
  main.querySelectorAll('button[data-p]').forEach(b=>b.onclick=()=>{vProfil(b.dataset.p);window.scrollTo(0,0)});
}

/* ---------- Admin ---------- */
async function vAdmin(){
  const S={cartes:'Cartes',collections:'Collections',boosters:'Boosters',effets:'Effets',raretes:'Raretés',cadeaux:'Cadeaux',joueurs:'Joueurs'};
  main.innerHTML=`<div class="row">${Object.entries(S).map(([k,v])=>`<button class="${k==sub?'on':'sec'}" data-s="${k}">${v}</button>`).join('')}</div><div id="sub"></div>`;
  main.querySelectorAll('button[data-s]').forEach(b=>b.onclick=()=>{sub=b.dataset.s;vAdmin()});
  ({cartes:aCartes,collections:aCollections,boosters:aBoosters,effets:aEffets,raretes:aRaretes,cadeaux:aCadeaux,joueurs:aJoueurs})[sub]();
}
async function upload(file){
  const path=crypto.randomUUID()+'.'+(file.name.split('.').pop()||'png');
  await q(sb.storage.from('cartes').upload(path,file,{contentType:file.type}));return path;
}

 annule_attaque:['Annule la prochaine attaque'],double_degats:['Double ses dégâts pendant X tours','tours'],echange_atq_def:["Échange l'ATQ et la défense de l'adversaire"],
 malediction:["Malédiction : l'ATQ baisse de X points par tour pendant X tours",'ciblem','val','tours'],

const MAG={atq_mod:["Modifie l'ATQ (négatif = baisse)",'cible','val','u'],pv_mod:['Modifie les PV max (négatif = baisse)','cible','val','u'],

function mk(el,cat){
  el.classList.add('mk');el.innerHTML=`<select><option value="">— Aucun —</option>${Object.entries(cat).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select><div class="row"></div>`;
  const s=el.querySelector('select'),d=el.querySelector('.row');
  s.onchange=()=>{d.innerHTML=s.value?cat[s.value].slice(1).map(k=>{const [l,t]=P[k];
    return `<label><small>${l}</small><br>${t=='n'?`<input data-k="${k}" type="number" step="any">`:`<select data-k="${k}">${t.map(o=>`<option value="${o}">${OL[o]||o}</option>`).join('')}</select>`}</label>`}).join(''):''};
  return {get(){if(!s.value)return null;const o={type:s.value};
    d.querySelectorAll('[data-k]').forEach(i=>o[i.dataset.k]=i.tagName=='INPUT'?(i.value===''?null:+i.value):i.value);return o},
  set(o){if(!o||!o.type)return;s.value=o.type;if(s.value!==o.type){s.value='';return}s.onchange();
    d.querySelectorAll('[data-k]').forEach(i=>{if(o[i.dataset.k]!=null)i.value=o[i.dataset.k]})}};
}

// Multi-effet : plusieurs effets pour une même magie / un même piège (stockés sous forme { briques:[...] })
function mkMulti(el,cat){
  el.innerHTML='<div class="mm"></div><button type="button" class="sec mplus">+ Ajouter un effet</button>';
  const zone=el.querySelector('.mm'),L=[];
  const add=()=>{const w=document.createElement('div');w.style.cssText='border-left:3px solid #7c3aed;padding-left:8px;margin:6px 0';
    const inner=document.createElement('div'),x=document.createElement('button');x.type='button';x.className='sec';x.textContent='✕ Retirer cet effet';
    w.append(inner,x);zone.appendChild(w);const m=mk(inner,cat),it={m,w};L.push(it);
    x.onclick=()=>{if(L.length<2)return;w.remove();L.splice(L.indexOf(it),1)};return m};
  el.querySelector('.mplus').onclick=add;add();
  return {get(){const a=L.map(i=>i.m.get()).filter(Boolean);return !a.length?null:a.length==1?a[0]:{briques:a}},
   set(o){if(!o)return;const arr=o.briques||[o];while(L.length>1){L.pop().w.remove()}arr.forEach((b,i)=>{(i==0?L[0].m:add()).set(b)})}};
}

   <select name="t">${opts(t)}</select><input name="n" type="number" min="1" value="1"><button>Offrir</button></form>`;
  $('#fg').onsubmit=async e=>{e.preventDefault();const f=e.target;
    const {error}=await sb.rpc('offrir_boosters',{p_joueur:f.j.value||null,p_type_id:+f.t.value,p_quantite:+f.n.value});
    alert(error?error.message:'Boosters offerts !');};
}

/* ---------- Admin : gérer les cartes et boosters des membres ---------- */
async function aJoueurs(){
  const j=await q(sb.from('joueurs').select('id,pseudo,monnaie').order('pseudo'));
  $('#sub').innerHTML=`<p><small>Gère les cartes et les boosters des membres, par exemple pour nettoyer après les tests. Les suppressions sont définitives. (Il faut avoir lancé 05-admin-joueurs.sql dans Supabase.)</small></p>
   <div class="f"><select id="jsel"><option value="">— Choisir un joueur —</option>${opts(j,'pseudo')}</select></div>
   <div id="jbox"></div>
   <h3>Remise à zéro</h3>
   <div class="f"><label><input type="checkbox" id="rzb" checked> vider aussi les boosters non ouverts</label>
    <label>monnaie remise à <input id="rzm" type="number" min="0" style="width:90px" placeholder="inchangée"></label></div>
   <div class="f"><button class="sec" id="rzj">Vider le joueur choisi</button><button id="rza" style="background:#b91c1c">Vider TOUS les joueurs</button></div>`;
  const opt=()=>({p_boosters:$('#rzb').checked,p_monnaie:$('#rzm').value===''?null:+$('#rzm').value});
  const fini=async m=>{collData=[];deck=null;await refreshJoueur();alert(m);aJoueurs()};
  async function load(){
    const id=$('#jsel').value;if(!id){$('#jbox').innerHTML='';return}
    const d=await q(sb.rpc('admin_collection',{p_joueur:id})),p=j.find(x=>x.id==id),tot=d.reduce((s,x)=>s+x.quantite,0);
    $('#jbox').innerHTML=`<p><b>${esc(p.pseudo)}</b> · 💰 ${p.monnaie} · ${tot} carte(s)</p>`+(d.length?`<table><tr><th>Carte</th><th>Type</th><th>Version</th><th>Qté</th><th></th></tr>${d.map(x=>`<tr><td>${esc(x.carte)}</td><td>${esc(x.type)}</td><td>${esc(x.variante)}</td><td>${x.quantite}</td><td><button class="sec" data-r="${x.variante_id}" data-n="1">−1</button> <button class="sec" data-r="${x.variante_id}">Tout retirer</button></td></tr>`).join('')}</table>`:'<p><small>Aucune carte dans la collection.</small></p>');
    $('#jbox').querySelectorAll('button[data-r]').forEach(b=>b.onclick=async()=>{
      if(!b.dataset.n&&!confirm('Retirer toutes les copies de cette carte à ce joueur ?'))return;
      await q(sb.rpc('admin_retirer_carte',{p_joueur:id,p_variante:b.dataset.r,p_quantite:b.dataset.n?+b.dataset.n:null}));
      collData=[];deck=null;load()});
  }
  $('#jsel').onchange=load;
  $('#rzj').onclick=async()=>{const id=$('#jsel').value;if(!id)return alert('Choisis d\'abord un joueur.');
    const p=j.find(x=>x.id==id);if(!confirm('Vider la collection et le deck de '+p.pseudo+($('#rzb').checked?' ainsi que ses boosters non ouverts':'')+' ?\nC\'est définitif.'))return;
    await q(sb.rpc('admin_vider_joueur',{p_joueur:id,...opt()}));fini('Joueur remis à zéro.')};
  $('#rza').onclick=async()=>{if(prompt('Cela vide les cartes de TOUS les joueurs, toi compris. Tape VIDER pour confirmer :')!=='VIDER')return;
    await q(sb.rpc('admin_vider_joueur',{p_joueur:null,...opt()}));fini('Tous les joueurs ont été remis à zéro.')};
}

sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_IN'&&!user)init()});
init();
</script></body></html>
