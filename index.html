<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jeu de cartes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#14141a;color:#eee}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#1d1d27}
h1{margin:0;font-size:20px}nav{display:flex;gap:6px;padding:10px 20px;flex-wrap:wrap}
main{padding:10px 20px 40px;max-width:1100px;margin:auto}
button,select,input,textarea{font:inherit;padding:7px 10px;border-radius:6px;border:1px solid #444;background:#262633;color:#eee}
button{cursor:pointer;background:#7c3aed;border-color:#7c3aed}button.sec{background:#262633;border-color:#444}button.on{background:#7c3aed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{border:3px solid #444;border-radius:10px;padding:6px;background:#1d1d27;display:flex;flex-direction:column;gap:4px}
.card img{width:100%;border-radius:6px}small{color:#aaa}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:26px 22px;padding:10px}
.cw{display:flex;flex-direction:column;gap:12px}
.cimg{width:100%;display:block;filter:drop-shadow(0 0 3px var(--g)) drop-shadow(0 0 12px var(--g))}
.inf{font-size:11px;color:#6b6b78;text-align:center;line-height:1.4;border-top:1px dashed #2c2c38;padding-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
form.f{display:grid;gap:8px;max-width:520px;background:#1d1d27;padding:14px;border-radius:10px;margin-bottom:20px}
table{border-collapse:collapse;width:100%}td,th{padding:6px;border-bottom:1px solid #333;text-align:left}
.ok{color:#4ade80}.ko{color:#f87171}
</style></head><body>
<header><h1>🃏 Jeu de cartes</h1><div id="me"></div></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const sb=supabase.createClient('https://bjsvqikjnvaomyoifiml.supabase.co','sb_publishable_-3cPqDCyE-zhb3z5r6dPhg_DJFKGAI6');
const $=s=>document.querySelector(s),main=$('#main');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=p=>p?sb.storage.from('cartes').getPublicUrl(p).data.publicUrl:'';
async function q(p){const r=await p;if(r.error){alert(r.error.message);throw r.error}return r.data}
let user,joueur,isAdmin,tab='collection',sub='cartes',B={};
const opts=(a,l='nom')=>a.map(x=>`<option value="${x.id}">${esc(x[l])}</option>`).join('');
const TABS={collection:'Ma collection',boutique:'Boutique',deck:'Mon deck'};

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){
    $('#nav').innerHTML='';$('#me').innerHTML='<button id="login">Se connecter avec Twitch</button>';
    main.innerHTML='<p>Connecte-toi avec ton compte Twitch pour voir ta collection.</p>';
    $('#login').onclick=()=>sb.auth.signInWithOAuth({provider:'twitch',options:{redirectTo:location.origin+location.pathname}});
    return;
  }
  user=session.user;
  joueur=await q(sb.from('joueurs').select('*').eq('id',user.id).single());
  isAdmin=await q(sb.rpc('is_admin'));
  header();show(tab);
}
function header(){
  $('#me').innerHTML=`${esc(joueur.pseudo)} · 💰 ${joueur.monnaie} <button class="sec" id="out">Déconnexion</button>`;
  $('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};
}
async function refreshJoueur(){joueur=await q(sb.from('joueurs').select('*').eq('id',user.id).single());header()}
function show(t){
  tab=t;const T={...TABS};if(isAdmin)T.admin='⚙️ Admin';
  $('#nav').innerHTML=Object.entries(T).map(([k,v])=>`<button class="${k==t?'on':'sec'}" data-t="${k}">${v}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.t));
  ({collection:vCollection,boutique:vBoutique,deck:vDeck,admin:vAdmin})[t]();
}

/* ---------- Collection ---------- */
async function vCollection(){
  const d=await q(sb.from('collection_joueur').select('quantite,variantes_carte(nom,image_path,cartes(nom,type,raretes(nom,couleur)))').eq('joueur_id',user.id));
  main.innerHTML=d.length?'<div class="cgrid">'+d.map(x=>{const v=x.variantes_carte,c=v.cartes;
    return `<div class="cw">${v.image_path?`<img class="cimg" style="--g:${esc(c.raretes.couleur)}" src="${img(v.image_path)}">`:''}<div class="inf">${esc(c.nom)} · ${esc(c.type)} · ${esc(c.raretes.nom)}<br>${esc(v.nom)} ×${x.quantite}</div></div>`}).join('')+'</div>'
    :'<p>Tu n\'as encore aucune carte. Achète un booster dans la boutique, puis ouvre-le en live avec !booster.</p>';
}

/* ---------- Boutique ---------- */
async function vBoutique(){
  const [t,s]=await Promise.all([q(sb.from('types_boosters').select('*').eq('actif',true)),
    q(sb.from('stock_boosters').select('quantite,types_boosters(nom)').eq('joueur_id',user.id).gt('quantite',0))]);
  main.innerHTML=`<h3>Tes boosters non ouverts</h3><p>${s.length?s.map(x=>`${esc(x.types_boosters.nom)} ×${x.quantite}`).join(' · ')+'<br><small>Ouvre-les pendant le live avec !booster</small>':'Aucun'}</p>
  <h3>Acheter</h3><div class="grid">${t.map(b=>`<div class="card"><b>${esc(b.nom)}</b><small>${b.nb_cartes} cartes</small><button data-id="${b.id}">Acheter · 💰 ${b.prix}</button></div>`).join('')}</div>`;
  main.querySelectorAll('button[data-id]').forEach(b=>b.onclick=async()=>{
    const {error}=await sb.rpc('acheter_booster',{p_type_id:+b.dataset.id});
    if(error)alert(error.message.includes('MONNAIE')?'Pas assez de monnaie.':error.message);
    await refreshJoueur();vBoutique();});
}

/* ---------- Deck ---------- */
async function vDeck(){
  const [c,dk]=await Promise.all([q(sb.from('collection_joueur').select('variantes_carte(cartes(id,nom,type))').eq('joueur_id',user.id)),
    q(sb.from('deck').select('carte_id').eq('joueur_id',user.id))]);
  const map=new Map();c.forEach(x=>{const k=x.variantes_carte.cartes;map.set(k.id,k)});
  const sel=new Set(dk.map(x=>x.carte_id)),L=[...map.values()];
  const NOM={combattant:'Combattants',magie:'Magies',piege:'Pièges'};
  main.innerHTML=`<p>Deck : 9 ou 10 cartes différentes, dont au moins 3 combattants, 3 magies et 3 pièges.</p><p id="cnt"></p>`+
   Object.keys(NOM).map(t=>`<h3>${NOM[t]}</h3><div class="row">${L.filter(x=>x.type==t).map(x=>`<label><input type="checkbox" value="${x.id}" data-t="${t}" ${sel.has(x.id)?'checked':''}> ${esc(x.nom)}</label>`).join('')||'<small>Aucune</small>'}</div>`).join('')+
   '<button id="sv">Enregistrer le deck</button>';
  const boxes=[...main.querySelectorAll('input[type=checkbox]')];
  const upd=()=>{const on=boxes.filter(b=>b.checked),n=t=>on.filter(b=>b.dataset.t==t).length;
    $('#cnt').innerHTML=`<b>${on.length}/10</b> — combattants ${n('combattant')}/3 · magies ${n('magie')}/3 · pièges ${n('piege')}/3`};
  boxes.forEach(b=>b.onchange=upd);upd();
  $('#sv').onclick=async()=>{
    const ids=boxes.filter(b=>b.checked).map(b=>+b.value);
    const {error}=await sb.rpc('enregistrer_deck',{p_cartes:ids});
    alert(error?({DECK_TAILLE_INVALIDE:'Il faut 9 ou 10 cartes.',DECK_COMPOSITION_INVALIDE:'Il faut au moins 3 cartes de chaque type.'}[error.message]||error.message):'Deck enregistré !');};
}

/* ---------- Admin ---------- */
async function vAdmin(){
  const S={cartes:'Cartes',collections:'Collections',raretes:'Raretés',cadeaux:'Cadeaux'};
  main.innerHTML=`<div class="row">${Object.entries(S).map(([k,v])=>`<button class="${k==sub?'on':'sec'}" data-s="${k}">${v}</button>`).join('')}</div><div id="sub"></div>`;
  main.querySelectorAll('button[data-s]').forEach(b=>b.onclick=()=>{sub=b.dataset.s;vAdmin()});
  ({cartes:aCartes,collections:aCollections,raretes:aRaretes,cadeaux:aCadeaux})[sub]();
}
async function upload(file){
  const path=crypto.randomUUID()+'.'+(file.name.split('.').pop()||'png');
  await q(sb.storage.from('cartes').upload(path,file,{contentType:file.type}));return path;
}

/* ---------- Catalogue d'effets (pour ajouter un effet : une ligne ici) ---------- */
// Paramètres réutilisables : [libellé, 'n' (nombre) ou liste de choix]
const P={val:['Valeur','n'],u:['Unité',['pts','pct']],tours:['Nb de tours','n'],chance:['Chance (%)','n'],frappes:['Nb de frappes','n'],
 coups:['Nb de coups','n'],cible:['Cible',['soi','adversaire']],carte:['Carte',['magie','piege']],seuil:['Seuil','n'],seuilpv:['Seuil (% PV)','n'],
 cond:['Condition',['pv_max','degats_infliges']],pct:['% PV rendus en plus','n']};
// Chaque effet : [libellé, ...paramètres]
const PAS={evite_mort:['Évite la mort une fois'],soin_tour:['Se soigne de X chaque tour','val','u'],renvoi:['Renvoie X dégâts reçus','val','u'],
 atq_tours:["Augmente l'ATQ tous les X tours",'tours','val','u'],pv_tours:['Augmente les PV tous les X tours','tours','val','u'],
 multi_frappe:['À X % de chances, frappe X fois par tour','chance','frappes'],reduc_degats:['À X % de chances, réduit les dégâts reçus de X','chance','val','u'],
 bonus_frappe:["Si frappé X fois par tour, bonus à la prochaine attaque",'coups','val','u']};
const ULT={degats:["Dégâts directs à l'adversaire",'val'],voler:['Vole une magie/un piège','carte'],detruire:['Détruit une magie/un piège','carte'],
 equiper:['Équipe une autre magie/piège du deck','carte'],soin:['Se soigne','val','u'],vol_vie:['Vole de la vie','val'],echange_atq:["Échange l'attaque avec l'adversaire"],
 annule_attaque:['Annule la prochaine attaque'],double_degats:['Double ses dégâts pendant X tours','tours'],echange_atq_def:["Échange l'ATQ et la défense de l'adversaire"]};
const MAG={atq_mod:["Modifie l'ATQ (négatif = baisse)",'cible','val','u'],pv_mod:['Modifie les PV max (négatif = baisse)','cible','val','u'],
 soin:['Soigne son combattant','val','u'],degats:["Dégâts directs à l'adversaire",'val'],annule_attaque:["Annule la prochaine attaque de l'adversaire"],
 renvoi:['Renvoie une part des dégâts pendant X tours','val','tours'],insensible_piege:['Insensible aux pièges pendant X tours','tours'],
 annule_magies:['Annule les autres magies pendant X tours','tours'],mort_evitee:['Évite la mort si condition (reste à 1 PV, une fois)','cond','seuil','pct'],
 degats_tours:['Inflige X dégâts après X tours','val','tours']};
const CON={adv_attaque:["L'adversaire a attaqué X fois",'coups'],adv_ultime:["L'adversaire utilise son ultime"],proprio_pv_sous:['Le propriétaire passe sous X % de PV','seuilpv'],
 adv_pv_bas:["L'adversaire passe sous X % de PV",'seuilpv'],adv_soigne:["L'adversaire se soigne"],proprio_soigne:['Le propriétaire se soigne'],proprio_meurt:['Le propriétaire meurt']};
function mk(el,cat){
  el.innerHTML=`<select><option value="">— Aucun —</option>${Object.entries(cat).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select><div class="row"></div>`;
  const s=el.querySelector('select'),d=el.querySelector('.row');
  s.onchange=()=>{d.innerHTML=s.value?cat[s.value].slice(1).map(k=>{const [l,t]=P[k];
    return `<label><small>${l}</small><br>${t=='n'?`<input data-k="${k}" type="number" step="any" style="width:110px">`:`<select data-k="${k}">${t.map(o=>`<option>${o}</option>`).join('')}</select>`}</label>`}).join(''):''};
  return {get(){if(!s.value)return null;const o={type:s.value};
    d.querySelectorAll('[data-k]').forEach(i=>o[i.dataset.k]=i.tagName=='INPUT'?(i.value===''?null:+i.value):i.value);return o}};
}

async function aCartes(){
  const [col,rar,cartes]=await Promise.all([q(sb.from('collections').select('*')),q(sb.from('raretes').select('*').order('ordre')),
    q(sb.from('cartes').select('id,nom,type,actif,raretes(nom),collections(nom),variantes_carte(id)').order('id',{ascending:false}))]);
  $('#sub').innerHTML=`<h3>Nouvelle carte</h3>
  <form class="f" id="fc"><input name="nom" placeholder="Nom" required>
   <select name="type"><option value="combattant">Combattant</option><option value="magie">Magie</option><option value="piege">Piège</option></select>
   <select name="col"><option value="">Commune (aucune collection)</option>${opts(col)}</select>
   <select name="rar">${opts(rar)}</select>
   <div class="row" id="r-stats"><input name="atq" type="number" placeholder="ATQ" style="width:90px"><input name="pv" type="number" placeholder="PV" style="width:90px"></div>
   <input name="desc" placeholder="Description (optionnel)">
   <label>Image complète de la carte<br><input name="file" type="file" accept="image/*" required></label>
   <div id="s-comb"><b>Ultime</b><div id="b-ult"></div>
    <div class="row"><label><small>Après N tours</small><br><input name="utours" type="number" min="0" style="width:90px"></label>
    <label><input type="checkbox" name="ucarte"> ou quand une magie/piège s'active</label></div>
    <b>Passif</b><div id="b-pas"></div></div>
   <div id="s-mag" style="display:none"><b>Effet de la magie</b><div id="b-mag"></div></div>
   <div id="s-pie" style="display:none"><b>Condition du piège</b><div id="b-con"></div><b>Effet du piège</b><div id="b-pef"></div>
    <label><small>Déclenchements max</small><br><input name="decl" type="number" min="1" value="1" style="width:90px"></label></div>
   <label><input type="checkbox" name="actif"> Publier (visible des joueurs et dans les boosters)</label>
   <button>Créer la carte</button></form>
  <h3>Ajouter une version alternative</h3>
  <form class="f" id="fv"><select name="carte">${opts(cartes)}</select><input name="nom" placeholder="Nom (ex : Alt 1)" required>
   <input name="poids" type="number" value="10" title="Taux d'apparition (Standard = 100)"><input name="file" type="file" accept="image/*" required><button>Ajouter la version</button></form>
  <h3>Cartes (${cartes.length})</h3><table><tr><th>Nom</th><th>Type</th><th>Rareté</th><th>Collection</th><th>Versions</th><th>Publiée</th><th></th></tr>
  ${cartes.map(c=>`<tr><td>${esc(c.nom)}</td><td>${c.type}</td><td>${esc(c.raretes.nom)}</td><td>${esc(c.collections?.nom||'Commune')}</td><td>${c.variantes_carte.length}</td>
  <td><button class="sec" data-a="${c.id}" data-v="${c.actif}">${c.actif?'<span class="ok">Oui</span>':'<span class="ko">Non</span>'}</button></td>
  <td><button class="sec" data-del="${c.id}" data-nom="${esc(c.nom)}" title="Supprimer cette carte">🗑️</button></td></tr>`).join('')}</table>`;
  const fc=$('#fc');
  B={ult:mk($('#b-ult'),ULT),pas:mk($('#b-pas'),PAS),mag:mk($('#b-mag'),MAG),con:mk($('#b-con'),CON),pef:mk($('#b-pef'),{...ULT,...MAG})};
  const toggle=()=>{const t=fc.type.value;
    $('#r-stats').style.display=$('#s-comb').style.display=t=='combattant'?'':'none';
    $('#s-mag').style.display=t=='magie'?'':'none';$('#s-pie').style.display=t=='piege'?'':'none'};
  fc.type.onchange=toggle;toggle();
  fc.onsubmit=async e=>{e.preventDefault();const f=e.target,v=n=>f[n].value,t=v('type');
    try{let ult=null,pas=null,eff=null;
     if(t=='combattant'){ult=B.ult.get();if(ult){if(+f.utours.value)ult.apres_tours=+f.utours.value;if(f.ucarte.checked)ult.sur_carte=true}pas=B.pas.get()}
     else if(t=='magie')eff=B.mag.get();
     else{const c=B.con.get(),x=B.pef.get();if(c||x)eff={condition:c,effet:x,declenchements:+f.decl.value||1}}
     const cb=t=='combattant';
     const row={nom:v('nom'),type:t,collection_id:v('col')||null,rarete_id:+v('rar'),atq:cb&&v('atq')!==''?+v('atq'):null,pv:cb&&v('pv')!==''?+v('pv'):null,
      description:v('desc')||null,actif:f.actif.checked,ultime:ult,passif:pas,effet:eff};
     const c=await q(sb.from('cartes').insert(row).select('id').single());
     const path=await upload(f.file.files[0]);
     await q(sb.from('variantes_carte').insert({carte_id:c.id,nom:'Standard',image_path:path,poids:100}));
     aCartes();}catch(x){}};
  $('#fv').onsubmit=async e=>{e.preventDefault();const f=e.target;
    try{const path=await upload(f.file.files[0]);
     await q(sb.from('variantes_carte').insert({carte_id:+f.carte.value,nom:f.nom.value,image_path:path,poids:+f.poids.value}));aCartes();}catch(x){}};
  $('#sub').querySelectorAll('button[data-a]').forEach(b=>b.onclick=async()=>{
    await q(sb.from('cartes').update({actif:b.dataset.v!=='true'}).eq('id',b.dataset.a));aCartes();});
  $('#sub').querySelectorAll('button[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Supprimer définitivement « '+b.dataset.nom+' » ?\nElle disparaîtra aussi des collections et des decks des joueurs.'))return;
    const chemins=await q(sb.rpc('supprimer_carte',{p_carte_id:+b.dataset.del}));
    if(chemins&&chemins.length){try{await sb.storage.from('cartes').remove(chemins)}catch(x){}}
    aCartes();});
}

async function aCollections(){
  const c=await q(sb.from('collections').select('*').order('id'));
  $('#sub').innerHTML=`<table><tr><th>Nom</th><th></th></tr>
  ${c.map(x=>`<tr data-id="${x.id}"><td><input value="${esc(x.nom)}"></td><td><button>Enregistrer</button> <button class="sec">🗑️</button></td></tr>`).join('')}
  <tr data-id="new"><td><input placeholder="Nouvelle collection"></td><td><button>Ajouter</button></td></tr></table>`;
  $('#sub').querySelectorAll('tr[data-id]').forEach(tr=>{const b=tr.querySelectorAll('button');
    b[0].onclick=async()=>{const nom=tr.querySelector('input').value.trim();if(!nom)return;
      await q(tr.dataset.id=='new'?sb.from('collections').insert({nom}):sb.from('collections').update({nom}).eq('id',tr.dataset.id));aCollections();};
    if(b[1])b[1].onclick=async()=>{if(!confirm('Supprimer cette collection ?'))return;
      await q(sb.from('collections').delete().eq('id',tr.dataset.id));aCollections();};});
}

async function aRaretes(){
  const r=await q(sb.from('raretes').select('*').order('ordre'));
  $('#sub').innerHTML=`<p><small>Poids : plus il est grand, plus la rareté sort souvent (ex : 70 / 25 / 5).</small></p>
  <table><tr><th>Nom</th><th>Couleur</th><th>Poids</th><th>Ordre</th><th></th></tr>
  ${r.map(x=>`<tr data-id="${x.id}"><td><input value="${esc(x.nom)}"></td><td><input type="color" value="${esc(x.couleur)}"></td><td><input type="number" value="${x.poids}" style="width:80px"></td><td><input type="number" value="${x.ordre}" style="width:70px"></td><td><button>Enregistrer</button></td></tr>`).join('')}
  <tr data-id="new"><td><input placeholder="Nouvelle rareté"></td><td><input type="color" value="#a855f7"></td><td><input type="number" value="10" style="width:80px"></td><td><input type="number" value="${r.length+1}" style="width:70px"></td><td><button>Ajouter</button></td></tr></table>`;
  $('#sub').querySelectorAll('tr[data-id]').forEach(tr=>tr.querySelector('button').onclick=async()=>{
    const i=tr.querySelectorAll('input'),row={nom:i[0].value,couleur:i[1].value,poids:+i[2].value,ordre:+i[3].value};
    if(!row.nom)return;
    await q(tr.dataset.id=='new'?sb.from('raretes').insert(row):sb.from('raretes').update(row).eq('id',tr.dataset.id));aRaretes();});
}

async function aCadeaux(){
  const [t,j]=await Promise.all([q(sb.from('types_boosters').select('id,nom')),q(sb.from('joueurs').select('id,pseudo').order('pseudo'))]);
  $('#sub').innerHTML=`<form class="f" id="fg"><select name="j"><option value="">🎁 Tous les joueurs</option>${opts(j,'pseudo')}</select>
   <select name="t">${opts(t)}</select><input name="n" type="number" min="1" value="1"><button>Offrir</button></form>`;
  $('#fg').onsubmit=async e=>{e.preventDefault();const f=e.target;
    const {error}=await sb.rpc('offrir_boosters',{p_joueur:f.j.value||null,p_type_id:+f.t.value,p_quantite:+f.n.value});
    alert(error?error.message:'Boosters offerts !');};
}

sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_IN'&&!user)init()});
init();
</script></body></html>
