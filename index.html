<!DOCTYPE html>

<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#14141a;color:#eee}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#1d1d27}

.ok{color:#4ade80}.ko{color:#f87171}

.stat{background:#1d1d27;border:1px solid #2c2c38;border-radius:10px;padding:12px}
.stat b{display:block;font-size:26px;margin:2px 0}.stat span{color:#aaa;font-size:13px;display:block}

.vc.sel img,.vc.sel .ph{outline:3px solid #a78bfa;outline-offset:2px}.vc .ck{position:absolute;top:4px;right:4px;background:#7c3aed;border-radius:50%;width:22px;height:22px;line-height:22px;font-size:13px}.vc span{display:block;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.vrow button{padding:4px 10px}.vrow button.nerf.on{background:#b91c1c;border-color:#b91c1c}.vrow button.up.on{background:#15803d;border-color:#15803d}.vrow button.rework.on{background:#b45309;border-color:#b45309}
.vres{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:#ccc}.vres b{color:#fff}
.av10{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}.av10 .rk{font-size:26px;font-weight:800;color:#a78bfa;min-width:34px}.av10 img{width:70px;border-radius:6px}.av10 .bd{flex:1;min-width:240px}
.avt{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}.avt td{padding:3px 6px;border-top:1px solid #2c2c38}.avt td.n{text-align:center;width:78px;white-space:nowrap}.avt td.top{font-weight:800;border-radius:4px}.avt td.top.nerf{background:#7f1d1d}.avt td.top.up{background:#14532d}.avt td.top.rework{background:#78350f}
.pf{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}.pf .apv{width:200px;aspect-ratio:5/7;border-radius:10px;background:#262633 center/cover;border:2px dashed #444;display:flex;align-items:center;justify-content:center;color:#888;font-size:13px;text-align:center;padding:10px;box-sizing:border-box}
.pf .apv.ok{border:2px solid var(--g,#7c3aed);box-shadow:0 0 14px var(--g,#7c3aed);color:transparent}.pf form{flex:1;min-width:260px;display:flex;flex-direction:column;gap:10px}.pf label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#ccc}.pf textarea{min-height:80px}
.ced{width:240px;display:flex;flex-direction:column;gap:6px;align-items:center}.ced canvas{width:240px;aspect-ratio:1488/2070;border-radius:10px;background:#262633;touch-action:none;cursor:grab;box-shadow:0 0 14px var(--g,#000)}.ced canvas:active{cursor:grabbing}.ced input[type=range]{width:100%}.ced small{color:#aaa;text-align:center}
.ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.ppc{background:#1d1d27;border:1px solid #2c2c38;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.ppc img{width:100%;aspect-ratio:5/7;object-fit:cover;border-radius:8px;cursor:zoom-in}.ppc .st{font-size:12px;padding:2px 8px;border-radius:10px;align-self:flex-start}.st.attente{background:#3f3f46}.st.acceptee{background:#14532d}.st.refusee{background:#7f1d1d}
.ppc .idc{color:#fbbf24}.ppc small{color:#aaa}.ppc .row{gap:6px;flex-wrap:wrap}
.bcol{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0}.bcol span{font-size:11px;padding:2px 7px;border-radius:9px;background:#2a2a38;border:1px solid #3a3a4a}
/* mini-jeu des champignons */
.chp{background:radial-gradient(120% 140% at 0% 0%,#1f3a26 0%,#1a1f1c 45%,#17171f 100%);border:1px solid #2f4a36;border-radius:14px;padding:12px 14px;margin:8px 0 18px;display:flex;flex-direction:column;gap:12px}
.chh b{display:block;font-size:16px}.chh small{color:#a7b8ab}
.chs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:460px}
.chm{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:104px;border-radius:12px;border:1px solid #3a5a42;background:#132018;color:#eee;padding:8px 4px}
button.chm{cursor:pointer;transition:transform .15s,box-shadow .15s}button.chm:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(74,222,128,.25)}
button.chm .chi{animation:chwob 2.4s ease-in-out infinite;animation-delay:var(--d)}
.chi{font-size:40px;line-height:1;display:block}.chm small{color:#9fb3a5;font-size:11.5px}
.chm.vise{box-shadow:0 0 0 2px #4ade80,0 0 22px #4ade8088}.chm.vise .chi{animation:chshake .25s linear infinite}
button.chm:disabled:not(.vise){opacity:.45}
.chm.ouvert{background:#151a17;border-color:#2c2c38;opacity:.55}.chm.ouvert b{font-size:15px;color:#bbb}
.chm.pris{opacity:1;border-color:#4ade80;background:#14301d;box-shadow:0 0 16px #4ade8055}.chm.pris b{color:#86efac;font-size:19px}
.chm.pris.jack{border-color:#fbbf24;background:#33270c;box-shadow:0 0 22px #fbbf2499}.chm.pris.jack b{color:#fde68a}
.chm.pop{animation:chpop .6s cubic-bezier(.2,.9,.3,1.4)}
.chd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}.chd button{background:#b45309;border-color:#b45309}
.chr{font-size:14px;padding:8px 10px;border-radius:8px}.chr.ok{background:#14532d66;color:#bbf7d0}.chr.ko{background:#7f1d1d55;color:#fecaca}
.chc{display:inline-block;animation:chflip .35s linear infinite}
@keyframes chwob{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(0)}}
@keyframes chshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px) rotate(-6deg)}75%{transform:translateX(3px) rotate(6deg)}}
@keyframes chpop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes chflip{to{transform:rotateY(360deg)}}
@media(prefers-reduced-motion:reduce){.chi,.chc,.chm.pop{animation:none!important}}
/* les 3 jeux du jour */
.jx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px;align-items:stretch}.jx>div{display:flex}.jx .chp{margin:0;flex:1}
.jx .chs{max-width:none}.jx .chm{min-height:92px}.jx .chi{font-size:34px}
.jdu{background:radial-gradient(120% 140% at 0% 0%,#3a1f1f 0%,#1f1a1a 45%,#17171f 100%);border-color:#4a2f2f}
.jpm{background:radial-gradient(120% 140% at 0% 0%,#1f2a3a 0%,#1a1c22 45%,#17171f 100%);border-color:#2f3d4a}
.jvs{display:flex;align-items:center;justify-content:center;gap:10px}.vs{font-weight:900;color:#fbbf24;font-size:18px;text-shadow:0 0 8px #000}
.jc{width:96px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;transition:opacity .3s,transform .3s}
.jc img,.jc .ph{width:96px;aspect-ratio:5/7;object-fit:cover;border-radius:8px;box-shadow:0 0 0 2px var(--g,#444),0 0 10px var(--g,transparent);background:#262633}
.jc.dos .ph{display:flex;align-items:center;justify-content:center;font-size:30px;background:repeating-linear-gradient(45deg,#1d3324 0 8px,#173020 8px 16px);box-shadow:0 0 0 2px #2f4a36}
.jc small{font-size:11px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.jc b{font-size:16px}
.jc.win{transform:scale(1.06)}.jc.win img{box-shadow:0 0 0 3px #4ade80,0 0 18px #4ade80}.jc.win b{color:#86efac}.jc.lose{opacity:.5}
.jc.petit{width:66px;opacity:.6}.jc.petit img{width:66px}.jc.flip{animation:jflip .45s ease-out}
.jsc{text-align:center;font-size:13px;color:#ddd}.jrec{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:#aaa}.jrec .moi{color:#bbf7d0}.jrec .bot{color:#fecaca}
.jpip{display:flex;gap:4px}.jpip span{flex:1;text-align:center;font-size:11.5px;padding:3px 0;border-radius:6px;background:#262633;color:#888;border:1px solid #333}.jpip span.ok{background:#14532d;color:#bbf7d0;border-color:#22c55e}.jpip span.cur{border-color:#fbbf24;color:#fde68a}
.jbt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.jbt [data-pm]{flex:1;min-height:40px;font-weight:700}.jbt small{color:#aaa}
.jdu>button,.jpm>button{align-self:flex-start;min-height:40px}
@keyframes jflip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
@media(max-width:900px){.jx{grid-template-columns:1fr}}
.card>button[data-id]{margin-top:auto}
.bved{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 2px}.bved span{display:flex;flex-direction:column;align-items:center;gap:3px;width:64px;text-align:center}.bved img{width:64px;border-radius:5px}.bved small{font-size:10.5px;line-height:1.2}
.bdet{font-size:12px;margin:4px 0}.bdet summary{cursor:pointer;color:#c4b5fd;font-weight:600}.bdet .bc{margin:6px 0 2px;font-weight:700}.bdet .br{display:flex;flex-wrap:wrap;gap:4px}.bdet .br span{padding:1px 7px;border-radius:9px;border:1px solid var(--g);color:var(--g)}
.prog{background:#1d1d27;border:1px solid #2c2c38;border-radius:10px;padding:10px 14px;margin:8px 0 12px}.prog .top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}.prog .top b{font-size:18px}
.pbar{height:10px;border-radius:6px;background:#2a2a38;overflow:hidden;margin:6px 0}.pbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#7c3aed,#c084fc)}
.prog details summary{cursor:pointer;color:#c4b5fd;font-size:13px;font-weight:600}.pcol{margin:8px 0}.pcol .pbar{height:6px;margin:3px 0}.pcol .pbar i{background:linear-gradient(90deg,#16a34a,#4ade80)}.prr{display:flex;flex-wrap:wrap;gap:4px}.prr span{font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid var(--g);color:var(--g)}
.hb{background:#1d1d27;border:1px solid #2c2c38;border-radius:10px;padding:10px 14px;margin:10px 0}.hb .top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.hbc{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin-top:10px}.hbc figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}.hbc img,.hbc .ph{width:100%;aspect-ratio:5/7;object-fit:cover;border-radius:7px;box-shadow:0 0 0 2px var(--g),0 0 10px var(--g);background:#262633}.hbc figcaption{font-size:11.5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc{background:#1d1d27;border:1px solid #2c2c38;border-left:4px solid #444;border-radius:10px;padding:10px 14px;margin:10px 0}
.hc.victoire{border-left-color:#4ade80}.hc.defaite{border-left-color:#f87171}.hc.nul{border-left-color:#9ca3af}
.hc .top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.hc .cartes{color:#aaa;font-size:13px;margin:6px 0}
.dr{margin-top:10px;border-top:1px dashed #2c2c38;padding-top:8px;font-size:14px;line-height:1.55}
.dr h4{margin:10px 0 2px;color:#c4b5fd}.dr div.degats{color:#f87171}.dr div.soin{color:#4ade80}.dr div.statut,.dr div.stat,.dr div.finstatut{color:#c4b5fd}.dr div.attaque,.dr div.frappe{color:#fbbf24}.dr div.frappe{opacity:.75;padding-left:12px}.dr div.fin{font-weight:700;color:#fff;margin-top:8px}.dr div.finstatut{opacity:.65}
.rg h3{margin:26px 0 4px}.rg p.sub{margin:0 0 12px;color:#aaa}
.pill{display:inline-block;padding:4px 14px;border-radius:999px;font-weight:700;color:#111;margin:0 6px 6px 0}
.rg .stat{font-size:15px;line-height:1.5}.rg .stat h4{margin:0 0 6px;font-size:17px}.rg .stat ul{margin:6px 0 0;padding-left:18px}.rg .stat li{margin:3px 0}
/* ---------- Cartes de la collection : cadre, couleurs de rareté, effets, fenêtre de détails ---------- */
.cgrid{grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:22px 18px}
.ct{--g:#888;--g1:color-mix(in srgb,var(--g) 38%,transparent);--g2:color-mix(in srgb,var(--g) 80%,transparent);--sp:3.4s;position:relative;display:flex;flex-direction:column;gap:9px;padding:9px 9px 11px;border-radius:16px;
 border:1px solid var(--g);border:1px solid color-mix(in srgb,var(--g) 60%,#2c2c38);
 background:linear-gradient(165deg,color-mix(in srgb,var(--g) 16%,#1c1c27) 0%,#15151d 62%);box-shadow:0 0 12px 0 var(--g1),0 8px 22px rgba(0,0,0,.4);
 transition:transform .25s cubic-bezier(.2,.9,.3,1.3),filter .25s;
 animation:ctpop .55s cubic-bezier(.2,.9,.3,1.25) backwards,ctglow var(--sp) ease-in-out .7s infinite;
 animation-delay:calc(min(var(--i,0),14)*40ms),calc(.7s + min(var(--i,0),14)*40ms)}
.ct:hover{transform:translateY(-6px) scale(1.03);filter:brightness(1.08);z-index:2}
.ct[data-t=co]{animation:ctpop .5s cubic-bezier(.2,.9,.3,1.25) backwards;animation-delay:calc(min(var(--i,0),14)*40ms);box-shadow:0 0 8px 0 var(--g1),0 6px 16px rgba(0,0,0,.35)}
.ct[data-t=ra]{--sp:3.6s}.ct[data-t=ep]{--sp:3s}
.ct[data-t=lg]{--sp:2.4s;border:2px solid transparent;padding:8px 8px 10px;
 background:linear-gradient(165deg,color-mix(in srgb,var(--g) 18%,#1c1c27) 0%,#15151d 62%) padding-box,conic-gradient(from var(--ang),var(--g),#fffbe0,var(--g),#ffe58a,var(--g)) border-box;animation:ctpop .6s cubic-bezier(.2,.9,.3,1.25) backwards,ctglow var(--sp) ease-in-out .7s infinite,ctspin 4.5s linear infinite;
 animation-delay:calc(min(var(--i,0),14)*40ms),calc(.7s + min(var(--i,0),14)*40ms),0s}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes ctspin{to{--ang:360deg}}
@keyframes ctpop{0%{opacity:0;transform:translateY(16px) scale(.92)}60%{opacity:1;transform:translateY(-4px) scale(1.03)}100%{opacity:1;transform:none}}
@keyframes ctglow{0%,100%{box-shadow:0 0 10px 0 var(--g1),0 8px 22px rgba(0,0,0,.4)}50%{box-shadow:0 0 24px 3px var(--g2),0 8px 22px rgba(0,0,0,.4)}}
@keyframes ctshine{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes cmfade{from{opacity:0}to{opacity:1}}
@supports not (color:color-mix(in srgb,red,blue)){.ct{--g1:var(--g);--g2:var(--g)}}
.ct.in{outline:2px solid #4ade80;outline-offset:3px}
.ci{position:relative;border-radius:12px;overflow:hidden;cursor:zoom-in;background:#0e0e14}
.ci img{display:block;width:100%;transition:transform .35s}.ct:hover .ci img{transform:scale(1.04)}
.ci::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.4) 50%,transparent 62%);transform:translateX(-130%)}
.ct[data-t=ep] .ci::after,.ct[data-t=lg] .ci::after{opacity:1;animation:ctshine 5s ease-in-out infinite;animation-delay:calc(min(var(--i,0),14)*300ms + 1s)}
.ct[data-t=lg] .ci::after{animation-duration:3.6s}
.cq,.cd{position:absolute;top:6px;z-index:1;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:rgba(0,0,0,.68);border:1px solid rgba(255,255,255,.2);color:#fff}
.cq{right:6px}.cd{left:6px;background:#166534;border-color:#4ade80}
.cb{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.ch{display:flex;align-items:center;justify-content:space-between;gap:6px}
.cn{font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.rp{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--g);color:var(--tx,#111)}

  const recap=M=>{let a=0,b=0;return `<div class="jrec">${M.map((m,i)=>{if(m.gagnant==='moi')a++;if(m.gagnant==='bot')b++;return `<span class="${m.gagnant}">M${i+1} · ${esc(m.moi.nom)} <b>${m.moi.atq}</b> vs <b>${m.bot.atq}</b> ${esc(m.bot.nom)} ${m.gagnant==='moi'?'✅':m.gagnant==='bot'?'❌':'🤝'}</span>`}).join('')}</div>`};

    $('#jdgo').onclick=async()=>{$('#jdgo').disabled=true;
      const d=await sb.rpc('duel_atq_jouer');if(d.error){uiAlert(jErr[d.error.message]||d.error.message);duelAtq(box);return}

        if(m.gagnant==='moi')a++;if(m.gagnant==='bot')b++;
        box.querySelector('.chp').innerHTML=`${tete}<div class="jsc">Manche ${i+1} · Toi <b>${a}</b> – <b>${b}</b> Bot${m.gagnant==='egal'?' · égalité, on rejoue !':''}</div><div class="jvs">${jCarte(m.moi,'⚔ '+m.moi.atq,'flip '+(m.gagnant==='moi'?'win':m.gagnant==='bot'?'lose':''))}<span class="vs">VS</span>${jCarte(m.bot,'⚔ '+m.bot.atq,'flip '+(m.gagnant==='bot'?'win':m.gagnant==='moi'?'lose':''))}</div>`;

const CH_ERR={DEJA_JOUE:'Tu as déjà cueilli ton champignon aujourd\'hui, reviens demain !',DEJA_DOUBLE:'Tu as déjà tenté ta chance aujourd\'hui.',MONNAIE_INSUFFISANTE:'Tu as déjà dépensé ce gain : plus de quitte ou double possible.',PAS_ENCORE_JOUE:'Choisis d\'abord un champignon.'};

     :`<div class="chd"><span>Tu as gagné <b>${E.gain} 💰</b>. Tenter le <b>quitte ou double</b> ? (1 chance sur 2)</span><button id="chdb">🪙 Quitte ou double</button></div>`):''}
  </div>`;

/* ---------- Deck : à gauche le deck (3 combattants · 3 magies · 3 pièges + 1 libre), à droite toutes ses cartes ---------- */
const DK_N=10,DK_T=['combattant','magie','piege'];
const dkCompte=(set=deck)=>{const n={combattant:0,magie:0,piege:0};[...set].forEach(i=>{if(n[typeOf[i]]!=null)n[typeOf[i]]++});return n};
const dkLibre=n=>DK_T.reduce((s,t)=>s+Math.max(0,n[t]-3),0);   // cartes posées sur la case libre
const dkValide=(set=deck)=>{const n=dkCompte(set);return set.size===DK_N&&DK_T.every(t=>n[t]>=3)};
// '' si la carte peut entrer dans le deck, sinon la raison
function dkRefus(id){const t=typeOf[id];if(deck.has(id))return '';if(deck.size>=DK_N)return 'Deck complet : 10 cartes.';
  const n=dkCompte();if(n[t]<3)return '';if(dkLibre(n)<1)return '';
  return `Plus de place pour ${t==='magie'?'une magie':t==='piege'?'un piège':'un combattant'} : le deck se compose de 3 combattants, 3 magies, 3 pièges et 1 carte libre (déjà prise).`}
function dkBascule(id){if(deck.has(id)){deck.delete(id);return true}const r=dkRefus(id);if(r){uiAlert(r);return false}deck.add(id);return true}
let dkCombat=new Set(),dkNom='',dkSrc='',dkF={t:'tout',r:'tout',c:'tout',q:'',tri:'rarete'};
const dkCle=s=>[...s].sort((a,b)=>a-b).join(',');
const dkSale=()=>dkCle(deck)!==dkSrc;

  apercu=false;await loadColl();await loadDecks();await chargerPrix();
  const dk=await sb.from('deck').select('carte_id').eq('joueur_id',user.id);dkCombat=new Set(((dk&&dk.data)||[]).map(x=>x.carte_id));
  if(!selDeck&&!dkNom){const k=dkCle(dkCombat),d=savedDecks.find(x=>dkCle(new Set(x.cartes||[]))===k&&k);
    if(d){selDeck=String(d.id);deck=new Set(d.cartes)}else{deck=new Set(dkCombat);dkNom=dkCombat.size?'Deck de combat':''}}
  dkSrc=dkCle(deck);
  main.innerHTML=`<div class="dk"><aside class="dkl" id="dkl"></aside><section class="dkr"><div class="dkf" id="dkf"></div><div class="dcg" id="dcg"></div></section></div><div class="dkm" id="dkm"></div>`;
  drawDeck();
}
function dkCartes(){   // une tuile par carte (même si plusieurs versions), quantités additionnées
  const M=new Map();collData.forEach(x=>{const c=x.variantes_carte.cartes,o=M.get(c.id);if(o)o.quantite+=x.quantite||0;else M.set(c.id,{...x,quantite:x.quantite||0})});return [...M.values()]}
function drawDeck(){
  curView=drawDeck;if(!$('#dkl'))return;
  const tous=dkCartes(),parId=new Map(tous.map(x=>[x.variantes_carte.cartes.id,x])),n=dkCompte(),ok=dkValide(),enCombat=deck.size&&dkCle(deck)===dkCle(dkCombat);
  // ---- colonne de gauche : le deck ----
  const pos={combattant:[],magie:[],piege:[]},libre=[];   // une carte en trop (ancien deck) reste visible pour pouvoir la retirer

   <div class="dks">${DK_T.map((t,r)=>[0,1,2].map(i=>slot(pos[t][i],t)).join('')+(r===1?slot(libre[0],null,true):'<div></div>')).join('')}</div>

   </div>${decksOK?'':'<small>Decks multiples indisponibles pour le moment (l\'admin doit lancer 09-decks-multiples.sql dans Supabase).</small>'}`;
  // ---- barre fixe en bas (téléphone) ----
  $('#dkm').innerHTML=`<span><b class="${ok?'ok':''}">${deck.size}/10</b> · ⚔️${n.combattant} ✨${n.magie} 🪤${n.piege}</span><button id="dplay2" ${ok&&!enCombat?'':'disabled'}>${enCombat?'✓ En combat':'⚔️ Utiliser'}</button>`;
  // ---- colonne de droite : filtres + cartes ----
  const rars=[...new Map(tous.map(x=>{const r=x.variantes_carte.cartes.raretes;return [r.nom,r]})).values()].sort((a,b)=>rangRar(a)[0]-rangRar(b)[0]||rangRar(a)[1]-rangRar(b)[1]);

  const ren=$('#dren');if(ren)ren.onclick=async()=>{const d=savedDecks.find(x=>String(x.id)===String(selDeck));if(!d)return;
    const nom=((await uiPrompt('Nouveau nom du deck :',d.nom))||'').trim();if(!nom||nom===d.nom)return;
    const r=await sb.rpc('sauver_deck',{p_nom:nom,p_cartes:d.cartes||[]});if(r.error){uiAlert(r.error.message);return}
    await sb.rpc('supprimer_deck',{p_id:+d.id});await loadDecks();selDeck=String(r.data);redessine()};
  const del=$('#ddl');if(del)del.onclick=async()=>{const d=savedDecks.find(x=>String(x.id)===String(selDeck));if(!d||!(await uiConfirm('Supprimer le deck « '+d.nom+' » ?')))return;
    const {error}=await sb.rpc('supprimer_deck',{p_id:+selDeck});if(error){uiAlert(error.message);return}
    selDeck='';dkNom='Nouveau deck';await loadDecks();dkSrc='';redessine()};
}
// Enregistre le deck en cours sous son nom (demande un nom s'il n'en a pas). true si c'est fait.
async function dkSauver(){
  if(!dkValide()){uiAlert('Il faut exactement 10 cartes : 3 combattants, 3 magies, 3 pièges et 1 carte libre.');return false}
  const cur=savedDecks.find(x=>String(x.id)===String(selDeck));let nom=cur?cur.nom:dkNom;
  if(!nom||nom==='Nouveau deck'||nom==='Deck de combat'&&!cur){nom=((await uiPrompt('Nom du deck :',nom&&nom!=='Nouveau deck'?nom:''))||'').trim();if(!nom)return false}
  const {data,error}=await sb.rpc('sauver_deck',{p_nom:nom.slice(0,30),p_cartes:[...deck]});
  if(error){uiAlert(({TROP_DE_DECKS:'Tu as déjà 10 decks enregistrés : supprime-en un d\'abord.',NOM_INVALIDE:'Le nom doit faire entre 1 et 30 caractères.',DECK_TROP_GRAND:'Un deck contient 10 cartes au maximum.'}[error.message])||error.message);return false}
  await loadDecks();selDeck=String(data);dkNom='';dkSrc=dkCle(deck);return true}

  <h3>Combats</h3><div class="stats">
   ${st('Victoires',n('victoires'))}${st('Défaites',n('defaites'))}${st('Nuls',n('nuls'))}
   ${st('% de victoires',pct,tot+' combat'+(tot>1?'s':''))}
   ${st('Meilleure série de victoires',n('meilleure_serie'))}${st('Série en cours',n('serie_actuelle'))}</div>
  <h3>Records</h3><div class="stats">
   ${st('Plus gros coup infligé',n('plus_gros_coup'),'dégâts en une attaque')}
   ${st('Victoire la plus rapide',S.victoire_rapide_tours?S.victoire_rapide_tours+' tours':'—')}

   ${st('Dégâts totaux infligés',n('degats_totaux'))}</div>
  <h3>Cartes</h3><div class="stats">${cardTile('Carte la plus jouée',D.plus_jouee,'combats')}${cardTile('Carte la plus victorieuse',D.plus_gagnante,'victoires')}</div>

// Tri du classement choisi par le joueur (gardé dans le navigateur)
const TRIS_CL={victoires:'Victoires',pct:'% de victoires',combats:'Combats joués',defaites:'Défaites',nuls:'Nuls',meilleure_serie:'Meilleure série',plus_gros_coup:'Plus gros coup'};
let triCl=(()=>{try{return localStorage.getItem('fc_tri_classement')||'victoires'}catch(e){return 'victoires'}})();
async function vClassement(){
  const rl=await sb.rpc('liste_profils');
  if(rl.error){main.innerHTML='<p class="ko">Classement indisponible pour le moment.</p>';return}
  const T0=rl.data||[],med=['🥇','🥈','🥉'];
  const nb=(x,k)=>+x[k]||0,tot=x=>nb(x,'victoires')+nb(x,'defaites')+nb(x,'nuls'),ratio=x=>tot(x)?nb(x,'victoires')/tot(x):-1;
  const pc=x=>tot(x)?Math.round(100*nb(x,'victoires')/tot(x))+' %':'—';
  const dispo=Object.keys(TRIS_CL).filter(k=>['victoires','pct','combats','defaites','nuls'].includes(k)||T0.some(x=>x[k]!=null));   // séries / records : seulement si le serveur les donne
  if(!dispo.includes(triCl))triCl='victoires';
  const val={victoires:x=>nb(x,'victoires'),pct:ratio,combats:tot,defaites:x=>nb(x,'defaites'),nuls:x=>nb(x,'nuls'),meilleure_serie:x=>nb(x,'meilleure_serie'),plus_gros_coup:x=>nb(x,'plus_gros_coup')}[triCl];
  // à égalité : plus de victoires, puis plus de combats joués, puis le pseudo
  const L=T0.slice().sort((a,b)=>(val(b)-val(a))||(nb(b,'victoires')-nb(a,'victoires'))||(tot(b)-tot(a))||String(a.pseudo).localeCompare(String(b.pseudo),'fr')).slice(0,100);
  const moi=L.findIndex(x=>x.joueur_id==user.id);
  const extra=['meilleure_serie','plus_gros_coup'].includes(triCl)?triCl:null;
  const th=(k,l)=>`<th${k===triCl?' style="color:#fbbf24"':''}>${l}${k===triCl?' ▼':''}</th>`;
  main.innerHTML=`<h3>🏆 Classement</h3>
   <div class="row"><label><small>Classer par</small><br><select id="cltri">${dispo.map(k=>`<option value="${k}"${k===triCl?' selected':''}>${TRIS_CL[k]}</option>`).join('')}</select></label></div>
   <p><small>Clique sur un pseudo pour voir son profil.${moi>=0?` Tu es <b>${moi+1}${moi?'e':'er'}</b>.`:''}</small></p>
   ${L.length?`<table><tr><th>#</th><th>Joueur</th>${th('victoires','Victoires')}${th('defaites','Défaites')}${th('nuls','Nuls')}${th('pct','% victoires')}${th('combats','Combats')}${extra?th(extra,TRIS_CL[extra]):''}</tr>${L.map((x,i)=>`<tr${x.joueur_id==user.id?' style="background:#2a2140"':''}><td>${med[i]||i+1}</td><td><button class="${x.joueur_id==user.id?'on':'sec'}" data-p="${x.joueur_id}">${esc(x.pseudo)}${x.joueur_id==user.id?' (moi)':''}</button></td><td>${nb(x,'victoires')}</td><td>${nb(x,'defaites')}</td><td>${nb(x,'nuls')}</td><td>${pc(x)}</td><td>${tot(x)}</td>${extra?`<td>${nb(x,extra)}</td>`:''}</tr>`).join('')}</table>`:'<p><small>Aucun combat joué pour l\'instant.</small></p>'}`;
  const ts=$('#cltri');if(ts)ts.onchange=()=>{triCl=ts.value;try{localStorage.setItem('fc_tri_classement',triCl)}catch(e){}vClassement()};
  main.querySelectorAll('button[data-p]').forEach(b=>b.onclick=()=>{tab='profil';const T={...TABS};if(isAdmin)T.admin='⚙️ Admin';$('#nav').innerHTML=Object.entries(T).map(([k,v])=>`<button class="${k=='profil'?'on':'sec'}" data-t="${k}">${v}</button>`).join('');$('#nav').querySelectorAll('button').forEach(n=>n.onclick=()=>show(n.dataset.t));vProfil(b.dataset.p);window.scrollTo(0,0)});
}

// Équilibrage : enregistre automatiquement ce qui change sur une carte (appelé par l'admin). Ne bloque jamais l'enregistrement de la carte.
const txtEq={
  passif:c=>{const P=c.passif?(c.passif.briques?c.passif.briques.filter(b=>b&&b.type):(c.passif.type?[c.passif]:[])):[];return P.map(fxPassif).join(' · ')},
  ultime:c=>{const u=c.ultime;if(!u||!(u.type||u.briques))return'';return fxEffet(u).join(' · ')+' ('+fxTrigUlt(u)+')'},
  effet:c=>{if(c.type=='magie')return c.effet?fxEffet(c.effet).join(' · '):'';const e=c.effet;if(!e)return'';return(fxCond(e.condition)||'Piège caché')+' : '+fxEffet(e.effet).join(' · ')+(nz(e.declenchements)>1?` (jusqu'à ${e.declenchements} fois)`:'')}};
async function noteEquilibrage(avant,apres){
  try{
    let rn={};const rr=await sb.from('raretes').select('id,nom');(rr.data||[]).forEach(x=>rn[x.id]=x.nom);
    const ch=[],num=(k,lab)=>{const a=avant?avant[k]:null,b=apres[k];if(a!==b&&!(a==null&&b==null))ch.push({champ:lab,avant:a==null?null:String(a),apres:b==null?'':String(b),sens:a==null||b==null?0:Math.sign(b-a)})};
    if(!avant){ch.push({champ:'Nouvelle carte',avant:null,apres:[rn[apres.rarete_id],apres.type=='combattant'?`ATQ ${apres.atq??'?'} · PV ${apres.pv??'?'}`:apres.type].filter(Boolean).join(' · ')})}
    else{
      if(avant.nom!==apres.nom)ch.push({champ:'Nom',avant:avant.nom,apres:apres.nom,sens:0});
      if(avant.rarete_id!==apres.rarete_id)ch.push({champ:'Rareté',avant:rn[avant.rarete_id]||'?',apres:rn[apres.rarete_id]||'?',sens:0});
      if(apres.type=='combattant'||avant.type=='combattant'){num('atq','ATQ');num('pv','PV')}
      ['passif','ultime','effet'].forEach(k=>{if(JSON.stringify(avant[k]??null)!==JSON.stringify(apres[k]??null)){const t=apres.type||avant.type,c0={...avant,type:t},c1={...apres,type:t};
        ch.push({champ:{passif:'Passif',ultime:'Ultime',effet:t=='piege'?'Piège':'Effet'}[k],avant:txtEq[k](c0)||null,apres:txtEq[k](c1),sens:0});if(ch[ch.length-1].avant==null)ch[ch.length-1].avant=''}});
      if(!!avant.actif!==!!apres.actif)ch.push({champ:'Disponible',avant:avant.actif?'Oui':'Non',apres:apres.actif?'Oui':'Non',sens:0});
    }
    if(!ch.length)return;
    await sb.from('equilibrage').insert({carte_id:apres.id??avant?.id??null,carte_nom:apres.nom||avant?.nom||'?',carte_type:apres.type||avant?.type||null,changements:ch});
  }catch(x){}
}

  // Écriteaux (combattants) : position du bandeau sur la carte de 2070 px de haut, et couleur du texte lisible dessus
  const ECR={ggez:{y0:1294,y1:1789,tx:'#ffffff',ct:'#6b21a8'},legendaire:{y0:1350,y1:1847,tx:'#ffffff',ct:'#7a4504'},epique:{y0:1200,y1:1708,tx:'#ffffff',ct:'#3b0764'},rare:{y0:1094,y1:1650,tx:'#ffffff',ct:'#1e3a8a'}};   // police : sans serif en gras, remplissage + contour
  function texte(x,t,cx,cy,maxW,taille,col,contour,font){let s=taille;x.font=`900 ${s}px ${font}`;while(x.measureText(t).width>maxW&&s>20){s-=4;x.font=`900 ${s}px ${font}`}

    if(comb){const a=f.atq.value.trim(),p=f.pv.value.trim(),SF=FT;
      if(a!=='')texte(x,a,W*.13,H*.925,W*.2,140*k,'#ff3b3b','#ffffff',SF);
      if(p!=='')texte(x,p,W*.87,H*.925,W*.2,140*k,'#3ba4ff','#ffffff',SF)}}
  function dessine(){rendre(cv,cv.width,cv.height)}
  chargeCadre();
  f.file.onchange=()=>{const fi=f.file.files[0];if(!fi)return;if(fi.size>8*1024*1024){uiAlert('Image trop lourde (8 Mo maximum).');f.file.value='';return}

  {let d=null;cv.onpointerdown=e=>{if(!ED.art)return;d={x:e.clientX,y:e.clientY,ox:ED.x,oy:ED.y};cv.setPointerCapture(e.pointerId)};
   cv.onpointermove=e=>{if(!d)return;const r=cv.getBoundingClientRect();ED.x=d.ox+(e.clientX-d.x)/r.width;ED.y=d.oy+(e.clientY-d.y)/r.height;dessine()};
   cv.onpointerup=cv.onpointercancel=()=>{d=null};
   cv.onwheel=e=>{if(!ED.art)return;e.preventDefault();zm.value=Math.max(100,Math.min(400,+zm.value-Math.sign(e.deltaY)*10));zm.oninput()}}
  f.rar.onchange=chargeCadre;f.type.onchange=chargeCadre;f.nom.oninput=f.atq.oninput=f.pv.oninput=dessine;f.col.onchange=()=>{$('#pcolid').style.display=f.col.value=='autre'?'':'none'};if(!R.col.length){f.col.value='autre';f.col.onchange()}

// Images allégées : converties en WebP (transparence conservée) et réduites à 1200 px de haut maximum ; gardées 1 an en cache.
// Objectif : réduire le volume téléchargé depuis Supabase (quota « egress » du plan gratuit).
const CACHE_1AN='31536000';
async function alleger(file,maxH=1200,qual=.86){
  if(!file||!/^image\/(png|jpe?g|webp)$/i.test(file.type||''))return file;   // GIF animé ou autre : laissé tel quel
  try{const bmp=await createImageBitmap(file);const s=Math.min(1,maxH/bmp.height),w=Math.round(bmp.width*s),hh=Math.round(bmp.height*s);
    const c=document.createElement('canvas');c.width=w;c.height=hh;c.getContext('2d').drawImage(bmp,0,0,w,hh);
    const b=await new Promise(ok=>c.toBlob(ok,'image/webp',qual));
    return b&&b.size<file.size?b:file}catch(e){return file}}
async function upload(file){

async function optimiserImages(log){
  const pub=p=>sb.storage.from('cartes').getPublicUrl(p).data.publicUrl;let gain=0,n=0;
  const cibles=[];
  const v=await sb.from('variantes_carte').select('id,image_path,image_combat');(v.data||[]).forEach(r=>{['image_path','image_combat'].forEach(k=>{if(r[k])cibles.push({t:'variantes_carte',id:r.id,k,p:r[k]})})});
  const b=await sb.from('types_boosters').select('id,image_path');(b.data||[]).forEach(r=>{if(r.image_path)cibles.push({t:'types_boosters',id:r.id,k:'image_path',p:r.image_path})});
  const d=await sb.from('dos_cartes').select('id,image');(d.data||[]).forEach(r=>{if(r.image)cibles.push({t:'dos_cartes',id:r.id,k:'image',p:r.image})});
  const todo=cibles.filter(c=>!/\.webp$/i.test(c.p));
  log(`${cibles.length} image(s) trouvée(s), ${todo.length} à optimiser.`);
  for(const c of todo){
    try{const res=await fetch(pub(c.p));if(!res.ok)throw new Error('lecture impossible');const blob=await res.blob();
      const f=await alleger(new File([blob],c.p,{type:blob.type}));
      if(f.type!=='image/webp'||f.size>=blob.size){log(`= ${c.p} déjà léger, inchangé`);continue}
      const np=crypto.randomUUID()+'.webp';
      const u=await sb.storage.from('cartes').upload(np,f,{contentType:'image/webp',cacheControl:CACHE_1AN});if(u.error)throw u.error;
      const m=await sb.from(c.t).update({[c.k]:np}).eq('id',c.id);if(m.error){await sb.storage.from('cartes').remove([np]);throw m.error}
      try{localStorage.setItem('optim|'+c.t+'|'+c.id+'|'+c.k,c.p)}catch(e){}   // l'original est GARDÉ dans Supabase (on peut revenir en arrière)
      gain+=blob.size-f.size;n++;log(`✓ ${Math.round(blob.size/1024)} Ko → ${Math.round(f.size/1024)} Ko`)}
    catch(e){log(`✗ ${c.p} : ${e.message||e}`)}}
  log(`Terminé : ${n} image(s) optimisée(s), ${(gain/1048576).toFixed(1)} Mo économisés par affichage complet.`)}

function mkMulti(el,cat,lab,rem){
  el.innerHTML='<div class="mm"></div><button type="button" class="sec mplus">'+(lab||'+ Ajouter un effet')+'</button>';
  const zone=el.querySelector('.mm'),L=[];
  const add=()=>{const w=document.createElement('div');w.style.cssText='border-left:3px solid #7c3aed;padding-left:8px;margin:6px 0';
    const inner=document.createElement('div'),x=document.createElement('button');x.type='button';x.className='sec';x.textContent=rem||'✕ Retirer cet effet';
    w.append(inner,x);zone.appendChild(w);const m=mk(inner,cat),it={m,w};L.push(it);
    x.onclick=()=>{if(L.length<2)return;w.remove();L.splice(L.indexOf(it),1)};return m};
  el.querySelector('.mplus').onclick=add;add();
  return {get(){const a=L.map(i=>i.m.get()).filter(Boolean);return !a.length?null:a.length==1?a[0]:{briques:a}},
   set(o){if(!o)return;const arr=o.briques||[o];while(L.length>1){L.pop().w.remove()}arr.forEach((b,i)=>{(i==0?L[0].m:add()).set(b)})}};
}

async function aCollections(){
  const [c,cc]=await Promise.all([q(sb.from('collections').select('*').order('id')),q(sb.from('cartes').select('collection_id'))]);
  const nb=id=>cc.filter(y=>y.collection_id==id).length;
  $('#sub').innerHTML=`<table><tr><th>Nom</th><th>Cartes</th><th></th></tr>
  ${c.map(x=>`<tr data-id="${x.id}"><td><input value="${esc(x.nom)}"></td><td>${nb(x.id)}</td><td><button>Enregistrer</button> <button class="sec">🗑️</button></td></tr>`).join('')}
  <tr data-id="new"><td><input placeholder="Nouvelle collection"></td><td></td><td><button>Ajouter</button></td></tr></table>`;
  $('#sub').querySelectorAll('tr[data-id]').forEach(tr=>{const b=tr.querySelectorAll('button');
    b[0].onclick=async()=>{const nom=tr.querySelector('input').value.trim();if(!nom)return;
      await q(tr.dataset.id=='new'?sb.from('collections').insert({nom}):sb.from('collections').update({nom}).eq('id',tr.dataset.id));aCollections();};

      await q(sb.from('collections').delete().eq('id',tr.dataset.id));aCollections();};});
}

const RANGS_RAR=['ggez','legendaire','epique','rare','commun'];   // GGEZ : au-dessus du légendaire (arc-en-ciel) ;   // du plus haut au plus bas ; un nom inconnu passe après, du plus rare au moins rare selon son poids de drop
function rangRar(r){const n=String((r&&r.nom)||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z]/g,''),i=RANGS_RAR.findIndex(k=>n.includes(k));return[i<0?9:i,+(r&&r.poids)||0]}
function cmpCartes(a,b){const x=rangRar(a.raretes),y=rangRar(b.raretes);return(x[0]-y[0])||(x[1]-y[1])||a.nom.localeCompare(b.nom,'fr')}
const ORD_TYPE={combattant:0,magie:1,piege:2};
function cmpColl(a,b){const ca=a.variantes_carte.cartes,cb=b.variantes_carte.cartes,x=rangRar(ca.raretes),y=rangRar(cb.raretes);return(x[0]-y[0])||(x[1]-y[1])||(ORD_TYPE[ca.type]-ORD_TYPE[cb.type])||String(ca.nom||'').localeCompare(cb.nom||'','fr')||String(a.variantes_carte.nom||'').localeCompare(b.variantes_carte.nom||'','fr')}
const PRIX_MIN=250;   // un combat gagné rapporte 50 : un booster coûte au moins 5 victoires
function vedHTML(x,bv,cartes){
  const cur=bv.filter(v=>x&&v.type_id==x.id);
  const opt=sel=>'<option value="">— aucune —</option>'+cartes.map(c=>`<option value="${c.id}" ${sel==c.id?'selected':''}>${esc(c.nom)} (${esc(c.raretes?c.raretes.nom:'?')}${c.collections?' · '+esc(c.collections.nom):''})</option>`).join('');
  return `<small>⭐ Cartes vedettes (0 à 2) : mises en avant dans la boutique. Poids : 1 = comme les autres cartes de sa rareté ; 3 = trois fois plus de chances que chacune des autres cartes de cette rareté dans ce booster. La carte doit faire partie d'une collection du booster, être sans collection, ou être de rareté commune (les communes sortent dans tous les boosters).</small>
  <div class="row">${[1,2].map(n=>{const v=cur[n-1];return `<label><small>Vedette ${n}</small><br><select name="vc${n}">${opt(v&&v.carte_id)}</select></label><label><small>Poids</small><br><input name="vp${n}" type="number" step="any" min="0.01" value="${v?v.poids:3}" style="width:70px"></label>`}).join('')}</div>`}
async function aBoosters(){
  const [b,col,rar,bc,bm]=await Promise.all([q(sb.from('types_boosters').select('*').order('id')),q(sb.from('collections').select('*').order('nom')),
    q(sb.from('raretes').select('*').order('ordre')),q(sb.from('boosters_collections').select('*')),q(sb.from('boosters_modifs').select('*'))]);
  const vr=await sb.from('boosters_vedettes').select('*'),vedOk=!vr.error,vedErr=vr.error?vr.error.message:'',bv=vedOk?vr.data:[];
  const cr=vedOk?await sb.from('cartes').select('id,nom,type,raretes(nom,poids),collections(nom)').eq('actif',true):{data:[]},cartesV=(cr.data||[]).sort(cmpCartes);
  const form=x=>{
    const cs=new Set(bc.filter(y=>x&&y.type_id==x.id).map(y=>y.collection_id)),ms={};
    bm.filter(y=>x&&y.type_id==x.id).forEach(y=>ms[y.rarete_id]=y.modif);
    return `<form class="f" data-id="${x?x.id:'new'}"><b>${x?esc(x.nom):'Nouveau booster'}</b>
    <input name="nom" value="${esc(x?x.nom:'')}" placeholder="Nom du booster" required>
    <div class="row"><label><small>Prix</small><br><input name="prix" type="number" min="${PRIX_MIN}" value="${x?x.prix:PRIX_MIN}" style="width:90px"></label>
     <label><small>Nb de cartes</small><br><input name="nb" type="number" min="1" value="${x?x.nb_cartes:5}" style="width:90px"></label>
     <label><input type="checkbox" name="actif" ${!x||x.actif?'checked':''}> En vente</label>
     <label><input type="checkbox" name="quotidien" ${x&&x.quotidien?'checked':''}> 🎁 Distribué par le booster quotidien</label></div>
    <small>Prix minimum ${PRIX_MIN} (un combat gagné rapporte 50). Le booster quotidien ne tire que parmi les boosters cochés « Distribué par le booster quotidien » : laisse décochés les boosters premium.</small>
    ${x&&x.image_path?`<img loading="lazy" src="${img(x.image_path)}" style="max-width:140px;border-radius:6px">`:''}<label><small>Image du booster (optionnel)</small><br><input name="file" type="file" accept="image/*"></label>
    <small>Collections présentes (les cartes communes sont toujours incluses)</small>
    <div class="row">${col.map(c=>`<label><input type="checkbox" name="c${c.id}" ${cs.has(c.id)?'checked':''}> ${esc(c.nom)}</label>`).join('')||'<small>Aucune collection</small>'}</div>
    <small>Modificateur de drop : s'ajoute au poids de la rareté pour ce booster (négatif possible)</small>
    <div class="row">${rar.map(r=>`<label><small>${esc(r.nom)} (poids ${r.poids})</small><br><input name="m${r.id}" type="number" step="any" value="${ms[r.id]||0}" style="width:90px"></label>`).join('')}</div>
    ${vedOk?vedHTML(x,bv,cartesV):`<small>⭐ Cartes vedettes indisponibles (erreur : ${esc(vedErr)}). Lance 07-prix-vedettes.sql puis 07b-vedettes-acces.sql dans Supabase.</small>`}
     <div class="row"><button>${x?'Enregistrer':'Créer le booster'}</button>${x?`<button type="button" class="sec" data-del="${x.id}" data-nom="${esc(x.nom)}">🗑️ Supprimer</button>`:''}</div></form>`};
  $('#sub').innerHTML=form(null)+'<h3>Boosters existants ('+b.length+')</h3>'+b.map(form).join('');
  $('#sub').querySelectorAll('form').forEach(f=>f.onsubmit=async e=>{e.preventDefault();
    try{const row={nom:f.nom.value,prix:+f.prix.value,nb_cartes:+f.nb.value,actif:f.actif.checked,quotidien:f.quotidien.checked};if(f.file.files[0])row.image_path=await upload(f.file.files[0]);let id=f.dataset.id;
     if(id=='new')id=(await q(sb.from('types_boosters').insert(row).select('id').single())).id;
     else await q(sb.from('types_boosters').update(row).eq('id',id));
     id=+id;
     await q(sb.from('boosters_collections').delete().eq('type_id',id));
     const cs=col.filter(c=>f['c'+c.id].checked).map(c=>({type_id:id,collection_id:c.id}));
     if(cs.length)await q(sb.from('boosters_collections').insert(cs));
     await q(sb.from('boosters_modifs').upsert(rar.map(r=>({type_id:id,rarete_id:r.id,modif:+f['m'+r.id].value||0}))));
      if(vedOk){await q(sb.from('boosters_vedettes').delete().eq('type_id',id));
       const vs=[1,2].map(n=>({type_id:id,carte_id:+f['vc'+n].value,poids:Math.max(.01,+f['vp'+n].value||3)})).filter((v,i,t)=>v.carte_id&&t.findIndex(w=>w.carte_id==v.carte_id)==i);
       if(vs.length)await q(sb.from('boosters_vedettes').insert(vs))}
     aBoosters();}catch(x){}});
  $('#sub').querySelectorAll('button[data-del]').forEach(x=>x.onclick=async()=>{

async function aEffets(){
  const r=await sb.from('effets_perso').select('*').order('id');
  if(r.error){$('#sub').innerHTML='<p class="ko">Table introuvable : lance d\'abord 04-effets.sql dans Supabase.</p>';return}
  const L=r.data,CATS={passif:'Passif',ultime:'Ultime',magie:'Magie',condition:'Condition de piège'};
  $('#sub').innerHTML=`<p class="ko">⚠️ Les effets créés ici sont <b>seulement un texte affiché</b> : le moteur de combat ne sait pas les exécuter (seuls ceux qui parlent d'étourdissement le sont). Pour qu'un nouvel effet agisse vraiment dans les combats, il doit être ajouté au moteur : utilise d'abord les effets de la liste de base des cartes.</p>
   <form class="f" id="fe"><b>Nouvel effet</b><select name="cat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
   <input name="lib" placeholder="Texte affiché (ex : Gagne X PV quand il attaque)" required>
   <small>Valeurs à saisir pour cet effet</small>
   <div class="row">${Object.entries(P).map(([k,v])=>`<label><input type="checkbox" name="p_${k}"> ${v[0]}</label>`).join('')}</div>
   <button>Ajouter l'effet</button></form>
   <h3>Effets ajoutés (${L.length})</h3><table><tr><th>Type</th><th>Texte</th><th>Valeurs</th><th></th></tr>
   ${L.map(x=>`<tr><td>${CATS[x.categorie]}</td><td>${esc(x.libelle)}</td><td>${x.params.map(k=>esc(P[k]?P[k][0]:k)).join(', ')||'—'}</td><td><button class="sec" data-id="${x.id}">🗑️</button></td></tr>`).join('')}</table>`;
  $('#fe').onsubmit=async e=>{e.preventDefault();const f=e.target;
    const params=Object.keys(P).filter(k=>f['p_'+k].checked);
    const cle='perso_'+f.lib.value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
    try{await q(sb.from('effets_perso').insert({categorie:f.cat.value,cle,libelle:f.lib.value.trim(),params}));aEffets();}catch(x){}};
  $('#sub').querySelectorAll('button[data-id]').forEach(b=>b.onclick=async()=>{
    if(!(await uiConfirm('Retirer cet effet de la liste ? (Les cartes déjà créées avec cet effet le gardent.)')))return;
    await q(sb.from('effets_perso').delete().eq('id',b.dataset.id));aEffets();});
}

async function aRaretes(){
  const r=await q(sb.from('raretes').select('*').order('ordre'));
  $('#sub').innerHTML=`<p><small>Poids : plus il est grand, plus la rareté sort souvent (ex : 70 / 25 / 5).</small></p>
  <table><tr><th>Nom</th><th>Couleur</th><th>Poids</th><th>Ordre</th><th></th></tr>
  ${r.map(x=>`<tr data-id="${x.id}"><td><input value="${esc(x.nom)}"></td><td><input type="color" value="${esc(x.couleur)}"></td><td><input type="number" step="any" min="0" value="${x.poids}" style="width:80px"></td><td><input type="number" value="${x.ordre}" style="width:70px"></td><td><button>Enregistrer</button></td></tr>`).join('')}

  $('#sub').querySelectorAll('tr[data-id]').forEach(tr=>tr.querySelector('button').onclick=async()=>{

  main.innerHTML=`<p><small>Ton dos de carte s'affiche sur ton piège face cachée pendant les combats en direct. Les dos spéciaux sont offerts par le streamer.</small></p>
  <div class="cgrid">${tuile('','Dos standard',null,aucun,'Dos du jeu')}${L.map(x=>tuile(x.id,x.nom,x.image,x.actif,x.par_defaut?'Dos de base':'Offert')).join('')}</div>`;

  const [d,dj,j]=R.map(x=>x.data||[]),nomJ=id=>(j.find(x=>x.id==id)||{}).pseudo||'?';
  $('#sub').innerHTML=`<p><small>Stocke ici tes dos de cartes (même format que tes cartes, ratio 5/7). Le « dos de base » est utilisable par tous les joueurs ; les autres ne servent qu'à ceux à qui tu les offres. Chaque joueur choisit le sien dans l'onglet « Dos de cartes ».</small></p>
  <form class="f" id="fd"><input name="nom" placeholder="Nom du dos" required>
   <label>Image du dos<br><input name="file" type="file" accept="image/*" required></label>
   <label><input type="checkbox" name="def"> Dos de base (disponible pour tous les joueurs)</label><button>Ajouter ce dos</button></form>
  <div class="cgrid">${d.map(x=>{const own=dj.filter(y=>y.dos_id==x.id);return `<div class="cw" data-id="${x.id}">
   <div style="aspect-ratio:5/7;border-radius:10px;border:3px solid ${x.par_defaut?'#fbbf24':'#444'};background:#111 url('${img(x.image)}') center/cover"></div>
   <b>${esc(x.nom)}</b>${x.par_defaut?'<small style="color:#fbbf24">★ Dos de base</small>':`<small>${own.length} joueur(s) l'ont reçu</small>`}
   <select data-o><option value="">🎁 Tous les joueurs</option>${opts(j,'pseudo')}</select>
   <button data-a="offrir">Offrir</button>
   <button class="sec" data-a="base">${x.par_defaut?'Retirer « dos de base »':'Définir comme dos de base'}</button>
   <button class="sec" data-a="suppr" style="color:#f87171">Supprimer</button>
   ${own.length?`<div class="row">${own.map(y=>`<span style="background:#262633;border:1px solid #444;border-radius:12px;padding:2px 8px;font-size:12px">${esc(nomJ(y.joueur_id))} <a href="#" data-r="${y.joueur_id}" style="color:#f87171;text-decoration:none">✕</a></span>`).join('')}</div>`:''}
  </div>`}).join('')||'<p><small>Aucun dos pour l\'instant.</small></p>'}</div>`;
  $('#fd').onsubmit=async e=>{e.preventDefault();const f=e.target,fic=f.file.files[0];if(!fic)return;
    const image=await upload(fic);
    if(f.def.checked)await q(sb.from('dos_cartes').update({par_defaut:false}).eq('par_defaut',true));
    await q(sb.from('dos_cartes').insert({nom:f.nom.value,image,par_defaut:f.def.checked}));aDos()};
  $('#sub').querySelectorAll('.cw[data-id]').forEach(c=>{const id=c.dataset.id,x=d.find(z=>z.id==id);
    c.querySelector('[data-a=offrir]').onclick=async()=>{
      const n=await q(sb.rpc('admin_offrir_dos',{p_dos:id,p_joueur:c.querySelector('[data-o]').value||null}));
      uiAlert(n?n+' joueur(s) ont reçu ce dos.':'Rien à faire : le ou les joueurs ont déjà ce dos.');aDos()};
    c.querySelector('[data-a=base]').onclick=async()=>{
      await q(sb.from('dos_cartes').update({par_defaut:false}).eq('par_defaut',true));
      if(!x.par_defaut)await q(sb.from('dos_cartes').update({par_defaut:true}).eq('id',id));aDos()};
    c.querySelector('[data-a=suppr]').onclick=async()=>{
      if(!(await uiConfirm('Supprimer ce dos ? Les joueurs qui l\'utilisent reviendront au dos standard.')))return;
      await q(sb.from('dos_cartes').delete().eq('id',id));aDos()};
    c.querySelectorAll('a[data-r]').forEach(a=>a.onclick=async ev=>{ev.preventDefault();
      await q(sb.rpc('admin_retirer_dos',{p_dos:id,p_joueur:a.dataset.r}));aDos()})});
}

// Gains des combats (Admin > Réglages) : lus par la fonction Supabase des combats
const finLocale=iso=>{if(!iso)return'';const d=new Date(iso);if(isNaN(d))return'';const z=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`};
function etatGains(v){const m=+(v.multiplicateur_gains??1)||0,f=v.multiplicateur_fin?new Date(v.multiplicateur_fin):null,fini=f&&!isNaN(f)&&f<new Date();
 const g=k=>Math.round((+(v[k]??{gain_victoire:50,gain_defaite:10,gain_nul:20}[k])||0)*(fini?1:m));
 return(m!==1&&!fini?`🔥 Multiplicateur ×${m} actif${f&&!isNaN(f)?' jusqu\'au '+f.toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}):' (sans heure de fin)'}`:'Gains normaux (×1)')+` — en ce moment : victoire ${g('gain_victoire')}, défaite ${g('gain_defaite')}, nul ${g('gain_nul')} gold.`}
function etatBounty(v){const f=v.bounty_fin?new Date(v.bounty_fin):null,fini=f&&!isNaN(f)&&f<new Date();
 if(String(v.bounty_actif)!=='1'||fini)return'Bounty inactif.';const pg=+(v.bounty_part_gagnant??70);
 return`🎯 Bounty actif${f&&!isNaN(f)?' jusqu\'au '+f.toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}):' (sans heure de fin)'} : prime de ${v.bounty_min??5} à ${v.bounty_max??90} gold dans ${v.bounty_chance??30} % des combats, ${pg} % gagnant / ${100-pg} % perdant, et ${v.bounty_tout??10} % de chances que le gagnant rafle tout.`}

  $('#optorph').onclick=async()=>{const L=$('#optlog');L.textContent='Recherche des images inutilisées…\n';   // images du stockage qui ne servent plus à aucune carte (active ou non), booster, dos ni proposition (20-images-inutilisees.sql)

    const P=(r.data||[]).map(x=>x.chemin).filter(Boolean),tot=(r.data||[]).reduce((a,x)=>a+(+x.octets||0),0);

    L.textContent+=`${n} image(s) supprimée(s), ${(tot/1048576).toFixed(1)} Mo libérés.`};
  $('#optdel').onclick=async()=>{const K=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('optim|'))K.push(k)}}catch(e){}
    if(!K.length)return uiAlert('Aucun original à supprimer depuis ce navigateur.');if(!(await uiConfirm('Supprimer définitivement les '+K.length+' image(s) d\'origine ?\nTu ne pourras plus revenir en arrière.')))return;
    const P=K.map(k=>localStorage.getItem(k)).filter(Boolean),L=$('#optlog');L.textContent='';let n=0;
    for(let i=0;i<P.length;i+=50){const r=await sb.storage.from('cartes').remove(P.slice(i,i+50));if(r.error)L.textContent+='✗ '+r.error.message+'\n';else n+=(r.data||[]).length}
    K.forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});L.textContent+=n+' original(aux) supprimé(s).'};
  $('#optback').onclick=async()=>{const K=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('optim|'))K.push(k)}}catch(e){}
    if(!K.length)return uiAlert('Aucune optimisation à annuler depuis ce navigateur.');if(!(await uiConfirm('Remettre les '+K.length+' image(s) d\'origine ?')))return;
    const L=$('#optlog');L.textContent='';let n=0;for(const k of K){const [,tab,id,col]=k.split('|');const p=localStorage.getItem(k);
      const r=await sb.from(tab).update({[col]:p}).eq('id',id);if(r.error)L.textContent+='✗ '+k+' : '+r.error.message+'\n';else{n++;localStorage.removeItem(k)}}
    L.textContent+=n+' image(s) remise(s) à l\'original.'};
  $('#optim').onclick=async()=>{if(!(await uiConfirm('Optimiser toutes les images déjà en ligne ? Les anciens fichiers seront remplacés par des versions WebP plus légères.')))return;const b=$('#optim'),L=$('#optlog');b.disabled=true;L.textContent='';await optimiserImages(t=>{L.textContent+=t+'\n';L.scrollTop=1e9});b.disabled=false};
  $('#fr').onsubmit=async e=>{e.preventDefault();const n=Math.max(0,Math.min(50,parseInt(e.target.n.value,10)||0));
    await q(sb.from('reglages_jeu').upsert({cle:'combats_gratuits_par_jour',valeur:String(n)}));uiAlert('Enregistré : '+n+' combat'+(n>1?'s':'')+' gratuit'+(n>1?'s':'')+' par jour.');aReglages()};
  $('#fgain').onsubmit=async e=>{e.preventDefault();const f=e.target,n=(x,max)=>Math.max(0,Math.min(max,+x||0));
    const fin=f.fin.value?new Date(f.fin.value):null;if(fin&&isNaN(fin))return uiAlert('Heure de fin invalide.');
    await sauverGains({gain_victoire:Math.round(n(f.gv.value,10000)),gain_defaite:Math.round(n(f.gd.value,10000)),gain_nul:Math.round(n(f.gn.value,10000)),multiplicateur_gains:n(f.mul.value,10),multiplicateur_fin:fin?fin.toISOString():''});
    uiAlert('Gains enregistrés.');aReglages()};
  $('#gx2').onclick=async()=>{await sauverGains({multiplicateur_gains:2,multiplicateur_fin:new Date(Date.now()+6*3600e3).toISOString()});uiAlert('🔥 Soirée double gains lancée pour 6 heures !');aReglages()};
  $('#gx1').onclick=async()=>{await sauverGains({multiplicateur_gains:1,multiplicateur_fin:''});uiAlert('Gains remis à la normale (×1).');aReglages()};
  $('#fbounty').onsubmit=async e=>{e.preventDefault();const f=e.target,n=(x,max)=>Math.max(0,Math.min(max,Math.round(+x||0)));
    const fin=f.fin.value?new Date(f.fin.value):null;if(fin&&isNaN(fin))return uiAlert('Heure de fin invalide.');
    const mn=n(f.bmin.value,100000),mx=Math.max(mn,n(f.bmax.value,100000));
    await sauverGains({bounty_actif:f.on.checked?1:0,bounty_min:mn,bounty_max:mx,bounty_part_gagnant:n(f.bpart.value,100),bounty_chance:n(f.bch.value,100),bounty_tout:n(f.btout.value,100),bounty_fin:fin?fin.toISOString():''});
    uiAlert('Bounty enregistré.');aReglages()};
  $('#bgo').onclick=async()=>{await sauverGains({bounty_actif:1,bounty_fin:new Date(Date.now()+6*3600e3).toISOString()});uiAlert('🎯 Bounty lancé pour 6 heures !');aReglages()};
  $('#bstop').onclick=async()=>{await sauverGains({bounty_actif:0,bounty_fin:''});uiAlert('Bounty arrêté.');aReglages()};
  $('#fma').onsubmit=async e=>{e.preventDefault();const n=Math.max(0,Math.min(50,parseInt(e.target.n.value,10)||0));
    await q(sb.from('reglages_jeu').upsert({cle:'combats_meme_adversaire_par_jour',valeur:String(n)}));uiAlert(n?'Enregistré : '+n+' combat'+(n>1?'s':'')+' maximum par jour contre le même adversaire.':'Enregistré : pas de limite contre le même adversaire.');aReglages()};
  $('#frc').onsubmit=async e=>{e.preventDefault();const f=e.target,rows=[];
    for(const k of['commun','rare','epique','legendaire','ggez']){rows.push({cle:'recyclage_gold_'+k,valeur:String(Math.max(0,parseInt(f['g_'+k].value,10)||0))},{cle:'recyclage_fragments_'+k,valeur:String(Math.max(0,parseInt(f['f_'+k].value,10)||0))})}
    await q(sb.from('reglages_jeu').upsert(rows));PRIX=null;uiAlert('Prix de recyclage enregistrés.');aReglages()};
  $('#rzc').onclick=async()=>{if(!(await uiConfirm('Remettre à zéro le compteur de combats gratuits de tous les joueurs ?')))return;
    await q(sb.rpc('admin_reset_combats_jour'));uiAlert('Compteurs remis à zéro.')};
}

sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_IN'&&!user)init()});
chargerMiroir().then(init);
</script></body></html>
