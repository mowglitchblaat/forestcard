.ct{--g:#888;--g1:color-mix(in srgb,var(--g) 38%,transparent);--g2:color-mix(in srgb,var(--g) 80%,transparent);--sp:3.4s;position:relative;display:flex;flex-direction:column;gap:9px;padding:9px 9px 11px;border-radius:16px;

 transition:transform .25s cubic-bezier(.2,.9,.3,1.3),filter .25s;
 animation:ctpop .55s cubic-bezier(.2,.9,.3,1.25) backwards,ctglow var(--sp) ease-in-out .7s infinite;
 animation-delay:calc(min(var(--i,0),14)*40ms),calc(.7s + min(var(--i,0),14)*40ms)}

 background:linear-gradient(165deg,color-mix(in srgb,var(--g) 18%,#1c1c27) 0%,#15151d 62%) padding-box,conic-gradient(from var(--ang),var(--g),#fffbe0,var(--g),#ffe58a,var(--g)) border-box;animation:ctpop .6s cubic-bezier(.2,.9,.3,1.25) backwards,ctglow var(--sp) ease-in-out .7s infinite,ctspin 4.5s linear infinite;
 animation-delay:calc(min(var(--i,0),14)*40ms),calc(.7s + min(var(--i,0),14)*40ms),0s}

 background:linear-gradient(160deg,color-mix(in srgb,var(--g) 18%,#1b1b25),#12121a 65%);box-shadow:0 0 40px color-mix(in srgb,var(--g) 55%,transparent),0 20px 60px rgba(0,0,0,.6);animation:ctpop .45s cubic-bezier(.2,.9,.3,1.25) backwards}

/* FX-BEGIN */
/* ---------- Effets en texte clair (cartes de la collection) ---------- */
const nz=v=>+v||0,trs=t=>`${t} tour${t>1?'s':''}`,sgn=v=>(v>0?'+':'')+v,upc=u=>u==='pct'?' %':'',tousT=t=>t>1?`tous les ${t} tours`:'à chaque tour';
const ciblT=e=>(e.ciblem||e.cible)==='soi'?'sa propre carte':"l'adversaire";
const cat=t=>{const L=typeof MAG!=='undefined'&&(MAG[t]||ULT[t]||PAS[t]);return L?L[0]:String(t||'Effet')};
// Effets « perso » d'étourdissement (créés dans l'onglet Effets) : décrits comme l'étourdissement du moteur, qui les exécute ainsi
const canonFx=(e,pas)=>e&&typeof e.type==='string'&&/^perso_/.test(e.type)&&/etourd/.test(e.type)?{...e,type:pas?'etourdir':'etourdir_effet',chance:(e.chance==null||e.chance==='')&&e.val!=null&&e.val!==''?e.val:e.chance}:e;   // la « Valeur » saisie = la chance en %
function fxPassif(p){
  p=canonFx(p,true);
  const c=p.chance==null||p.chance===''?100:nz(p.chance),t=nz(p.tours),v=nz(p.val),T=t||1;
  switch(p.type){
    case 'evite_mort':return "Évite la mort une fois (reste à 1 PV, statuts négatifs retirés)";
    case 'reanimation':return `Réanimation : revient avec ${nz(p.pctrev)} % de ses PV max (une fois)`;
    case 'esquive':return `${c} % de chances d'esquiver chaque attaque`;
    case 'fatigue':return `${c} % de chances de fatiguer la cible à chaque coup (ATQ −${nz(p.fatval)}${upc(p.u)} pendant ${trs(nz(p.fattours)||1)})`;
    case 'aleatoire':return `Effet aléatoire ${tousT(nz(p.every))}${c<100?` (${c} % de chances)`:''}`;
    case 'purification':return `Purification : retire les statuts négatifs ${tousT(nz(p.every))}${nz(p.fois)>0?` (${p.fois} fois max)`:''}`;
    case 'soin_tour':return `Se soigne de ${v}${p.u==='pct'?' % des PV max':' PV'} à chaque tour`;
    case 'renvoi':return p.u==='pct'?`Renvoie ${v} % des dégâts reçus`:`Renvoie ${v} dégâts à chaque coup reçu`;
    case 'atq_tours':return `ATQ +${v}${upc(p.u)} ${tousT(t)}`;
    case 'pv_tours':return `PV max +${v}${upc(p.u)} ${tousT(t)}`;
    case 'multi_frappe':return `${c} % de chances de frapper ${nz(p.frappes)} fois par tour`;
    case 'reduc_degats':return `${c} % de chances de réduire les dégâts reçus de ${v}${upc(p.u)}`;
    case 'bonus_frappe':return `S'il est frappé ${nz(p.coups)||1} fois, sa prochaine attaque fait +${v}${upc(p.u)} de dégâts`;
    case 'etourdir':return `${c} % de chances${nz(p.essais)>1?` (${p.essais} tentatives)`:''} d'étourdir la cible ${t>1?`pendant ${t} attaques`:'(elle saute sa prochaine attaque)'}`;
    case 'vol_pct_atq':return `${c} % de chances de se soigner de ${nz(p.pctatq)} % des dégâts infligés`;
    case 'brulure':return `${c} % de chances de brûler la cible (${nz(p.pctpv)} % de ses PV max par tour, ${trs(T)})`;
    case 'poison':return `${c} % de chances d'empoisonner la cible (${nz(p.degtour)} dégâts par tour, ${trs(T)})`;
    case 'malediction':return `${c} % de chances de maudire la cible (ATQ −${v} par tour, ${trs(T)})`;
    case 'enchainement':return `${c} % de chances de frapper une fois de plus, puis retente${nz(p.max)>0?` (${p.max} frappes en plus au maximum)`:''}`;
    case 'saignement':return `${c} % de chances de faire saigner la cible (${nz(p.pctpv)} % des PV max par tour, soins −${nz(p.reducsoin)} %, ${trs(T)})`;
    case 'gel':return `${c} % de chances de geler la cible (${nz(p.annul)} % d'attaque annulée, ${nz(p.stunch)} % d'être étourdie, ${trs(T)})`;
    case 'fracture':return `${c} % de chances de fracturer la cible (${nz(p.fchance)} % de se blesser de ${nz(p.degfrac)} PV en attaquant, ${trs(T)})`;
    default:return cat(p.type)}
}
function fxEffet(e){
  if(!e)return[];
  if(Array.isArray(e.briques))return e.briques.flatMap(fxEffet);
  e=canonFx(e);
  const t=nz(e.tours),T=t||1,v=nz(e.val),pct=e.u==='pct',ci=ciblT(e);
  switch(e.type){
    case 'atq_mod':return[`${e.cible==='adversaire'?"ATQ de l'adversaire":'Son ATQ'} ${sgn(v)}${upc(e.u)}`];
    case 'pv_mod':return[`${e.cible==='adversaire'?"PV max de l'adversaire":'Ses PV max'} ${sgn(v)}${upc(e.u)}`];
    case 'soin':return[`Se soigne de ${v}${pct?' % des PV max':' PV'}`];
    case 'reanimation':return[`Réanimation : revient avec ${nz(e.pctrev)} % de ses PV max (une fois)`];
    case 'rage':return[`Rage : +${nz(e.ragev)}${upc(e.u)} de dégâts par coup pendant ${trs(nz(e.ragetours)||1)}, puis fatigue (ATQ −${nz(e.fatval)}${upc(e.u)} pendant ${trs(nz(e.fattours)||1)})`];
    case 'fatigue':return[`Fatigue ${ci} : ATQ −${nz(e.fatval)}${upc(e.u)} pendant ${trs(nz(e.fattours)||1)}`];
    case 'aleatoire':{const n=Math.max(1,nz(e.nbalea)||nz(e.fois)||1);return[`Effet aléatoire${n>1?` ×${n}`:''}`]}
    case 'soin_tours':return[`Régénération : +${v}${pct?' % des PV max':' PV'} par tour pendant ${trs(T)}`];
    case 'purification':return[`Purification ${e.cible==='adversaire'?"de l'adversaire":'de sa carte'} : retire les statuts négatifs${nz(e.fois)>1?` (${e.fois} fois, ${tousT(nz(e.every))})`:''}`];
    case 'degats':return[`Inflige ${v} dégâts directs`];
    case 'vol_vie':return[`Vole ${v} PV à l'adversaire`];
    case 'annule_attaque':return["Annule la prochaine attaque de l'adversaire"];
    case 'renvoi':return[`Renvoie ${v} % des dégâts reçus pendant ${trs(T)}`];
    case 'insensible_piege':return[`Insensible aux pièges pendant ${trs(T)}`];
    case 'annule_magies':return[nz(e.tours)>0?`Annule la magie de l'adversaire pendant ${trs(nz(e.tours))}`:"Annule la magie de l'adversaire jusqu'à la fin du combat"];
    case 'degats_tours':return[`Inflige ${v} dégâts après ${trs(T)}`];
    case 'double_degats':return[`Double ses dégâts pendant ${trs(T)}`];
    case 'echange_atq':return["Échange son ATQ avec celle de l'adversaire"];
    case 'echange_atq_def':return[`Échange l'ATQ et les PV ${(e.ciblem||e.cible)==='soi'?'de sa carte':"de l'adversaire"}`];
    case 'echange_pv':return["Échange ses PV avec ceux de l'adversaire"];
    case 'echange_tout':return["Échange ATQ et PV avec l'adversaire"];
    case 'malediction':return[`Maudit ${ci} : ATQ −${v} par tour pendant ${trs(T)}`];
    case 'saignement':return[`Fait saigner ${ci} : ${nz(e.pctpv)} % des PV max par tour, soins −${nz(e.reducsoin)} %, ${trs(T)}`];
    case 'gel':return[`Gèle ${ci} (${nz(e.annul)} % d'attaque annulée, ${nz(e.stunch)} % d'étourdissement, ${trs(T)})`];
    case 'fracture':return[`Fracture ${ci} (${nz(e.fchance)} % de se blesser de ${nz(e.degfrac)} PV en attaquant, ${trs(T)})`];
    case 'vol_ultime':return["Vole l'ultime de l'adversaire"];
    case 'poison_effet':return[`Empoisonne ${ci} : ${nz(e.degtour)} dégâts par tour pendant ${trs(T)}`];
    case 'brulure_effet':return[`Brûle ${ci} : ${nz(e.pctpv)} % des PV max par tour pendant ${trs(T)}`];
    case 'etourdir_effet':{const ch=e.chance==null||e.chance===''?100:nz(e.chance);const qui=(e.ciblem||e.cible)==='soi'?'sa propre carte':"l'adversaire";return[`${ch<100?`${ch} % de chances${nz(e.essais)>1?` (${e.essais} tentatives)`:''} d'étourdir`:'Étourdit'} ${qui} pendant ${trs(T)}`]}
    case 'esquive_mod':return[`${e.cible==='adversaire'?"Esquive de l'adversaire":'Son esquive'} ${sgn(v)} %`];
    case 'reset_ultime':return["Réinitialise l'ultime (utilisable à nouveau)"];
    case 'mort_evitee':{const k=e.cond||'aucune';return[`Évite la mort une fois (reste à 1 PV, statuts négatifs retirés)${k==='pv_max'?` — si ses PV max sont d'au moins ${nz(e.seuil)}`:k==='degats_infliges'?` — s'il a déjà infligé ${nz(e.seuil)} dégâts`:''}`]}
    case 'detruire':return[`Détruit ${e.carte==='magie'?"la magie":"le piège"} de l'adversaire`];
    case 'voler':return[`Vole ${e.carte==='magie'?"la magie":"le piège"} de l'adversaire`];
    case 'equiper':return[`Équipe ${e.carte==='magie'?'une autre magie':'un autre piège'} du deck`];
    default:
      if(String(e.type||'').startsWith('atk_'))return['Attaque de base : '+fxPassif({...e,type:e.type.slice(4)})];
      return[cat(e.type)]}
}
function fxCond(c){
  if(!c||!c.type)return'';
  switch(c.type){
    case 'adv_attaque':return `Quand l'adversaire a attaqué ${nz(c.coups)||1} fois`;
    case 'adv_ultime':return "Quand l'adversaire utilise son ultime";
    case 'proprio_pv_sous':return `Quand le propriétaire passe sous ${nz(c.seuilpv)} % de PV`;
    case 'adv_pv_bas':return `Quand l'adversaire passe sous ${nz(c.seuilpv)} % de PV`;
    case 'adv_soigne':return "Quand l'adversaire se soigne";
    case 'proprio_soigne':return "Quand le propriétaire se soigne";
    case 'proprio_meurt':return "Quand le propriétaire est sur le point de mourir";
    default:return typeof CON!=='undefined'&&CON[c.type]?CON[c.type][0]:String(c.type)}
}
function fxTrigUlt(u){
  const p=[];
  if(nz(u.apres_tours))p.push(`dès son tour ${u.apres_tours}`);
  if(u.sur_carte)p.push("quand une carte s'active");
  let s=p.length?'Se déclenche '+p.join(' ou '):'Ultime';
  if(nz(u.delai_tours)>0)s+=`, au plus une fois tous les ${u.delai_tours} tours`;
  if(nz(u.utilisations)>0)s+=`, ${u.utilisations} utilisation${u.utilisations>1?'s':''} maximum`;
  return s;
}
function lignesCarte(c){
  const L=[];
  if(c.type==='combattant'){
    const P=c.passif?(c.passif.briques?c.passif.briques.filter(b=>b&&b.type):(c.passif.type?[c.passif]:[])):[];
    if(P.length)L.push({ico:'🛡️',t:P.length>1?'Passifs':'Passif',items:P.map(fxPassif)});
    const u=c.ultime;if(u&&(u.type||u.briques)){const it=fxEffet(u);if(it.length)L.push({ico:'⚡',t:'Ultime',meta:fxTrigUlt(u),items:it})}
  }else if(c.type==='magie'){
    const it=fxEffet(c.effet);if(it.length)L.push({ico:'✨',t:'Effet de la magie',items:it});
  }else if(c.type==='piege'&&c.effet){
    const e=c.effet,it=fxEffet(e.effet);
    if(it.length||e.condition)L.push({ico:'🪤',t:'Piège',meta:(fxCond(e.condition)||'Piège caché')+` · ${nz(e.declenchements)>1?`jusqu'à ${e.declenchements} déclenchements`:'1 seul déclenchement'}`,items:it});
  }
  return L;
}
/* FX-END */
const TIER=r=>['ul','lg','ep','ra','co'][rangRar(r)[0]]||'ra';
const txOn=h=>{const m=/^#?([0-9a-f]{6})$/i.exec(String(h||'').trim());if(!m)return'#111';const n=parseInt(m[1],16);return(0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255>.6?'#111':'#fff'};
const KRX=/(?<![\p{L}])(?:([+\-−]?\d+(?:[.,]\d+)?\s?%)|(\d+\s?tours?)|(dégâts?|saign\p{L}*|brûl\p{L}*|poison\p{L}*|malédiction\p{L}*|fracture\p{L}*|renvo\p{L}*)|(soins?|soign\p{L}*|régénér\p{L}*|réanim\p{L}*|PV|récup\p{L}*|protég\p{L}*|évite la mort|purifi\p{L}*)|(étourd\p{L}*|gel\p{L}*|fatigu\p{L}*|insensib\p{L}*|vol(?:e|er|é|s)?|échang\p{L}*|annul\p{L}*)|(ATQ|attaq\p{L}*|frappe\p{L}*|rage)|([+\-−]?\d+))(?![\p{L}])/giu;
const CK=['','k-p','k-t','k-d','k-h','k-s','k-a','k-n'];
const cz=t=>String(t).split(/(&#?\w+;)/).map((s,i)=>i%2?s:s.replace(KRX,(m,...g)=>{const k=g.slice(0,7).findIndex(x=>x!==undefined);return`<span class="${CK[k+1]}">${m}</span>`})).join('');   // les caractères échappés (&#39; = apostrophe…) ne sont jamais colorés, sinon ils s'affichent cassés   // le texte est déjà échappé : on ne touche qu'aux mots clés
/* ---------- Recyclage des doublons ---------- */
const PRIX_DEF={commun:{gold:5,fragments:0},rare:{gold:10,fragments:0},epique:{gold:35,fragments:0},legendaire:{gold:80,fragments:0},ggez:{gold:80,fragments:0}};
let PRIX=null;
async function chargerPrix(){if(PRIX)return PRIX;PRIX={...PRIX_DEF};try{const r=await sb.rpc('prix_recyclage');(r.data||[]).forEach(p=>{PRIX[p.rang]={gold:p.gold,fragments:p.fragments}})}catch(e){}return PRIX}
const rangDe=x=>['ggez','legendaire','epique','rare','commun'][rangRar(x.variantes_carte.cartes.raretes)[0]]||'commun';
const surplus=x=>Math.max(0,(x.quantite||1)-1);
const gainDe=x=>{const p=(PRIX||PRIX_DEF)[rangDe(x)]||PRIX_DEF.commun,n=surplus(x);return{n,gold:n*p.gold,fragments:n*p.fragments}};
const gainTxt=g=>`+${g.gold} gold`+(g.fragments?` · +${g.fragments} fragment${g.fragments>1?'s':''}`:'');
function gainTotal(){return collData.reduce((a,x)=>{const g=gainDe(x);a.n+=g.n;a.gold+=g.gold;a.fragments+=g.fragments;return a},{n:0,gold:0,fragments:0})}
async function recycler(varianteId,msg){
  if(!confirm(msg))return;
  const r=await sb.rpc('recycler_doublons',varianteId?{p_variante:varianteId}:{});
  if(r.error){alert(String(r.error.message).includes('RIEN_A_RECYCLER')?'Aucun doublon à recycler.':r.error.message);return}
  await Promise.all([loadColl(),refreshJoueur()]);mdClose();if(curView)curView();
  const d=r.data||{};alert(`♻ ${d.cartes} carte${d.cartes>1?'s':''} recyclée${d.cartes>1?'s':''} : +${d.gold} gold`+(d.fragments?` et +${d.fragments} fragment${d.fragments>1?'s':''}`:'')+'.')}
function bindRecycle(){main.querySelectorAll('button[data-rec]').forEach(b=>b.onclick=()=>{const v=+b.dataset.rec,x=collData.find(y=>y.variantes_carte.id===v);if(!x)return;const g=gainDe(x);
  recycler(v,`Recycler ${g.n} exemplaire${g.n>1?'s':''} en trop de « ${x.variantes_carte.cartes.nom} » ?\nTu en gardes 1. Tu reçois ${gainTxt(g).replace(/\+/g,'')}.`)});
  const all=$('#recall');if(all)all.onclick=()=>{const t=gainTotal();recycler(null,`Recycler tous tes doublons (${t.n} carte${t.n>1?'s':''}) ?\nTu gardes 1 exemplaire de chaque carte. Tu reçois ${gainTxt(t).replace(/\+/g,'')}.`)}}
const TYPE_L={combattant:['⚔️','Combattant'],magie:['✨','Magie'],piege:['🪤','Piège']};

let mdList=[],mdIdx=0,mdRedraw=null,mdFocus=null,mdFlip=false,_dosC=null;

async function dosActif(){if(_dosC)return _dosC;try{const r=await sb.rpc('mes_dos');const L=(r&&r.data)||[],a=L.find(x=>x.actif);_dosC=a?{nom:a.nom,image:a.image}:{nom:'Dos standard',image:null}}catch(e){_dosC={nom:'Dos standard',image:null}}return _dosC}
function mdEnsure(){
  if($('#cm'))return;
  document.body.insertAdjacentHTML('beforeend','<div class="cmo" id="cm" hidden><div class="cmb" role="dialog" aria-modal="true" aria-label="Détails de la carte"></div></div>');
  $('#cm').onclick=e=>{if(e.target.id==='cm')mdClose()};
  document.addEventListener('keydown',e=>{const m=$('#cm');if(!m||m.hidden)return;if(e.key==='Escape')mdClose();else if(e.key==='ArrowRight')mdNav(1);else if(e.key==='ArrowLeft')mdNav(-1)});
}
function mdOpen(list,i,redraw){mdEnsure();mdList=list;mdIdx=i;mdRedraw=redraw;mdFocus=document.activeElement;$('#cm').hidden=false;document.body.style.overflow='hidden';mdDraw()}
function mdClose(){const m=$('#cm');if(!m)return;m.hidden=true;document.body.style.overflow='';if(mdFocus&&mdFocus.focus){try{mdFocus.focus()}catch(e){}}}
function mdNav(d){if(mdList.length<2)return;mdIdx=(mdIdx+d+mdList.length)%mdList.length;mdDraw()}
function mdDraw(){
  const x=mdList[mdIdx];if(!x){mdClose();return}
  const v=x.variantes_carte,c=v.cartes,on=deck.has(c.id),col=c.raretes.couleur||'#888',L=lignesCarte(c),box=$('#cm .cmb'),tl=TYPE_L[c.type]||['',c.type];
  const mxA=Math.max(1,...collData.map(y=>nz(y.variantes_carte.cartes.atq))),mxP=Math.max(1,...collData.map(y=>nz(y.variantes_carte.cartes.pv)));

   <div class="cmi"><div class="fp"><div class="fi"><div class="tilt face">${v.image_path?`<img src="${img(v.image_path)}" alt="${esc(c.nom)}">`:`<div style="aspect-ratio:5/7;display:flex;align-items:center;justify-content:center;font-weight:700;padding:14px;text-align:center">${esc(c.nom)}</div>`}<div class="ho"></div><div class="gl"></div></div><div class="bk" id="mbk">🌲<div class="gl"></div></div></div></div>
    <div class="flb"><button class="sec" id="mflip">🔄 Retourner la carte</button><small id="mdosn"></small></div></div>

    ${c.type==='combattant'&&(c.atq!=null||c.pv!=null)?`<div class="sb"><div class="sbr"><span>⚔ ATQ</span><div class="sbar"><i style="width:${Math.min(100,Math.round(nz(c.atq)/mxA*100))}%"></i></div><b>${esc(c.atq??'?')}</b></div><div class="sbr"><span>❤ PV</span><div class="sbar"><i style="width:${Math.min(100,Math.round(nz(c.pv)/mxP*100))}%"></i></div><b>${esc(c.pv??'?')}</b></div></div>`:''}
    ${L.map(s=>`<div class="sec2"><h4>${s.ico} ${esc(s.t)}</h4>${s.meta?`<div class="trg">${esc(s.meta)}</div>`:''}<ul>${s.items.map(t=>`<li>${cz(esc(t))}</li>`).join('')}</ul></div>`).join('')||'<div class="sec2"><small>Cette carte n\'a pas d\'effet particulier.</small></div>'}
    ${c.description?`<div class="dsc">${esc(c.description)}</div>`:''}
    <div class="cmf"><button class="sec" data-nav="-1" ${mdList.length<2?'disabled':''}>‹ Précédente</button><button class="sec" data-nav="1" ${mdList.length<2?'disabled':''}>Suivante ›</button><span class="sp"></span>${surplus(x)>0&&v.id?`<button class="sec" data-mrec>♻ Recycler ×${surplus(x)} · ${gainTxt(gainDe(x))}</button>`:''}<button class="${on?'sec':''}" data-mdeck ${x.apercu?'disabled':''}>${x.apercu?'Aperçu (non possédée)':on?'✓ Retirer du deck':'Ajouter au deck'}</button></div>
   </div>`;
  box.querySelector('.cx').onclick=mdClose;
  box.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>mdNav(+b.dataset.nav));
  const mr=box.querySelector('[data-mrec]');if(mr)mr.onclick=()=>{const g=gainDe(x);recycler(v.id,`Recycler ${g.n} exemplaire${g.n>1?'s':''} en trop de « ${c.nom} » ?\nTu en gardes 1. Tu reçois ${gainTxt(g).replace(/\+/g,'')}.`)};
  box.querySelector('[data-mdeck]').onclick=()=>{
    if(deck.has(c.id))deck.delete(c.id);
    else if(deck.size>=10){alert('Deck complet : 10 cartes maximum.');return}
    else deck.add(c.id);
    if(mdRedraw)mdRedraw();mdDraw()};
  const tilt=box.querySelector('.fi'),fp=box.querySelector('.fp');
  fp.onpointermove=e=>{const r=fp.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
    tilt.style.setProperty('--rx',((0.5-py)*14).toFixed(1)+'deg');tilt.style.setProperty('--ry',((px-0.5)*18*(mdFlip?-1:1)).toFixed(1)+'deg');
    [tilt,...tilt.querySelectorAll('.tilt,.bk')].forEach(n=>{n.style.setProperty('--mx',(px*100).toFixed(0)+'%');n.style.setProperty('--my',(py*100).toFixed(0)+'%');n.style.setProperty('--hx',(px*100).toFixed(0)+'%')})};
  fp.onpointerleave=()=>{['--rx','--ry','--mx','--my','--hx'].forEach(k=>tilt.style.removeProperty(k))};
  mdFlip=false;
  box.querySelector('#mflip').onclick=()=>{mdFlip=!mdFlip;tilt.classList.add('fl');tilt.style.setProperty('--fl',mdFlip?'180deg':'0deg');box.querySelector('#mflip').textContent=mdFlip?'🔄 Voir la face':'🔄 Retourner la carte';setTimeout(()=>tilt.classList.remove('fl'),750)};
  dosActif().then(d=>{const bk=box.querySelector('#mbk'),n=box.querySelector('#mdosn');if(!bk)return;
    if(d&&d.image){bk.style.backgroundImage=`url('${img(d.image)}')`;bk.firstChild.nodeValue=''}
    n.textContent=d?(d.image?'Dos équipé : '+d.nom:'Dos standard du jeu'):'';});
  box.querySelector('.cx').focus({preventScroll:true});
}
function bindOpen(L,redraw){main.querySelectorAll('.ct').forEach(t=>t.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>mdOpen(L,+t.dataset.i,redraw)))}
function bindToggle(redraw){
  main.querySelectorAll('button[data-c]').forEach(b=>b.onclick=()=>{const id=+b.dataset.c;

/* ---------- Profils (visibles par tous les joueurs connectés) ---------- */
async function vProfil(id=user.id){
  const mine=id==user.id;
  const [rl,rp]=await Promise.all([sb.rpc('liste_profils'),sb.rpc('profil_public',{p_joueur:id})]);
  if(rl.error||rp.error){main.innerHTML='<p class="ko">Profils indisponibles pour le moment (l\'admin doit d\'abord lancer 05-profil.sql puis 06-profils-publics.sql dans Supabase).</p>';return}
  if(!rp.data){main.innerHTML='<p>Profil introuvable.</p>';return}
  const D=rp.data,S=D.stats||{},n=k=>S[k]??0,tot=n('victoires')+n('defaites')+n('nuls');
  const pct=tot?Math.round(100*n('victoires')/tot)+' %':'—';
  const st=(l,v,s)=>`<div class="stat"><span>${l}</span><b>${v}</b>${s?`<span>${s}</span>`:''}</div>`;
  const cardTile=(l,x,u)=>{
    if(!x)return st(l,'—');
    return `<div class="stat card2" style="--g:${esc(x.couleur||'#888')}">${x.image_path?`<img src="${img(x.image_path)}">`:''}<div><span>${l}</span><b style="font-size:18px">${esc(x.nom)}</b><span>${x.valeur} ${u}</span></div></div>`};
  let coll='';
  if(mine){
    await loadColl();
    const rt=await sb.from('cartes').select('id',{count:'exact',head:true}).eq('actif',true);
    const mc=new Map();collData.forEach(x=>{const c=x.variantes_carte.cartes;mc.set(c.id,c)});
    const copies=collData.reduce((a,x)=>a+x.quantite,0),byR={};
    mc.forEach(c=>{const r=c.raretes.nom;byR[r]=(byR[r]||0)+1});
    coll=`<h3>Collection</h3><div class="stats">
   ${st('Cartes différentes',mc.size+(rt.count!=null?' / '+rt.count:''))}${st('Cartes au total',copies,'doublons compris')}
   ${st('Boosters ouverts',n('boosters_ouverts'))}
   ${Object.entries(byR).map(([k,v])=>st(esc(k),v,'cartes différentes')).join('')}</div>`;
  }
  const rank=rl.data.slice(0,50).map((x,i)=>`<tr><td>${i+1}</td><td><button class="${x.joueur_id==id?'on':'sec'}" data-p="${x.joueur_id}">${esc(x.pseudo)}${x.joueur_id==user.id?' (moi)':''}</button></td><td>${x.victoires}</td><td>${x.defaites}</td><td>${x.nuls}</td></tr>`).join('');
  main.innerHTML=`<div class="row"><h3 style="margin:0">${mine?'Mon profil':'Profil de '+esc(D.pseudo)}</h3>${mine?'':`<button class="sec" data-p="${user.id}">← Mon profil</button>`}</div>
  <h3>Combats</h3><div class="stats">
   ${st('Victoires',n('victoires'))}${st('Défaites',n('defaites'))}${st('Nuls',n('nuls'))}
   ${st('% de victoires',pct,tot+' combat'+(tot>1?'s':''))}
   ${st('Meilleure série de victoires',n('meilleure_serie'))}${st('Série en cours',n('serie_actuelle'))}</div>
  <h3>Records</h3><div class="stats">
   ${st('Plus gros coup infligé',n('plus_gros_coup'),'dégâts en une attaque')}
   ${st('Victoire la plus rapide',S.victoire_rapide_tours?S.victoire_rapide_tours+' tours':'—')}
   ${st('Combat le plus long',S.combat_long_tours?S.combat_long_tours+' tours':'—')}
   ${st('Dégâts totaux infligés',n('degats_totaux'))}</div>
  <h3>Cartes</h3><div class="stats">${cardTile('Carte la plus jouée',D.plus_jouee,'combats')}${cardTile('Carte la plus victorieuse',D.plus_gagnante,'victoires')}</div>
  ${coll}
  ${tot?'':`<p><small>${mine?'Aucun combat joué pour l\'instant : tes statistiques de combat apparaîtront après ton premier combat.':'Ce joueur n\'a pas encore combattu.'}</small></p>`}

  <table><tr><th>#</th><th>Joueur</th><th>V</th><th>D</th><th>N</th></tr>${rank}</table>`;
  main.querySelectorAll('button[data-p]').forEach(b=>b.onclick=()=>{vProfil(b.dataset.p);window.scrollTo(0,0)});

// Équilibrage : enregistre automatiquement ce qui change sur une carte (appelé par l'admin). Ne bloque jamais l'enregistrement de la carte.
const txtEq={
  passif:c=>{const P=c.passif?(c.passif.briques?c.passif.briques.filter(b=>b&&b.type):(c.passif.type?[c.passif]:[])):[];return P.map(fxPassif).join(' · ')},
  ultime:c=>{const u=c.ultime;if(!u||!(u.type||u.briques))return'';return fxEffet(u).join(' · ')+' ('+fxTrigUlt(u)+')'},
  effet:c=>{if(c.type=='magie')return c.effet?fxEffet(c.effet).join(' · '):'';const e=c.effet;if(!e)return'';return(fxCond(e.condition)||'Piège caché')+' : '+fxEffet(e.effet).join(' · ')+(nz(e.declenchements)>1?` (jusqu'à ${e.declenchements} fois)`:'')}};
async function noteEquilibrage(avant,apres){
  try{
    let rn={};const rr=await sb.from('raretes').select('id,nom');(rr.data||[]).forEach(x=>rn[x.id]=x.nom);
    const ch=[],num=(k,lab)=>{const a=avant?avant[k]:null,b=apres[k];if(a!==b&&!(a==null&&b==null))ch.push({champ:lab,avant:a==null?null:String(a),apres:b==null?'':String(b),sens:a==null||b==null?0:Math.sign(b-a)})};
    if(!avant){ch.push({champ:'Nouvelle carte',avant:null,apres:[rn[apres.rarete_id],apres.type=='combattant'?`ATQ ${apres.atq??'?'} · PV ${apres.pv??'?'}`:apres.type].filter(Boolean).join(' · ')})}
    else{
      if(avant.nom!==apres.nom)ch.push({champ:'Nom',avant:avant.nom,apres:apres.nom,sens:0});
      if(avant.rarete_id!==apres.rarete_id)ch.push({champ:'Rareté',avant:rn[avant.rarete_id]||'?',apres:rn[apres.rarete_id]||'?',sens:0});
      if(apres.type=='combattant'||avant.type=='combattant'){num('atq','ATQ');num('pv','PV')}
      ['passif','ultime','effet'].forEach(k=>{if(JSON.stringify(avant[k]??null)!==JSON.stringify(apres[k]??null)){const t=apres.type||avant.type,c0={...avant,type:t},c1={...apres,type:t};
        ch.push({champ:{passif:'Passif',ultime:'Ultime',effet:t=='piege'?'Piège':'Effet'}[k],avant:txtEq[k](c0)||null,apres:txtEq[k](c1),sens:0});if(ch[ch.length-1].avant==null)ch[ch.length-1].avant=''}});
      if(!!avant.actif!==!!apres.actif)ch.push({champ:'Disponible',avant:avant.actif?'Oui':'Non',apres:apres.actif?'Oui':'Non',sens:0});
    }
    if(!ch.length)return;
    await sb.from('equilibrage').insert({carte_id:apres.id??avant?.id??null,carte_nom:apres.nom||avant?.nom||'?',carte_type:apres.type||avant?.type||null,changements:ch});
  }catch(x){}
}

  // Cadre à utiliser : celui du type et de la rareté ; s'il n'existe pas encore, la rareté juste en dessous du même type, puis le cadre combattant
  const RG=['ggez','legendaire','epique','rare','commun'];
  const cadresAEssayer=()=>{const t=f.type.value,i=RG.indexOf(tierP(f.rar.value)),L=RG.slice(i).map(r=>`cadres/${t}-${r}.png`);if(t!=='combattant')L.push(`cadres/combattant-${RG[i]}.png`);return L};

    const r=R.rar.find(x=>x.id==f.rar.value);cv.style.setProperty('--g',(r&&r.couleur)||'#7c3aed')};

    if(ED.cadre)x.drawImage(ED.cadre,0,0,W,H)}
  function dessine(){rendre(cv,cv.width,cv.height)}
  chargeCadre();

    const im=new Image();im.onload=()=>{ED.art=im;ED.z=1;ED.x=0;ED.y=0;zm.value=100;$('#paide').textContent='Glisse le dessin pour le placer, et règle le zoom.';$('#pcentre').style.display='';dessine()};im.src=URL.createObjectURL(fi)};
  zm.oninput=()=>{ED.z=+zm.value/100;dessine()};
  $('#pcentre').onclick=()=>{ED.x=0;ED.y=0;ED.z=1;zm.value=100;dessine()};
  {let d=null;cv.onpointerdown=e=>{if(!ED.art)return;d={x:e.clientX,y:e.clientY,ox:ED.x,oy:ED.y};cv.setPointerCapture(e.pointerId)};
   cv.onpointermove=e=>{if(!d)return;const r=cv.getBoundingClientRect();ED.x=d.ox+(e.clientX-d.x)/r.width;ED.y=d.oy+(e.clientY-d.y)/r.height;dessine()};
   cv.onpointerup=cv.onpointercancel=()=>{d=null};
   cv.onwheel=e=>{if(!ED.art)return;e.preventDefault();zm.value=Math.max(100,Math.min(400,+zm.value-Math.sign(e.deltaY)*10));zm.oninput()}}
  f.rar.onchange=chargeCadre;f.type.onchange=chargeCadre;f.col.onchange=()=>{$('#pcolid').style.display=f.col.value=='autre'?'':'none'};if(!R.col.length){f.col.value='autre';f.col.onchange()}
  f.onsubmit=async e=>{e.preventDefault();const fi=f.file.files[0];if(!fi)return;const autre=f.col.value=='autre';
    if(autre&&!f.colidee.value.trim()){alert('Écris ton idée de collection.');return}

    if(up.error){alert(up.error.message);btn.disabled=false;btn.textContent='Envoyer ma proposition';return}
    let pc=null;try{const big=document.createElement('canvas');big.width=1488;big.height=2070;rendre(big,1488,2070);
      const bl=await new Promise(ok=>big.toBlob(ok,'image/png'));if(bl){pc=user.id+'/'+crypto.randomUUID()+'-carte.png';const u2=await sb.storage.from('propositions').upload(pc,bl,{contentType:'image/png'});if(u2.error)pc=null}}catch(x){pc=null}
    const args={p_image:path,p_nom:f.nom.value,p_type:f.type.value,p_rarete:+f.rar.value||null,p_collection:autre?null:+f.col.value,p_collection_idee:autre?f.colidee.value:null,p_idee:f.idee.value};if(pc)args.p_image_carte=pc;
    const r=await sb.rpc('proposer_carte',args);
    if(r.error){await sb.storage.from('propositions').remove([path,...(pc?[pc]:[])]);alert(r.error.message);btn.disabled=false;btn.textContent='Envoyer ma proposition';return}

 coups:['Nb de coups','n'],cible:['Cible',['soi','adversaire']],carte:['Carte',['magie','piege']],seuil:['Seuil (ignoré si aucune condition)','n'],seuilpv:['Seuil (% PV)','n'],

function mk(el,cat){
  el.classList.add('mk');el.innerHTML=`<select><option value="">— Aucun —</option>${Object.entries(cat).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select><div class="row"></div>`;
  const s=el.querySelector('select'),d=el.querySelector('.row');
  s.onchange=()=>{d.innerHTML=s.value?cat[s.value].slice(1).map(k=>{const [l,t]=P[k];
    return `<label><small>${l}</small><br>${t=='n'?`<input data-k="${k}" type="number" step="any">`:`<select data-k="${k}">${t.map(o=>`<option value="${o}">${OL[o]||o}</option>`).join('')}</select>`}</label>`}).join(''):''};
  return {get(){if(!s.value)return null;const o={type:s.value};
    d.querySelectorAll('[data-k]').forEach(i=>o[i.dataset.k]=i.tagName=='INPUT'?(i.value===''?null:+i.value):i.value);return o},
  set(o){if(!o||!o.type)return;s.value=o.type;if(s.value!==o.type){s.value='';return}s.onchange();
    d.querySelectorAll('[data-k]').forEach(i=>{if(o[i.dataset.k]!=null)i.value=o[i.dataset.k]})}};
}

// Multi-effet : plusieurs effets pour une même magie / un même piège (stockés sous forme { briques:[...] })
function mkMulti(el,cat,lab,rem){
  el.innerHTML='<div class="mm"></div><button type="button" class="sec mplus">'+(lab||'+ Ajouter un effet')+'</button>';
  const zone=el.querySelector('.mm'),L=[];
  const add=()=>{const w=document.createElement('div');w.style.cssText='border-left:3px solid #7c3aed;padding-left:8px;margin:6px 0';
    const inner=document.createElement('div'),x=document.createElement('button');x.type='button';x.className='sec';x.textContent=rem||'✕ Retirer cet effet';
    w.append(inner,x);zone.appendChild(w);const m=mk(inner,cat),it={m,w};L.push(it);
    x.onclick=()=>{if(L.length<2)return;w.remove();L.splice(L.indexOf(it),1)};return m};
  el.querySelector('.mplus').onclick=add;add();
  return {get(){const a=L.map(i=>i.m.get()).filter(Boolean);return !a.length?null:a.length==1?a[0]:{briques:a}},
   set(o){if(!o)return;const arr=o.briques||[o];while(L.length>1){L.pop().w.remove()}arr.forEach((b,i)=>{(i==0?L[0].m:add()).set(b)})}};
}

const RANGS_RAR=['ggez','legendaire','epique','rare','commun'];   // GGEZ : au-dessus du légendaire (arc-en-ciel) ;   // du plus haut au plus bas ; un nom inconnu passe après, du plus rare au moins rare selon son poids de drop
function rangRar(r){const n=String((r&&r.nom)||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z]/g,''),i=RANGS_RAR.findIndex(k=>n.includes(k));return[i<0?9:i,+(r&&r.poids)||0]}
function cmpCartes(a,b){const x=rangRar(a.raretes),y=rangRar(b.raretes);return(x[0]-y[0])||(x[1]-y[1])||a.nom.localeCompare(b.nom,'fr')}
const ORD_TYPE={combattant:0,magie:1,piege:2};
function cmpColl(a,b){const ca=a.variantes_carte.cartes,cb=b.variantes_carte.cartes,x=rangRar(ca.raretes),y=rangRar(cb.raretes);return(x[0]-y[0])||(x[1]-y[1])||(ORD_TYPE[ca.type]-ORD_TYPE[cb.type])||ca.nom.localeCompare(cb.nom,'fr')||a.variantes_carte.nom.localeCompare(b.variantes_carte.nom,'fr')}

  return `<small>⭐ Cartes vedettes (0 à 2) : mises en avant dans la boutique. Poids : 1 = comme les autres cartes de sa rareté ; 3 = trois fois plus de chances que chacune des autres cartes de cette rareté dans ce booster. La carte doit faire partie d'une collection du booster (ou être une carte commune sans collection).</small>

      await q(sb.from('dos_cartes').delete().eq('id',id));aDos()};
    c.querySelectorAll('a[data-r]').forEach(a=>a.onclick=async ev=>{ev.preventDefault();
      await q(sb.rpc('admin_retirer_dos',{p_dos:id,p_joueur:a.dataset.r}));aDos()})});
}

/* ---------- Admin : réglages du jeu ---------- */
async function aReglages(){
  const r=await sb.from('reglages_jeu').select('cle,valeur');
  if(r.error){$('#sub').innerHTML='<p class="ko">Les réglages ne sont pas encore disponibles côté Supabase (07-dos-et-reglages.sql). Message de Supabase : <b>'+esc(r.error.message)+'</b></p>';return}
  const v=Object.fromEntries((r.data||[]).map(x=>[x.cle,x.valeur]));
  $('#sub').innerHTML=`<form class="f" id="fr"><label><b>Combats gratuits par jour</b> (commande !combat)<br>
    <small>0 = désactivés. Le compteur repart de zéro chaque jour à minuit, heure de Paris.</small><br>
    <input name="n" type="number" min="0" max="50" value="${esc(v.combats_gratuits_par_jour??1)}" style="width:90px"></label><button>Enregistrer</button></form>
   <h3>Recyclage des doublons</h3><form class="f" id="frc"><small>Ce que rapporte chaque exemplaire en trop. Les fragments sont prêts pour un futur craft : laisse 0 tant qu'il n'existe pas.</small>
   <table><tr><th></th><th>Gold</th><th>Fragments</th></tr>${[['commun','Commun'],['rare','Rare'],['epique','Épique'],['legendaire','Légendaire'],['ggez','GGEZ']].map(([k,n],i)=>`<tr><td>${n}</td><td><input name="g_${k}" type="number" min="0" value="${esc(v['recyclage_gold_'+k]??[5,10,35,80,80][i])}" style="width:80px"></td><td><input name="f_${k}" type="number" min="0" value="${esc(v['recyclage_fragments_'+k]??0)}" style="width:80px"></td></tr>`).join('')}</table><button>Enregistrer le recyclage</button></form>
   <h3>Tests</h3><div class="f"><button class="sec" id="rzc">Remettre à zéro les combats gratuits du jour (tous les joueurs)</button></div>`;
  $('#fr').onsubmit=async e=>{e.preventDefault();const n=Math.max(0,Math.min(50,parseInt(e.target.n.value,10)||0));
    await q(sb.from('reglages_jeu').upsert({cle:'combats_gratuits_par_jour',valeur:String(n)}));alert('Enregistré : '+n+' combat'+(n>1?'s':'')+' gratuit'+(n>1?'s':'')+' par jour.');aReglages()};
  $('#frc').onsubmit=async e=>{e.preventDefault();const f=e.target,rows=[];
    for(const k of['commun','rare','epique','legendaire','ggez']){rows.push({cle:'recyclage_gold_'+k,valeur:String(Math.max(0,parseInt(f['g_'+k].value,10)||0))},{cle:'recyclage_fragments_'+k,valeur:String(Math.max(0,parseInt(f['f_'+k].value,10)||0))})}
    await q(sb.from('reglages_jeu').upsert(rows));PRIX=null;alert('Prix de recyclage enregistrés.');aReglages()};
  $('#rzc').onclick=async()=>{if(!confirm('Remettre à zéro le compteur de combats gratuits de tous les joueurs ?'))return;
    await q(sb.rpc('admin_reset_combats_jour'));alert('Compteurs remis à zéro.')};
}

sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_IN'&&!user)init()});
init();
</script></body></html>
