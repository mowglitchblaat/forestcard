<style>

.pv{font-size:2vh;text-shadow:0 0 4px #000}.sub{font-size:1.7vh;opacity:.8}
.fl{position:absolute;left:50%;top:22%;font-size:10vh;font-weight:900;-webkit-text-stroke:.6vh #000;paint-order:stroke fill;text-shadow:0 0 1.5vh #000;white-space:nowrap;animation:fl 1.5s forwards;pointer-events:none;z-index:8}
.fl.big{font-size:15vh}.fl.sm{font-size:7vh}
@keyframes fl{0%{transform:translate(-50%,0) scale(.3);opacity:0}15%{transform:translate(-50%,-2vh) scale(1.35);opacity:1}30%{transform:translate(-50%,-3vh) scale(1)}75%{opacity:1}100%{transform:translate(-50%,-14vh) scale(1);opacity:0}}

#tour{font-size:2.4vh;opacity:.8;margin-bottom:1vh}
#ctl{position:fixed;left:8px;bottom:8px;z-index:9;display:none;gap:8px;align-items:center;font-size:14px}

function auraRouge(c,o={}){

// ÉCHANGE ATQ/PV : tourbillon bleu et rouge qui s'inverse

  x.save();rr(x,K.x,K.y,K.w,K.h,12);x.clip();const aA=t<.95?cl(t/.3)*.42:0,aC=t>1.1?cl((t-1.1)/.2)*cl((1.9-t)/.4)*.42:0;
  [[aA,0],[aC,1]].forEach(([a,sw])=>{if(a<=0)return;const g=x.createLinearGradient(K.x,0,K.x+K.w,0);g.addColorStop(0,`rgba(${col[sw]},${a})`);g.addColorStop(1,`rgba(${col[1-sw]},${a})`);x.fillStyle=g;x.fillRect(K.x,K.y,K.w,K.h)});

  for(let arm=0;arm<2;arm++)for(let j=0;j<46;j++){const s=j/45,ts=t-s*.28;if(ts<0)continue;const f=fr(ts),ang=ts*7+arm*Math.PI,rad=Rm*Math.pow(f,.85),a=Math.pow(1-s,1.2)*.9,ci=ts>1.02?1-arm:arm;
   orb(x,K.cx+Math.cos(ang)*rad,K.cy+Math.sin(ang)*rad*1.15,K.w*.04*(.4+(1-s)),`rgba(${col[ci]},${a})`,`rgba(${col[ci]},0)`)}})}

function fleches(c,lbl,d){const K=rc(c),up=d>0,A=up?[[90,255,130],[20,150,60]]:[[255,90,90],[150,20,20]],txt=`${lbl} ${up?'+':'−'}${Math.abs(d)}`,N=6,Ar=[];

// DÉFAITE : la carte tremble et se fissure (lueur dans les fentes), flash, puis éclate en morceaux 3D, poussière et débris
function briser(c){const cw=$('#p'+c+' .cw'),card=cw.querySelector('.card'),K=rc(c),cr=[];
 const branch=(px,py,a,len,dep)=>{const pts=[[px,py]];for(let i=0;i<6;i++){a+=R(-.5,.5);px+=Math.cos(a)*len*R(.7,1.1);py+=Math.sin(a)*len*R(.7,1.1);pts.push([px,py]);if(dep<2&&i>1&&Math.random()<.35)branch(px,py,a+R(-1,1),len*.8,dep+1)}cr.push(pts)};
 const ox=K.cx+R(-.1,.1)*K.w,oy=K.cy+R(-.1,.1)*K.h;for(let b=0;b<8;b++)branch(ox,oy,b*.785+R(-.25,.25),K.w*.1,0);
 card.classList.add('tremble');
 addFx(.6,(x,t)=>{rr(x,K.x,K.y,K.w,K.h,12);x.clip();const p=cl(t/.5);x.globalCompositeOperation='lighter';x.lineCap='round';x.lineJoin='round';
  for(const ps of[[10,'rgba(255,170,80,.7)',5],[0,'rgba(255,255,255,.95)',2.2]]){x.shadowColor=ps[1];x.shadowBlur=ps[0];x.strokeStyle=ps[1];x.lineWidth=ps[2];
   for(const pts of cr){const n=p*(pts.length-1),w=Math.floor(n);x.beginPath();x.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<=w;i++)x.lineTo(pts[i][0],pts[i][1]);if(w<pts.length-1){const f=n-w;x.lineTo(pts[w][0]+(pts[w+1][0]-pts[w][0])*f,pts[w][1]+(pts[w+1][1]-pts[w][1])*f)}x.stroke()}}});
 setTimeout(()=>{const NX=5,NY=7,pt=[];for(let j=0;j<=NY;j++){pt[j]=[];for(let i=0;i<=NX;i++)pt[j][i]=[i/NX*100+(i&&i<NX?R(-6,6):0),j/NY*100+(j&&j<NY?R(-5,5):0)]}
  const tris=[];for(let j=0;j<NY;j++)for(let i=0;i<NX;i++){const a=pt[j][i],b=pt[j][i+1],e=pt[j+1][i+1],f=pt[j+1][i];tris.push([a,b,e],[a,e,f])}
  const box=document.createElement('div');Object.assign(box.style,{position:'absolute',left:'0',top:'0',width:'100%',height:'100%',zIndex:'1',pointerEvents:'none'});cw.appendChild(box);
  for(const tri of tris){const s=card.cloneNode(true);s.querySelectorAll('canvas').forEach(n=>n.remove());s.className='card';

   const vx=((tri[0][0]+tri[1][0]+tri[2][0])/3-50)/50,vy=((tri[0][1]+tri[1][1]+tri[2][1])/3-50)/50,dx=vx*K.w*R(.6,1.2)+R(-.1,.1)*K.w,up=-K.h*R(.05,.3)*(vy<0?1.4:.6),dn=K.h*R(.6,1.3),rz=R(-240,240);
   s.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1,easing:'cubic-bezier(.1,.7,.3,1)'},{offset:.3,transform:`translate(${dx*.55}px,${up}px) rotate(${rz*.5}deg)`,opacity:1,easing:'cubic-bezier(.5,0,.9,.6)'},{transform:`translate(${dx}px,${dn}px) rotate(${rz}deg)`,opacity:0}],{duration:R(1200,1800),delay:Math.hypot(vx,vy)*100,fill:'forwards'})}
  setTimeout(()=>box.remove(),2300);
  card.classList.remove('tremble');card.style.visibility='hidden';
  const deb=[],smo=[];for(let i=0;i<18;i++)deb.push({a:Math.random()*6.28,v:R(200,700)*K.w/420,w:R(3,10)*K.w/420,r:Math.random()*6,g:R(.45,.8)});for(let i=0;i<6;i++)smo.push({vx:R(-.9,.9),vy:R(-.7,.5),d:R(0,.25)});
  addFx(1.6,(x,t)=>{x.globalCompositeOperation='lighter';const fu=cl(1-t/.3);if(fu>0)orb(x,K.cx,K.cy,K.w*(.5+t),`rgba(255,255,255,${fu*.9})`,'rgba(255,255,255,0)');
   if(t<.5){const r=K.w*(.2+1.1*cl(t/.5));x.strokeStyle=`rgba(255,235,200,${1-t/.5})`;x.lineWidth=6*(1-t/.5)+1;x.beginPath();x.ellipse(K.cx,K.cy,r,r*1.2,0,0,7);x.stroke()}

   for(const d of deb){const al=cl(1-t/1.4);if(al<=0)continue;x.save();x.translate(K.cx+Math.cos(d.a)*d.v*t,K.cy+Math.sin(d.a)*d.v*t+700*t*t);x.rotate(d.r+t*6);x.fillStyle=`rgba(${190*d.g+40|0},${190*d.g+40|0},${190*d.g+45|0},${al})`;x.fillRect(-d.w,-d.w*.6,d.w*2,d.w*1.2);x.restore()}})
 },520)}

// ÉCHANGE ENTRE DEUX CARTES : lueur qui va de l'une à l'autre et inversement (bleu = ATQ, rouge = PV, bleu+rouge = les deux)
function echangeLien(a,b,col){const A=rc(a),B=rc(b),cols={bleu:[[80,160,255]],rouge:[[255,70,70]],mixte:[[80,160,255],[255,70,70]]}[col]||[[80,160,255]];
 addFx(1.8,(x,t)=>{x.globalCompositeOperation='lighter';const al=Math.sin(Math.PI*cl(t/1.75)),ch=cl(t/.3),p=cl((t-.3)/.85),e=p*p*(3-2*p),arr=cl((t-1.15)/.5);
  [A,B].forEach(K=>cols.forEach(cc=>{x.save();x.shadowColor=`rgba(${cc},${al})`;x.shadowBlur=26;x.strokeStyle=`rgba(${cc},${.8*al})`;x.lineWidth=4;rr(x,K.x,K.y,K.w,K.h,12);x.stroke();x.restore();
   if(t<.3+.85)orb(x,K.cx,K.cy,K.w*.5*ch,`rgba(${cc},${.5*ch*(1-e)})`,`rgba(${cc},0)`)}));
  [[A,B,-1],[B,A,1]].forEach(([S,T,dr])=>{const dx=T.cx-S.cx,dy=T.cy-S.cy,ln=Math.hypot(dx,dy),nx=-dy/ln,ny=dx/ln,Cx=(S.cx+T.cx)/2+nx*dr*S.h*.3,Cy=(S.cy+T.cy)/2+ny*dr*S.h*.3;
   cols.forEach((cc,ci)=>{const P=q=>{const w=cols.length>1?(ci?1:-1)*Math.sin(q*9)*S.h*.04*Math.sin(Math.PI*q):0;return[(1-q)*(1-q)*S.cx+2*(1-q)*q*Cx+q*q*T.cx+nx*w,(1-q)*(1-q)*S.cy+2*(1-q)*q*Cy+q*q*T.cy+ny*w]};
    if(p>0&&p<1){for(let k=22;k>=0;k--){const q=e-k*.018;if(q<0)continue;const[px,py]=P(q),f=Math.pow(1-k/23,1.5),r=S.w*.07*(1-k/32)+3;orb(x,px,py,r*2.2,`rgba(${cc},${.55*f})`,`rgba(${cc},0)`)}
     const[hx,hy]=P(e),r=S.w*.1;orb(x,hx,hy,r*2.6,`rgba(${cc},.6)`,`rgba(${cc},0)`);orb(x,hx,hy,r,'rgba(255,255,255,.95)',`rgba(${cc},0)`)}
    if(arr>0&&arr<1){orb(x,T.cx,T.cy,T.w*(.3+.5*arr),`rgba(${cc},${(1-arr)*.9})`,`rgba(${cc},0)`);x.strokeStyle=`rgba(${cc},${1-arr})`;x.lineWidth=4;x.beginPath();x.arc(T.cx,T.cy,T.w*.55*arr,0,7);x.stroke()}})});
  if(arr>0&&arr<1){orb(x,A.cx,A.cy,A.w*.6,`rgba(255,255,255,${(1-arr)*.35})`,'rgba(255,255,255,0)');orb(x,B.cx,B.cy,B.w*.6,`rgba(255,255,255,${(1-arr)*.35})`,'rgba(255,255,255,0)')}})}

// ÉVITE LA MORT : ailes d'ange gardien
function ailes(c){const K=rc(c),W=K.w,DUR=2.4,rows=[{n:8,L:.8,w:.1,c:'255,255,255'},{n:8,L:.56,w:.12,c:'255,250,235'},{n:7,L:.34,w:.14,c:'255,244,215'}],
 bits=Array.from({length:14},()=>({x:R(0,1),d:R(.5,1.6),s:R(.012,.026),ph:R(0,6),sd:Math.random()<.5?-1:1}));
 function plume(x,L,w,col,a){x.beginPath();x.moveTo(0,0);x.bezierCurveTo(L*.2,-w*1.15,L*.78,-w*1.1,L,0);x.bezierCurveTo(L*.78,w*.95,L*.2,w*1.1,0,0);
  const g=x.createLinearGradient(0,0,L,0);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(.8,`rgba(255,250,235,${a})`);g.addColorStop(1,`rgba(255,228,160,${a*.9})`);x.fillStyle=g;x.fill();
  x.shadowBlur=0;x.strokeStyle=`rgba(225,195,110,${.4*a})`;x.lineWidth=1;x.stroke();x.beginPath();x.moveTo(L*.05,0);x.lineTo(L*.92,0);x.strokeStyle=`rgba(210,185,120,${.45*a})`;x.stroke()}
 addFx(DUR,(x,t)=>{const op=ez(cl(t/.8)),fl=Math.sin(t*6.5)*cl((t-.8)/.3),al=cl((DUR-t)/.55)*cl(t/.2);
  x.globalCompositeOperation='lighter';orb(x,K.cx,K.cy,K.h*.75,`rgba(255,240,190,${.34*al})`,'rgba(255,220,120,0)');x.globalCompositeOperation='source-over';
  for(const sd of[-1,1]){x.save();x.translate(K.cx+sd*W*.5,K.cy-K.h*.1);x.scale(sd,1);
   rows.forEach((rw,ri)=>{for(let i=0;i<rw.n;i++){const f=i/(rw.n-1),ad=-78+112*f+ri*3,ang=(-100+(ad+100)*op+fl*(4+f*5))*Math.PI/180,len=W*rw.L*(.5+.5*Math.sin(Math.PI*(.12+.76*f)))*(.3+.7*op);
    x.save();x.rotate(ang);x.translate(ri*W*.012,0);x.shadowColor='rgba(255,225,140,.8)';x.shadowBlur=ri?0:14;plume(x,len,len*rw.w*1.9,rw.c,.95*al);x.restore()}});x.restore()}
  for(const b of bits){const q=cl((t-.6)/1.6*b.d);if(q<=0||q>=1)continue;const px=K.cx+b.sd*W*(.55+b.x*.7),py=K.cy-K.h*.2+q*K.h*.7;
   x.save();x.translate(px+Math.sin(t*3+b.ph)*W*.04,py);x.rotate(Math.sin(t*3+b.ph)*.8);x.fillStyle=`rgba(255,255,250,${.8*(1-q)*al})`;x.beginPath();x.ellipse(0,0,W*b.s*2.4,W*b.s*.8,0,0,7);x.fill();x.restore()}})}

// RÉANIMATION : auréole d'ange qui brille + symbole de soin (en plus de la lueur de soin)
function aureole(c){const K=rc(c),W=K.w,cx=K.cx;
 addFx(1.9,(x,t,u)=>{const env=Math.sin(Math.PI*cl(u*1.05)),hy=K.y+K.h*.02-K.h*.1*(1-ez(cl(t/.5)));x.globalCompositeOperation='lighter';
  const g=x.createLinearGradient(0,hy,0,K.y+K.h);g.addColorStop(0,`rgba(255,235,150,${.35*env})`);g.addColorStop(1,'rgba(255,235,150,0)');x.fillStyle=g;
  x.beginPath();x.moveTo(cx-W*.2,hy);x.lineTo(cx+W*.2,hy);x.lineTo(K.x+K.w*.92,K.y+K.h);x.lineTo(K.x+K.w*.08,K.y+K.h);x.closePath();x.fill();
  x.save();x.shadowColor=`rgba(255,215,90,${env})`;x.shadowBlur=30*(1+.08*Math.sin(t*10));x.lineWidth=W*.035;x.strokeStyle=`rgba(255,235,150,${env})`;x.beginPath();x.ellipse(cx,hy,W*.2,W*.055,0,0,7);x.stroke();
  x.lineWidth=W*.012;x.strokeStyle=`rgba(255,255,255,${env})`;x.stroke();x.restore();
  const cs=W*.16*(.9+.1*Math.sin(t*8)),tt=cs*.32;x.save();x.shadowColor=`rgba(80,255,160,${env})`;x.shadowBlur=25;x.fillStyle=`rgba(210,255,225,${env})`;x.fillRect(cx-tt/2,K.cy-cs,tt,cs*2);x.fillRect(cx-cs,K.cy-tt/2,cs*2,tt);x.restore()})}

function statut(c,k,on){const key=c+k;st[key]=Math.max(0,(st[key]||0)+(on?1:-1));const card=$('#p'+c+' .card'),f=card.querySelector('canvas.fx.'+k);
 if(st[key]>0&&!f)fxStart(card,k);else if(!st[key]&&f){f._stop();f.remove()}}
function maj(e){[0,1].forEach(i=>{const p=$('#p'+i);p.querySelector('i').style.width=Math.max(0,e.pv[i]/e.max[i]*100)+'%';
 p.querySelector('.pv').textContent=`${Math.max(0,e.pv[i])} / ${e.max[i]} PV · ATQ ${e.atq[i]}`})}
function flot(i,txt,col,cls){const d=document.createElement('div');d.className='fl'+(cls?' '+cls:'');d.textContent=txt;d.style.color=col;$('#p'+i).appendChild(d);setTimeout(()=>d.remove(),1600)}
let enCours=false;const file=[];
async function jouer(res){
 file.push(res);if(enCours)return;enCours=true;
 while(file.length){const R=file.shift();$('#log').innerHTML='';
  for(const e of R.journal){
   $('#ban').className=e.t;$('#ban').textContent=e.txt;$('#log').innerHTML+=e.txt+'<br>';$('#log').scrollTop=1e5;
   if(e.t==='debut'){st={};fxL.length=0;fxAll.forEach(s=>s());fxAll.clear();e.joueurs.forEach((j,i)=>panneau(i,j));$('#scene').classList.add('on');maj(e);await wait(2500);continue}
   if(e.t==='tour'){$('#tour').textContent=e.txt;await wait(700);continue}
   const card=e.c!=null?$('#p'+e.c+' .card'):null;
   if(e.t==='attaque'){card.classList.add('atk');await wait(450);card.classList.remove('atk');continue}
   if(e.k==='echange'){if(e.cs&&e.cs.length===2){echangeLien(e.cs[0],e.cs[1],e.col||'bleu');await sleep(1250)}else{(e.cs||[e.c]).forEach(echange);await sleep(1050)}maj(e);await wait(900);continue}
   if(e.t==='degats'&&e.k==='renvoi')await renvoiFx(e.from,e.c);
   maj(e);
   if(e.t==='degats'){card.classList.add('hit');const ra=e.n/e.max[e.c],gros=ra>=.2&&e.k!=='poison'&&e.k!=='brûlure';flot(e.c,'-'+e.n,e.k==='poison'?'#22ff55':e.k==='brûlure'?'#ff8a00':gros?'#ff1111':'#ff6a6a',gros?'big':'');setTimeout(()=>card.classList.remove('hit'),450)}
   else if(e.t==='soin'){flot(e.c,'+'+e.n,'#4ade80');soin(e.c);if(e.k==='revive')aureole(e.c)}
   else if(e.t==='esquive'){flot(e.c,'Esquive !','#e5e7eb','sm');vent(e.c)}
   else if(e.t==='bloque')bouclier(e.c);
   else if(e.t==='protege')ailes(e.c);
   else if(e.t==='statut'&&e.k==='etourdi'){if(!st[e.c+'etourdi'])statut(e.c,'etourdi',true)}
   else if(e.t==='statut'&&e.k==='etourdi_fin')statut(e.c,'etourdi',false);
   else if(e.t==='statut'&&e.k){statut(e.c,e.k,true);if(e.k==='malediction')cranes(e.c)}
   else if(e.t==='stat'&&e.k==='malediction_tick'){cranes(e.c);flot(e.c,'ATQ '+e.d,'#c084fc')}
   else if(e.t==='stat'&&e.k==='mod'&&e.d)fleches(e.c,e.s,e.d);
   else if(e.t==='finstatut')statut(e.c,e.k,false);
   else if(e.t==='ultime'){card.classList.add('ult');ultFx(e.c);setTimeout(()=>card.classList.remove('ult'),2400)}
   else if(e.t==='magie'){const m=$('#m'+e.c);m.classList.add('act');setTimeout(()=>m.classList.remove('act'),1700)}
   else if(e.t==='piege'){const g=$('#g'+e.c);g.classList.remove('back');g.classList.add('rev');g.textContent=e.img?'':e.carte;g.style.backgroundImage=e.img?`url('${STORAGE+e.img}')`:''}
   const ms={magie:1800,piege:2000,ultime:2200,fin:5000,degats:900,soin:1300,esquive:1100,bloque:1500,statut:1100,stat:1500,vol:1500,protege:2300,finstatut:250}[e.t]||900;
   if(e.t==='fin'){fxAll.forEach(s=>s());fxAll.clear();document.querySelectorAll('canvas.fx').forEach(k=>k.remove());$('#ban').textContent=e.txt+` (+${e.recompenses[e.gagnant??0]})`;if(e.gagnant!=null){briser(1-e.gagnant);auraFx(e.gagnant,{gold:1,dur:5.2})}}
   await wait(ms);
  }
  if(!TEST){$('#scene').classList.remove('on');await wait(800)}
 }
 enCours=false;
}
