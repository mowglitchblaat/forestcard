<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Combat</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b1410;font-family:system-ui,sans-serif;color:#fff}
body.obs{background:transparent}
#scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-around;opacity:0;transition:opacity .6s}
#scene.on{opacity:1}
.p{position:relative;width:22vw;text-align:center}
.card{position:relative;z-index:1;overflow:hidden;width:100%;aspect-ratio:5/7;border-radius:12px;background:#1b2a22 center/cover;display:flex;align-items:center;justify-content:center;font-size:3vh;font-weight:700;box-shadow:0 0 25px #000;transition:transform .15s}
.card.hit{animation:hit .4s}.card.atk{transform:scale(1.07)}.card.ko{filter:grayscale(1) brightness(.5)}
@keyframes hit{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.nm{margin:1vh 0 .5vh;font-size:2.4vh;font-weight:700;text-shadow:0 0 6px #000}
.bar{height:2.4vh;background:#400;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#22c55e;transition:width .5s}
.pv{font-size:2vh;text-shadow:0 0 4px #000}.sub{font-size:1.7vh;opacity:.8}
/* chiffres flottants : au-dessus des cartes et des effets */
.fl{position:absolute;left:50%;top:34%;z-index:12;font-size:8vh;font-weight:900;white-space:nowrap;text-shadow:-.35vh -.35vh 0 #000,.35vh -.35vh 0 #000,-.35vh .35vh 0 #000,.35vh .35vh 0 #000,0 .6vh 1.6vh #000;animation:fl 1.5s ease-out forwards;pointer-events:none}
@keyframes fl{0%{transform:translate(-50%,0) scale(.3);opacity:0}12%{transform:translate(-50%,-1vh) scale(1.35);opacity:1}25%{transform:translate(-50%,-2vh) scale(1)}70%{opacity:1}100%{transform:translate(-50%,-12vh) scale(1);opacity:0}}
#mid{width:34vw;text-align:center}
#ban{font-size:3.4vh;font-weight:800;min-height:10vh;text-shadow:0 0 10px #000}
#ban.magie{color:#60a5fa}#ban.piege{color:#f87171}#ban.ultime{color:#fbbf24;font-size:4.4vh}#ban.fin{color:#a7f3d0;font-size:4.6vh}
#tour{font-size:2.4vh;opacity:.8;margin-bottom:1vh}
#ctl{position:fixed;left:8px;bottom:8px;z-index:9;display:none;gap:8px;align-items:center;font-size:14px}
#ctl button,#ctl select{padding:6px 10px;border-radius:6px;border:0}
#log{position:fixed;left:50%;transform:translateX(-50%);bottom:8px;width:30vw;max-height:16vh;overflow:auto;font:12px/1.4 monospace;background:rgba(0,0,0,.6);padding:6px;border-radius:6px;display:none}

.cw{position:relative}
@keyframes ult{0%,100%{transform:scale(1)}20%,80%{transform:scale(1.06)}}
.card.ult{animation:ult 2.3s ease-in-out}
.mp{display:flex;justify-content:center;gap:2vw;margin-top:1vh}
.mw small{display:block;font-size:1.5vh;opacity:.8;margin-top:.4vh}
.mini{width:6.5vw;aspect-ratio:5/7;border-radius:8px;background:#1b2a22 center/cover;display:flex;align-items:center;justify-content:center;font-size:1.4vh;font-weight:700;padding:3px;box-sizing:border-box;box-shadow:0 0 10px #000}
.mini.vide{opacity:.3}
.mini.back{background:linear-gradient(135deg,#7f1d1d,#1e1b4b);border:3px solid #f87171;font-size:4vh}
.mini.rev{animation:rev .8s;box-shadow:0 0 20px #f87171}
.mini.act{animation:act 1.6s;box-shadow:0 0 20px #60a5fa}
@keyframes rev{from{transform:rotateY(90deg) scale(1.6)}to{transform:none}}
@keyframes act{30%,70%{transform:scale(1.4);box-shadow:0 0 30px 10px #60a5fa}}
canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
canvas.fx.brulure{box-shadow:inset 0 0 35px 10px rgba(249,115,22,.9);animation:fg .4s infinite alternate}
@keyframes fg{to{box-shadow:inset 0 0 55px 18px rgba(255,160,30,.95)}}
canvas.fx.poison{box-shadow:inset 0 0 40px 12px rgba(34,197,94,.75);animation:pg 1.6s infinite alternate}
@keyframes pg{to{box-shadow:inset 0 0 60px 20px rgba(60,220,90,.85)}}
#fxs{position:fixed;inset:0;width:100%;height:100%;z-index:7;pointer-events:none}
@keyframes dodge{0%{transform:none}25%{transform:translateX(calc(var(--dx)*5vw)) rotate(calc(var(--dx)*7deg)) skewX(calc(var(--dx)*-10deg))}100%{transform:none}}
.card.dodge{animation:dodge .85s cubic-bezier(.2,.8,.3,1)}
@keyframes tremble{0%{transform:none}10%{transform:translate(-2px,1px) rotate(-.3deg)}20%{transform:translate(3px,-1px) rotate(.4deg)}30%{transform:translate(-4px,2px) rotate(-.6deg)}40%{transform:translate(4px,-2px) rotate(.7deg)}50%{transform:translate(-5px,2px) rotate(-.8deg)}60%{transform:translate(5px,-3px) rotate(.9deg)}70%{transform:translate(-6px,3px) rotate(-1deg)}80%{transform:translate(6px,-3px) rotate(1deg)}90%{transform:translate(-7px,3px) rotate(-1.1deg)}100%{transform:translate(7px,-3px) rotate(1.1deg)}}
.card.tremble{animation:tremble .52s linear forwards}
canvas.fx.etourdi{box-shadow:inset 0 0 25px 6px rgba(250,204,21,.5)}
#demo{position:fixed;left:50%;top:3vh;transform:translateX(-50%);width:34vw;max-height:94vh;overflow:auto;background:rgba(0,0,0,.55);border-radius:12px;padding:10px;font:13px system-ui;z-index:9;display:none}
#demo h4{margin:8px 0 4px;font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:.08em}
#demo .g{display:grid;grid-template-columns:1fr 1fr;gap:4px}
#demo button,#demo select{padding:7px 6px;border:0;border-radius:6px;background:#1f3a2c;color:#e8fff1;cursor:pointer;font-size:12px}
#demo button:hover{background:#2f6a4a}#demo .big{background:#7c2d12;font-weight:700;width:100%;margin-bottom:4px}
#dl{font:700 16px system-ui;min-height:40px;text-align:center;color:#fde68a;margin-bottom:6px}
</style></head><body>
<div id="scene"><div class="p" id="p0"></div>
<div id="mid"><div id="tour"></div><div id="ban"></div></div><div class="p" id="p1"></div></div>
<div id="ctl"><button id="nv">⚔️ Nouveau combat</button><button id="rj">↺ Rejouer le même</button><button id="ts">🔥☠️ Test brûlure + poison</button>
Vitesse <select id="vit"><option value="1.6">Lent</option><option value="1" selected>Normal</option><option value=".5">Rapide</option></select></div>

<script>
if(/demo|test|debug/.test(location.search))addEventListener('error',e=>{let b=document.getElementById('errbox');if(!b){b=document.createElement('div');b.id='errbox';b.style.cssText='position:fixed;left:8px;top:8px;max-width:60vw;background:#7f1d1d;color:#fff;font:12px monospace;padding:6px 10px;border-radius:6px;z-index:99;white-space:pre-wrap';document.body.appendChild(b)}
 b.textContent+=e.target&&e.target.src?'Fichier introuvable : '+e.target.src.split('/').pop()+'\n':'Erreur : '+e.message+' ('+(e.filename||'').split('/').pop()+':'+e.lineno+')\n'},true);
</script>
<script>
/* ===== Moteur de combat (copie intégrée : combat.html fonctionne seul) ===== */
/* Moteur de combat — Jeu de cartes Twitch
   simuler(joueurA, joueurB, {seed, regles}) -> { journal, gagnant, recompenses, ... }
   joueur = { pseudo, deck:[carte...] } ; carte = ligne de la table `cartes` (type, nom, atq, pv, passif, ultime, effet, image)
   Le calcul est entièrement déterminé par la seed : même seed = même combat (rejouable). */
(function(g){
const REG={maxTours:10,gain:50,perte:10,nul:20,plafondEsquive:75};
const VM={nom:'Aucune magie',effet:null,vide:1},VP={nom:'Aucun piège',effet:null,vide:1};
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rd=Math.round;

function simuler(pA,pB,opt={}){
 const seed=opt.seed??(Math.random()*1e9|0),r=rng(seed),reg={...REG,...opt.regles},J=[];
 const roll=p=>r()*100<(p||0);
 const tire=(deck,t)=>{const l=deck.filter(c=>c.type===t);return l[Math.floor(r()*l.length)]};
 const nw=p=>{const c=tire(p.deck,'combattant');if(!c)throw new Error(p.pseudo+" n'a aucun combattant dans son deck");const pa=c.passif||{};
  return{pseudo:p.pseudo,deck:p.deck,card:c,mag:tire(p.deck,'magie')||VM,pie:tire(p.deck,'piege')||VP,atq:c.atq,pv:c.pv,max:c.pv,pas:pa,ult:c.ultime,
   magOn:1,pieOn:1,decl:0,mdelta:[],st:{stun:0,skip:0,dbl:0,dots:[],ren:[],insens:0,prog:[],evite:pa.type==='evite_mort',mortUsed:0,bonus:0},
   cum:0,coups:0,rt:0,uses:0,last:-99,pend:0}};
 const S=[nw(pA),nw(pB)],id=s=>S.indexOf(s),adv=s=>S[1-id(s)],nom=s=>s.card.nom;
 S.forEach(s=>{if(s.mag.vide)s.magOn=0;if(s.pie.vide)s.pieOn=0});
 let tour=0,rv=0;
 const L=(t,txt,o={})=>J.push({t,txt,...o,tour,pv:S.map(s=>s.pv),max:S.map(s=>s.max),atq:S.map(s=>s.atq)});
 const amt=(e,b)=>e.u==='pct'?rd(b*e.val/100):(e.val||0);
 const over=()=>S.some(s=>s.pv<=0);

 function heal(s,n,k){n=Math.min(n,s.max-s.pv);if(n<=0)return;s.pv+=n;L('soin',`${nom(s)} récupère ${n} PV`,{c:id(s),n,k:k||(rv?'revive':undefined)});scan({t:'soin',who:id(s)})}
 function dmg(src,dst,n){
  n=Math.max(0,rd(n));
  if(n>=dst.pv)scan({t:'mort',who:id(dst)});               // piège « le propriétaire meurt » : juste avant la mort
  let after=null;
  if(n>=dst.pv){
   const m=dst.magOn&&dst.mag.effet&&dst.mag.effet.type==='mort_evitee'?dst.mag.effet:null;
   if(m&&!dst.st.mortUsed&&(m.cond==='pv_max'?dst.max>=m.seuil:dst.cum>=m.seuil)){
    dst.st.mortUsed=1;n=dst.pv-1;L('protege',`${nom(dst)} évite la mort (1 PV) !`,{c:id(dst)});if(m.pct)after=()=>heal(dst,rd(dst.max*m.pct/100),'revive');
   }else if(dst.st.evite){dst.st.evite=0;n=dst.pv-1;L('protege',`${nom(dst)} évite la mort (passif) !`,{c:id(dst)})}
  }
  dst.pv-=n;src.cum+=n;if(after)after();scan({t:'pv'});return n;
 }
 // Pièges : chaque événement du combat est « scanné » pour voir si une condition est remplie
 function scan(ev){S.forEach((o,i)=>{
  const e=o.pie.effet;if(!o.pieOn||!e||!e.condition||o.decl>=(e.declenchements||1))return;
  const c=e.condition,x=adv(o),ia=1-i;
  const ok={adv_attaque:ev.t==='attaque'&&ev.by===ia&&x.coups===c.coups,adv_ultime:ev.t==='ultime'&&ev.by===ia,
   proprio_pv_sous:ev.t==='pv'&&o.pv>0&&o.pv/o.max*100<c.seuilpv,adv_pv_bas:ev.t==='pv'&&x.pv>0&&x.pv/x.max*100<c.seuilpv,
   adv_soigne:ev.t==='soin'&&ev.who===ia,proprio_soigne:ev.t==='soin'&&ev.who===i,proprio_meurt:ev.t==='mort'&&ev.who===i}[c.type];
  if(!ok)return;
  if(x.st.insens>0){L('piege',`Le piège de ${o.pseudo} est bloqué (insensible)`,{c:i});return}
  o.decl++;L('piege',`Piège de ${o.pseudo} : ${o.pie.nom} !`,{c:i,carte:o.pie.nom,img:o.pie.image||null});if(c.type==='proprio_meurt')rv=1;fx(e.effet,o,x);rv=0;S.forEach(s=>s.pend=1);
 })}
 // Effets : o = propriétaire de l'effet, x = adversaire. mg=true : effet de magie (annulable/volable)
 function fx(e,o,x,mg){
  if(!e)return;
  if(e.briques){e.briques.forEach(b=>fx(b,o,x,mg));return}      // effet « maison » composé de briques de base
  const T=e.cible==='adversaire'?x:o;
  const delta=(s,k,d)=>{if(mg)o.mdelta.push({s,k,d})};
  switch(e.type){
   case'atq_mod':{const d=amt(e,T.atq);T.atq=Math.max(0,T.atq+d);delta(T,'atq',d);L('stat',`ATQ de ${nom(T)} ${d>=0?'+':''}${d}`,{c:id(T),k:'mod',s:'ATQ',d});break}
   case'pv_mod':{const d=amt(e,T.max);T.max=Math.max(1,T.max+d);T.pv=Math.max(1,Math.min(T.max,T.pv+d));delta(T,'max',d);L('stat',`PV max de ${nom(T)} ${d>=0?'+':''}${d}`,{c:id(T),k:'mod',s:'PV max',d});break}
   case'soin':heal(o,amt(e,o.max));break;
   case'degats':{const n=dmg(o,x,e.val);L('degats',`${nom(x)} subit ${n} dégâts directs`,{c:id(x),n});break}
   case'vol_vie':{const n=dmg(o,x,e.val);L('degats',`${nom(x)} subit ${n} dégâts`,{c:id(x),n});heal(o,n);break}
   case'annule_attaque':x.st.skip=1;L('statut',`La prochaine attaque de ${nom(x)} est annulée`,{c:id(x)});break;
   case'renvoi':o.st.ren.push({pct:e.val,t:e.tours||1});break;
   case'insensible_piege':o.st.insens=e.tours||1;break;
   case'annule_magies':if(x.magOn){x.magOn=0;undo(x);L('statut',`La magie de ${x.pseudo} est annulée`,{c:id(x)})}break;
   case'degats_tours':x.st.prog.push({t:e.tours||1,n:e.val,src:o});break;
   case'double_degats':o.st.dbl=e.tours||1;L('statut',`${nom(o)} double ses dégâts`,{c:id(o)});break;
   case'echange_atq':[o.atq,x.atq]=[x.atq,o.atq];L('stat',`${nom(o)} et ${nom(x)} échangent leur ATQ`,{k:'echange',cs:[id(o),id(x)],col:'bleu'});break;
   case'echange_atq_def':[x.atq,x.pv]=[x.pv,x.atq];x.max=Math.max(x.max,x.pv);L('stat',`${nom(x)} : ATQ et PV échangés`,{k:'echange',c:id(x)});break;
   case'echange_pv':[o.pv,x.pv]=[x.pv,o.pv];[o.max,x.max]=[x.max,o.max];L('stat',`${nom(o)} et ${nom(x)} échangent leurs PV`,{k:'echange',cs:[id(o),id(x)],col:'rouge'});break;
   case'echange_tout':[o.atq,x.atq]=[x.atq,o.atq];[o.pv,x.pv]=[x.pv,o.pv];[o.max,x.max]=[x.max,o.max];L('stat',`${nom(o)} et ${nom(x)} échangent ATQ et PV`,{k:'echange',cs:[id(o),id(x)],col:'mixte'});break;
   case'mort_evitee':break;                                    // lue directement dans dmg()
   case'detruire':case'voler':{
    if(e.carte==='magie'&&x.magOn){x.magOn=0;undo(x);if(e.type==='voler'){fx(x.mag.effet,o,x,true);L('vol',`${o.pseudo} vole la magie de ${x.pseudo}`)}else L('vol',`La magie de ${x.pseudo} est détruite`)}
    else if(e.carte==='piege'&&x.pieOn){x.pieOn=0;if(e.type==='voler'){o.pie=x.pie;o.pieOn=1;o.decl=0;L('vol',`${o.pseudo} vole le piège de ${x.pseudo}`)}else L('vol',`Le piège de ${x.pseudo} est détruit`)}
    break}
   case'equiper':{const c=tire(o.deck.filter(k=>k!==o.mag&&k!==o.pie),e.carte);if(c){if(e.carte==='magie'){o.mag=c;o.magOn=1;fx(c.effet,o,x,true)}else{o.pie=c;o.pieOn=1;o.decl=0}L('vol',`${nom(o)} équipe ${c.nom}`)}break}
   default:L('inconnu',`Effet non géré par le moteur : ${e.type}`);
  }
 }
 function undo(s){s.mdelta.forEach(d=>{d.s[d.k]-=d.d;if(d.k==='max')d.s.pv=Math.min(d.s.pv,d.s.max)});s.mdelta=[]}

 function ultime(s){
  const u=s.ult;if(!u||!u.type||s.pv<=0)return;
  if(u.utilisations>0&&s.uses>=u.utilisations)return;
  if(tour-s.last<(u.delai_tours||0))return;
  if(!((u.apres_tours&&tour>=u.apres_tours)||(u.sur_carte&&s.pend)))return;
  s.uses++;s.last=tour;s.pend=0;L('ultime',`ULTIME de ${nom(s)} !`,{c:id(s)});fx(u,s,adv(s));scan({t:'ultime',by:id(s)});
 }
 function attaque(a){
  const d=adv(a),ia=id(a),idd=id(d);
  if(a.st.stun){a.st.stun=0;L('statut',`${nom(a)} est étourdi, il n'attaque pas`,{c:ia,k:'etourdi_fin'});return}
  if(a.st.skip){a.st.skip=0;L('bloque',`L'attaque de ${nom(a)} est annulée`,{c:id(adv(a))});return}
  const multi=a.pas.type==='multi_frappe'&&roll(a.pas.chance)?a.pas.frappes:1;
  a.coups++;L('attaque',`${nom(a)} attaque${multi>1?` (${multi} frappes)`:''}`,{c:ia});
  for(let k=0;k<multi&&d.pv>0;k++){
   if(d.pas.type==='esquive'&&roll(Math.min(reg.plafondEsquive,d.pas.chance))){L('esquive',`${nom(d)} esquive !`,{c:idd});continue} // l'esquive annule aussi les effets associés
   let n=a.atq*(a.st.dbl>0?2:1)+a.st.bonus;a.st.bonus=0;
   if(d.pas.type==='reduc_degats'&&roll(d.pas.chance)){L('bloque',`${nom(d)} bloque une partie des dégâts`,{c:idd});n=Math.max(0,n-amt(d.pas,n))}
   d.rt++;n=dmg(a,d,n);L('degats',`${nom(d)} subit ${n} dégâts`,{c:idd,n});
   if(d.pas.type==='renvoi'&&n>0){const b=dmg(d,a,amt(d.pas,n));L('degats',`${nom(a)} subit ${b} dégâts renvoyés`,{c:ia,n:b,k:'renvoi',from:idd})}
   d.st.ren.forEach(R=>{const b=dmg(d,a,n*R.pct/100);if(b>0)L('degats',`${nom(a)} subit ${b} dégâts renvoyés`,{c:ia,n:b,k:'renvoi',from:idd})});
   const p=a.pas;
   if(n>0&&d.pv>0){
    if(p.type==='vol_pct_atq'&&roll(p.chance))heal(a,rd(n*p.pctatq/100));
    if(p.type==='etourdir'&&roll(p.chance)){d.st.stun=1;L('statut',`${nom(d)} est étourdi !`,{c:idd,k:'etourdi'})}
    if(p.type==='brulure'&&roll(p.chance)){d.st.dots.push({k:'brûlure',n:rd(d.max*p.pctpv/100),t:p.tours});L('statut',`${nom(d)} brûle !`,{c:idd,k:'brulure'})}
    if(p.type==='poison'&&roll(p.chance)){d.st.dots.push({k:'poison',n:p.degtour,t:p.tours});L('statut',`${nom(d)} est empoisonné !`,{c:idd,k:'poison'})}
   }
   if(over())return;
  }
  scan({t:'attaque',by:ia});
 }
 function finDeTour(){
  S.forEach(s=>{if(s.pv<=0)return;const x=adv(s);
   s.st.dots=s.st.dots.filter(d=>{const n=dmg(x,s,d.n);L('degats',`${nom(s)} subit ${n} (${d.k})`,{c:id(s),n,k:d.k});if(--d.t>0)return true;L('finstatut',`${d.k} de ${nom(s)} se termine`,{c:id(s),k:d.k==='poison'?'poison':'brulure'});return false});
   if(s.pas.type==='soin_tour')heal(s,amt(s.pas,s.max));
   if(s.pas.type==='atq_tours'&&tour%s.pas.tours===0){const dd=amt(s.pas,s.atq);s.atq+=dd;L('stat',`ATQ de ${nom(s)} +${dd}`,{c:id(s),k:'mod',s:'ATQ',d:dd})}
   if(s.pas.type==='pv_tours'&&tour%s.pas.tours===0){const d=amt(s.pas,s.max);s.max+=d;s.pv+=d;L('stat',`PV max de ${nom(s)} +${d}`,{c:id(s),k:'mod',s:'PV max',d})}
   if(s.pas.type==='bonus_frappe'&&s.rt>=s.pas.coups){s.st.bonus=amt(s.pas,s.atq);L('statut',`${nom(s)} prépare une contre-attaque renforcée`,{c:id(s)})}
   s.st.prog=s.st.prog.filter(p=>{if(--p.t>0)return true;const n=dmg(p.src,s,p.n);L('degats',`${nom(s)} subit ${n} (dégâts différés)`,{c:id(s),n});return false});
   s.st.ren=s.st.ren.filter(R=>--R.t>0);if(s.st.insens>0)s.st.insens--;if(s.st.dbl>0)s.st.dbl--;
  });
 }

 // ---- Déroulé ----
 const first=r()<.5?0:1,ordre=[S[first],S[1-first]];
 L('debut','Le combat commence !',{joueurs:S.map(s=>({pseudo:s.pseudo,carte:s.card.nom,image:s.card.image||null,magie:s.mag.nom,piege:s.pie.nom,magieImg:s.mag.image||null,piegeImg:s.pie.image||null})),premier:first});

function aureole(c){const K=rc(c),W=K.w,cx=K.cx;
 addFx(1.9,(x,t,u)=>{const env=Math.sin(Math.PI*cl(u*1.05)),hy=K.y+K.h*.02-K.h*.1*(1-ez(cl(t/.5)));x.globalCompositeOperation='lighter';
  const g=x.createLinearGradient(0,hy,0,K.y+K.h);g.addColorStop(0,`rgba(255,235,150,${.35*env})`);g.addColorStop(1,'rgba(255,235,150,0)');x.fillStyle=g;
  x.beginPath();x.moveTo(cx-W*.2,hy);x.lineTo(cx+W*.2,hy);x.lineTo(K.x+K.w*.92,K.y+K.h);x.lineTo(K.x+K.w*.08,K.y+K.h);x.closePath();x.fill();
  x.save();x.shadowColor=`rgba(255,215,90,${env})`;x.shadowBlur=30*(1+.08*Math.sin(t*10));x.lineWidth=W*.035;x.strokeStyle=`rgba(255,235,150,${env})`;x.beginPath();x.ellipse(cx,hy,W*.2,W*.055,0,0,7);x.stroke();
  x.lineWidth=W*.012;x.strokeStyle=`rgba(255,255,255,${env})`;x.stroke();x.restore();
  const cs=W*.16*(.9+.1*Math.sin(t*8)),tt=cs*.32;x.save();x.shadowColor=`rgba(80,255,160,${env})`;x.shadowBlur=25;x.fillStyle=`rgba(210,255,225,${env})`;x.fillRect(cx-tt/2,K.cy-cs,tt,cs*2);x.fillRect(cx-cs,K.cy-tt/2,cs*2,tt);x.restore()})}

function statut(c,k,on){const key=c+k;st[key]=Math.max(0,(st[key]||0)+(on?1:-1));const card=$('#p'+c+' .card'),f=card.querySelector('canvas.fx.'+k);
 if(st[key]>0&&!f)fxStart(card,k);else if(!st[key]&&f){f._stop();f.remove()}}
function maj(e){[0,1].forEach(i=>{const p=$('#p'+i);p.querySelector('i').style.width=Math.max(0,e.pv[i]/e.max[i]*100)+'%';
 p.querySelector('.pv').textContent=`${Math.max(0,e.pv[i])} / ${e.max[i]} PV · ATQ ${e.atq[i]}`})}
function flot(i,txt,col){const d=document.createElement('div');d.className='fl';d.textContent=txt;d.style.color=col;$('#p'+i).appendChild(d);setTimeout(()=>d.remove(),1300)}
let enCours=false;const file=[];
async function jouer(res){
 file.push(res);if(enCours)return;enCours=true;
 while(file.length){const R=file.shift();$('#log').innerHTML='';
  for(const e of R.journal){
   $('#ban').className=e.t;$('#ban').textContent=e.txt;$('#log').innerHTML+=e.txt+'<br>';$('#log').scrollTop=1e5;
   if(e.t==='debut'){st={};fxL.length=0;fxAll.forEach(s=>s());fxAll.clear();e.joueurs.forEach((j,i)=>panneau(i,j));$('#scene').classList.add('on');maj(e);await wait(2500);continue}
   if(e.t==='tour'){$('#tour').textContent=e.txt;await wait(700);continue}
   const card=e.c!=null?$('#p'+e.c+' .card'):null;
   if(e.t==='attaque'){card.classList.add('atk');await wait(450);card.classList.remove('atk');continue}
   if(e.k==='echange'){if(e.cs&&e.cs.length===2){echangeLien(e.cs[0],e.cs[1],e.col||'bleu');await sleep(1250)}else{(e.cs||[e.c]).forEach(echange);await sleep(1050)}maj(e);await wait(900);continue}
   if(e.t==='degats'&&e.k==='renvoi')await renvoiFx(e.from,e.c);
   maj(e);
   if(e.t==='degats'){card.classList.add('hit');flot(e.c,'-'+e.n,e.k==='poison'?'#4ade80':e.k==='brûlure'?'#fb923c':'#f87171');setTimeout(()=>card.classList.remove('hit'),450)}
   else if(e.t==='soin'){flot(e.c,'+'+e.n,'#4ade80');soin(e.c);if(e.k==='revive')aureole(e.c)}
   else if(e.t==='esquive'){flot(e.c,'Esquive !','#e5e7eb');vent(e.c)}
   else if(e.t==='bloque')bouclier(e.c);
   else if(e.t==='protege')ailes(e.c);
   else if(e.t==='statut'&&e.k==='etourdi'){if(!st[e.c+'etourdi'])statut(e.c,'etourdi',true)}
   else if(e.t==='statut'&&e.k==='etourdi_fin')statut(e.c,'etourdi',false);
   else if(e.t==='statut'&&e.k)statut(e.c,e.k,true);
   else if(e.t==='stat'&&e.k==='mod'&&e.d)fleches(e.c,e.s,e.d);
   else if(e.t==='finstatut')statut(e.c,e.k,false);
   else if(e.t==='ultime'){card.classList.add('ult');ultFx(e.c);setTimeout(()=>card.classList.remove('ult'),2400)}
   else if(e.t==='magie'){const m=$('#m'+e.c);m.classList.add('act');setTimeout(()=>m.classList.remove('act'),1700)}
   else if(e.t==='piege'){const g=$('#g'+e.c);g.classList.remove('back');g.classList.add('rev');g.textContent=e.img?'':e.carte;g.style.backgroundImage=e.img?`url('${STORAGE+e.img}')`:''}
   const ms={magie:1800,piege:2000,ultime:2200,fin:5000,degats:900,soin:1300,esquive:1100,bloque:1500,statut:1100,stat:1500,vol:1500,protege:2300,finstatut:250}[e.t]||900;
   if(e.t==='fin'){fxAll.forEach(s=>s());fxAll.clear();document.querySelectorAll('canvas.fx').forEach(k=>k.remove());$('#ban').textContent=e.txt+` (+${e.recompenses[e.gagnant??0]})`;if(e.gagnant!=null){briser(1-e.gagnant);auraFx(e.gagnant,{gold:1,dur:5.2})}}
   await wait(ms);
  }
  if(!TEST){$('#scene').classList.remove('on');await wait(800)}
 }
 enCours=false;
}

  const m=DECK.filter(c=>c.type!=='combattant');dernier=Moteur.simuler({pseudo:'Toi',deck:[A,...m]},{pseudo:'Bot',deck:[B,...m]},{seed:7});jouer(dernier)};
 $('#rj').onclick=()=>{if(!enCours&&dernier)lancer(dernier.seed)}}


// ---------- Mode démo : tous les effets, un bouton chacun (combat.html?demo) ----------
if(DEMO){
 const dm=document.createElement('div');dm.id='demo';document.body.appendChild(dm);dm.style.display='block';if(TEST)$('#mid').style.marginTop='38vh';else $('#mid').style.visibility='hidden';document.body.style.background='#0b1410';
 const J=i=>({pseudo:i?'Bot':'Toi',carte:i?'Spectre':'Chasseur',magie:'Rage',piege:'Riposte'});
 const mk=()=>{$('#ban').textContent='';$('#tour').textContent='';fxAll.forEach(s=>s());fxAll.clear();fxL.length=0;st={};document.getAnimations().forEach(a=>a.cancel());document.querySelectorAll('canvas.fx').forEach(k=>k.remove());[0,1].forEach(i=>panneau(i,J(i)));maj({pv:[70,70],max:[70,70],atq:[12,12]});$('#scene').classList.add('on')};
 const cardOf=c=>$('#p'+c+' .card'),has=(c,k)=>!!cardOf(c).querySelector('canvas.fx.'+k);
 const S=[
  ['Défense','Esquive',c=>{flot(c,'Esquive !','#e5e7eb');vent(c)},1700],
  ['Défense','Blocage (bouclier)',c=>bouclier(c),1600],
  ['Défense','Renvoi de dégâts',c=>bouclier(c,{to:1-c}),2100],
  ['Défense','Évite la mort (ailes)',c=>ailes(c),2400],
  ['Défense','Réanimation (auréole)',c=>{flot(c,'+20','#4ade80');soin(c);aureole(c)},2000],
  ['Soin et stats','Soin',c=>{flot(c,'+15','#4ade80');soin(c)},1600],
  ['Soin et stats','Hausse d\'ATQ',c=>fleches(c,'ATQ',4),1700],
  ['Soin et stats','Baisse d\'ATQ',c=>fleches(c,'ATQ',-4),1700],
  ['Soin et stats','Hausse de PV max',c=>fleches(c,'PV max',6),1700],
  ['Soin et stats','Baisse de PV max',c=>fleches(c,'PV max',-6),1700],
  ['Échanges','Échange d\'ATQ (bleu)',()=>echangeLien(0,1,'bleu'),2000],
  ['Échanges','Échange de PV (rouge)',()=>echangeLien(0,1,'rouge'),2000],
  ['Échanges','Échange ATQ + PV (mixte)',()=>echangeLien(0,1,'mixte'),2000],
  ['Échanges','Tourbillon (une seule carte)',c=>echange(c),2000],
  ['Statuts','Brûlure',c=>statut(c,'brulure',true),2800,c=>statut(c,'brulure',false),'brulure'],
  ['Statuts','Poison',c=>statut(c,'poison',true),2800,c=>statut(c,'poison',false),'poison'],
  ['Statuts','Étourdissement',c=>statut(c,'etourdi',true),2800,c=>statut(c,'etourdi',false),'etourdi'],
  ['Combat','Ultime (aura démoniaque)',c=>{const k=cardOf(c);k.classList.add('ult');auraFx(c);setTimeout(()=>k.classList.remove('ult'),2800)},2900],
  ['Combat','Dégâts',c=>{const k=cardOf(c);k.classList.add('hit');flot(c,'-12','#f87171');setTimeout(()=>k.classList.remove('hit'),450)},1100],
  ['Combat','Coup qui touche',c=>{const a=cardOf(1-c),k=cardOf(c);a.classList.add('atk');setTimeout(()=>a.classList.remove('atk'),450);setTimeout(()=>{k.classList.add('hit');flot(c,'-14','#f87171');setTimeout(()=>k.classList.remove('hit'),450)},450)},1700],
  ['Combat','Coup esquivé',c=>{const a=cardOf(1-c);a.classList.add('atk');setTimeout(()=>a.classList.remove('atk'),450);setTimeout(()=>{flot(c,'Esquive !','#e5e7eb');vent(c)},450)},1900],
  ['Combat','Gros dégâts (−42)',c=>{const k=cardOf(c);k.classList.add('hit');flot(c,'-42','#f87171');setTimeout(()=>k.classList.remove('hit'),450)},1600],
  ['Combat','Dégâts poison puis brûlure',c=>{flot(c,'-3','#4ade80');setTimeout(()=>flot(c,'-4','#fb923c'),600)},1800],
  ['Combat','Magie activée',c=>{const m=$('#m'+c);m.classList.add('act');setTimeout(()=>m.classList.remove('act'),1700)},1800],

  ['Fin','Défaite + victoire dorée',c=>{briser(1-c);auraFx(c,{gold:1})},5400,null,null,true]];
 const tg=()=>+$('#dc').value,dw=ms=>new Promise(r=>setTimeout(r,ms*(location.search.includes('fast')?.12:1)));
 const lab=(s,c)=>{$('#dl').textContent=s[1]+(s[0]==='Échanges'?'':' — '+(c?'Bot':'Toi'))};
 const run=(s,c)=>{lab(s,c);if(s[4]&&has(c,s[5])){s[4](c);return}s[3+0]&&s[2](c);if(s[6])setTimeout(mk,s[3]+1500)};
 let html='<div style="font-size:10px;opacity:.5;text-align:right">combat.html v8 — test des effets</div><div id="dl">Choisis un effet ↓</div><button class="big" id="dseq">▶ Tout enchaîner</button><div style="display:flex;gap:6px;margin-bottom:4px"><select id="dc"><option value="0">Cible : Toi (gauche)</option><option value="1">Cible : Bot (droite)</option></select><button id="drs">↺ Réinitialiser</button></div>',g='';
 S.forEach((s,i)=>{if(s[0]!==g){if(g)html+='</div>';html+=`<h4>${s[0]}</h4><div class="g">`;g=s[0]}html+=`<button data-i="${i}">${s[1]}</button>`});html+='</div>';dm.innerHTML=html;
 dm.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>run(S[+b.dataset.i],tg()));
 $('#drs').onclick=mk;let seq=false;

  for(let i=0;i<S.length;i++){const s=S[i],c=i%2;lab(s,c);s[2](c);await dw(s[3]);if(s[4])s[4](c)}
  $('#dl').textContent='Fin de la démo';await dw(1500);mk();seq=false};
 mk();
}

// ---------- Mode live : reçoit le journal par WebSocket (Streamer.bot) ----------
function extraire(d){for(let k=0;k<4;k++){if(typeof d==='string'){try{d=JSON.parse(d)}catch(x){return null}}
 if(Array.isArray(d))d=d[0];if(d&&d.journal)return d;if(d&&d.data)d=d.data;else return null}return null}
function connect(){const ws=new WebSocket('ws://127.0.0.1:8080/');
 ws.onopen=()=>ws.send(JSON.stringify({request:'Subscribe',id:'sub-combat',events:{General:['Custom']}}));
 ws.onmessage=e=>{const r=extraire(e.data);if(r)jouer(r)};
 ws.onclose=()=>setTimeout(connect,3000);ws.onerror=()=>ws.close()}
if(!TEST&&!DEMO)connect();
